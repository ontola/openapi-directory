    contact_create:
      content:
        application/json:
          schema:
            type: object
            required:
              - given_name
            properties:
              birthday:
                $ref: '#/components/schemas/contact_birthday'
              company_name:
                $ref: '#/components/schemas/contact_company_name'
              emails:
                type: array
                items:
                  $ref: '#/components/schemas/contact_email'
              given_name:
                $ref: '#/components/schemas/contact_given_name'
              groups:
                type: array
                description: |-
                  The IDs of existing explicit provider-backed groups that the contact should belong to.
                  Address-book containers and aggregate views such as iCloud All Contacts are not groups.
                items:
                  $ref: '#/components/schemas/contact_group_id'
              im_addresses:
                type: array
                items:
                  $ref: '#/components/schemas/contact_im_address'
              job_title:
                $ref: '#/components/schemas/contact_job_title'
              manager_name:
                $ref: '#/components/schemas/contact_manager_name'
              metadata:
                $ref: '#/components/schemas/metadata'
              middle_name:
                $ref: '#/components/schemas/contact_middle_name'
              nickname:
                $ref: '#/components/schemas/contact_nickname'
              notes:
                $ref: '#/components/schemas/contact_notes'
              office_location:
                $ref: '#/components/schemas/contact_office_location'
              phone_numbers:
                type: array
                items:
                  $ref: '#/components/schemas/contact_phone_number'
              physical_addresses:
                type: array
                items:
                  $ref: '#/components/schemas/contact_physical_address'
              suffix:
                $ref: '#/components/schemas/contact_suffix'
              source:
                type: string
                enum:
                  - address_book
                default: address_book
                description: Contacts created through the API are saved to the provider address book.
              surname:
                $ref: '#/components/schemas/contact_surname'
              web_pages:
                type: array
                description: |-
                  An array of the contact's websites. Different providers may have different limits on the number of web pages.
                  - Google/iCloud/Yahoo: multiple web pages per contact.
                  - IMAP: at most one web page per contact.
                  - Microsoft/EWS: at most one web page per contact. The type must be `work`.
                items:
                  $ref: '#/components/schemas/contact_web_page'
          example:
            birthday: '1960-12-31'
            company_name: Nylas
            emails:
              - email: john@example.com
                type: work
              - email: johnisacooldad@example.com
                type: home
            given_name: John
            groups:
              - id: starred
              - id: friends
            im_addresses:
              - type: jabber
                im_address: myjabberaddress
              - type: msn
                im_address: mymsnaddress
            job_title: Software Engineer
            manager_name: Bill
            middle_name: Jacob
            metadata:
              key1: customer-123
              crm_record: crm-456
            nickname: JD
            notes: Loves Ramen
            office_location: 123 Main Street
            phone_numbers:
              - number: +1-555-555-5555
                type: work
              - number: +1-555-555-5556
                type: home
            physical_addresses:
              - type: work
                street_address: 123 Main Street
                postal_code: '94107'
                state: CA
                country: USA
                city: San Francisco
              - type: home
                street_address: 456 Main Street
                postal_code: '94107'
                state: CA
                country: USA
                city: San Francisco
            source: address_book
            suffix: Jr.
            surname: Doe
            web_pages:
              - type: work
                url: https://www.linkedin.com/in/johndoe
              - type: home
                url: https://www.johndoe.com
