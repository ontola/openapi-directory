    configuration:
      type: object
      properties:
        config_id:
          type: string
          description: The unique identifier for the configuration.
          example: d4e78fca-2a90-4b6e-91c3-a7f2bcb0d498
        application_id:
          type: string
          description: The application ID that owns this configuration.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        scope:
          type: string
          description: |-
            The scope of a configuration exposed by the public configuration endpoints.
            Grant configurations carry dispatch_disabled_until and never contribute settings.
            Calendar, recurring-series, and per-Notetaker configurations are managed through
            sync endpoints and are not included in the public configuration list.
          enum:
            - application
            - workspace
            - grant
          example: application
        display_name:
          type: string
          description: A human-readable name for this configuration.
          example: Company defaults
        notetaker_settings:
          $ref: '#/components/schemas/notetaker_settings'
        deduplication_policy:
          type: string
          description: |-
            Controls whether Notetakers governed by this configuration participate in
            deduplication. `active` and `inactive` are available on application and workspace
            configurations. `inherit` and `disable` are available on calendar, event, and
            per-notetaker configurations.
          enum:
            - active
            - inactive
            - inherit
            - disable
          example: active
        dispatch_disabled_until:
          type: string
          format: date-time
          nullable: true
          description: |-
            An RFC 3339 timestamp that suppresses Notetaker dispatch while it's in the future.
            While suppression is active, Nylas rejects immediate join requests and doesn't
            dispatch scheduled Notetakers governed by this configuration. `null` means dispatch
            is enabled; a past timestamp means the suppression has expired. Only application,
            workspace, and grant configurations accept this field. See
            [Pause Notetaker dispatch](/docs/v3/notetaker/dispatch-suppression/).
          example: '2026-08-01T00:00:00Z'
        version:
          type: integer
          description: The version number, incremented on each update.
          example: 1
        created_at:
          type: integer
          description: When the configuration was created, in Unix timestamp seconds.
          example: 1713200000
        updated_at:
          type: integer
          description: When the configuration was last updated, in Unix timestamp seconds.
          example: 1713200000
