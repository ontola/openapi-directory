    attachment_metadata:
      description: Metadata for a file attached to an email message.
      type: object
      properties:
        id:
          $ref: '#/components/schemas/id'
        content_type:
          type: string
          minLength: 1
          description: |-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types/Common_types) of the attachment, used by the email client to determine how to display the attachment. If you don't provide a type, Nylas infers it from the file name.
            The value of this field is exactly the same as the email attachment's `Content-Type` header.
            The provider might set additional parameters, such as `name` and `charset`.

            Nylas returns an empty `content_type` field if an attachment file name contains non-ASCII characters (for example, accented characters like `ü`). This is because Google can't detect its content type.
          example: image/png; name="pic.png"
        filename:
          type: string
          minLength: 1
          description: The file name of the attachment.
          example: pic.png
        grant_id:
          $ref: '#/components/schemas/grant_id'
        content_id:
          type: string
          description: |-
            (Inline attachments only) The alphanumeric `cid` from the `<img>` tag in the message's HTML. For
            example, you might see something like `<img src=\"cid:ce9b9547-9eeb-43b2-ac4e-58768bdf04e4\">` in
            the message body.
          example: 1234567890
        content_disposition:
          type: string
          description: (Not supported for Microsoft and EWS) The content disposition of the attachment. Usually, this is `inline` or `attachment` followed by the file name (for example, `inline; filename="some-image.jpeg"`).
          example: inline; filename="pic.png"
        is_inline:
          type: boolean
          description: Whether the attachment is inline (embedded in the message body, such as an image).
          example: true
        size:
          type: integer
          description: The size of the attachment, in bytes.
          example: 13068
    contact_birthday:
      title: Contact Birthday
      type: string
      description: The contact's birthday in [ISO-8601 format](https://en.wikipedia.org/wiki/ISO_8601#Calendar_dates).
      example: '1980-12-31'
    contact_company_name:
      title: Contact Company Name
      type: string
      description: The name of the company that the contact is affiliated with (for example, their workplace).
      example: Nylas
    contact_email:
      title: Contact email
      type: object
      required:
        - email
      description: |-
        An array of the contact's email addresses. Different providers may have different limits on the
        number of email addresses.

        - iCloud: multiple email addresses per contact.
        - IMAP/Yahoo: at most one email address per contact.
        - Microsoft/EWS: at most three email addresses per contact.

        See [Contacts limitations](/docs/v3/email/contacts/#contacts-limitations) for more information.
      properties:
        email:
          type: string
          description: The contact's email address.
          maxLength: 255
          example: leyah@example.com
        type:
          type: string
          description: (Google, IMAP, iCloud, and Yahoo only) The email address type.
          enum:
            - work
            - home
            - other
          example: work
    contact_given_name:
      title: Contact Given Name
      type: string
      description: The contact's given name.
      example: John
    contact_group_id:
      title: Contact Group ID
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/id'
      example:
        id: 5d3qmne77v32r8l4phyuksl2x
    contact_im_address:
      title: Contact IM address
      type: object
      required:
        - im_address
      description: |-
        An array of the contact's instant messaging (IM) addresses. Different providers may have different
        limits on the number of IM addresses.

        - iCloud/Yahoo: multiple IM addresses per contact.
        - IMAP: at most one IM address per contact.
        - Microsoft/EWS: at most three IM addresses per contact.

        See [Contacts limitations](/docs/v3/email/contacts/#contacts-limitations) for more information.
      properties:
        im_address:
          type: string
          description: The contact's IM address.
          maxLength: 255
          example: myJabberAddress
        type:
          type: string
          description: The protocol for the IM address.
          example: jabber
    contact_job_title:
      title: Contact Job Title
      type: string
      description: The contact's occupation or job title.
      example: Software Engineer
    contact_manager_name:
      title: Contact Manager Name
      type: string
      description: |-
        The name of the contact's manager. Native iCloud and Yahoo CardDAV contacts don't support this
        field. See [Contacts limitations](/docs/v3/email/contacts/#contacts-limitations) for more information.
      example: Bill
    contact_middle_name:
      title: Contact Middle Name
      type: string
      description: The contact's middle name.
      example: Jacob
    contact_nickname:
      title: Contact Nickname
      type: string
      description: A custom nickname for the contact.
      example: JD
    contact_notes:
      title: Contact Notes
      type: string
      description: Notes about with the contact (for example, their favorite food).
      example: Loves Ramen
    contact_office_location:
      title: Contact Office Location
      type: string
      description: |-
        The location of the office where the contact works. Native iCloud and Yahoo CardDAV contacts don't
        support this field. See [Contacts limitations](/docs/v3/email/contacts/#contacts-limitations) for more
        information.
      example: 123 Main Street
    contact_phone_number:
      title: Contact phone number
      type: object
      required:
        - number
      description: |-
        An array of phone numbers associated with the contact. Different providers may have different limits
        on the number of phone numbers.

        - iCloud/Yahoo: multiple phone numbers per contact.
        - IMAP: at most one phone number per contact.
        - Microsoft: at most two home phone numbers, two work phone numbers, and one mobile phone number.
        - EWS: at most two home phone numbers, two work phone numbers, one mobile phone number, and one
          other phone number.

        See [Contacts limitations](/docs/v3/email/contacts/#contacts-limitations) for more information.
      properties:
        number:
          type: string
          description: |-
            The contact's phone number, including its
            [country code](https://www.itu.int/oth/T0202.aspx?parent=T0202).
          example: +1-555-555-5555
        type:
          type: string
          description: |-
            The phone number type. `mobile` is supported for Google, Microsoft Graph, iCloud, and Yahoo.
            `other` is supported for Google, EWS, iCloud, and Yahoo.
          enum:
            - work
            - home
            - mobile
            - other
          example: work
    contact_physical_address:
      title: Contact physical address
      type: object
      required:
        - type
      description: |-
        An array of physical addresses associated with the contact. Different providers may have different
        limits on the number of physical addresses.

        - iCloud/Yahoo: multiple physical addresses per contact.
        - IMAP: at most one physical address per contact.
        - Microsoft/EWS: at most one physical address per contact per type.

        See [Contacts limitations](/docs/v3/email/contacts/#contacts-limitations) for more information.
      properties:
        city:
          type: string
          description: The town or city in which the contact is located.
          example: San Francisco
        country:
          type: string
          description: The country in which the contact is located.
          example: USA
        postal_code:
          type: string
          description: The postal code of a location associated with the contact.
          example: '94107'
        state:
          type: string
          description: The state or province in which the contact is located.
          example: CA
        street_address:
          type: string
          description: The street address of a location associated with the contact (for example, their work).
          example: 123 Main Street
        type:
          type: string
          description: The physical address type.
          enum:
            - work
            - home
            - other
          example: work
    contact_picture_url:
      title: Contact Picture URL
      type: string
      description: |-
        A URL that links to the contact's picture. Native iCloud and Yahoo CardDAV contacts don't support
        profile pictures. See [Contacts limitations](/docs/v3/email/contacts/#contacts-limitations) for more
        information.
      example: https://example.com/picture.jpg
    contact_source:
      title: Contact source
      type: string
      description: |-
        The source of the contact. See [Contact sources](/docs/v3/email/contacts/#contact-sources) for
        provider-specific availability and behavior.
      enum:
        - address_book
        - domain
        - inbox
      example: address_book
    contact_suffix:
      title: Contact Suffix
      type: string
      description: (Not supported for EWS) The suffix of a contact's name, if applicable.
      example: Jr.
    contact_surname:
      title: Contact Surname
      type: string
      description: The contact's surname.
      example: Doe
    contact_web_page:
      title: Contact web page
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: A URL that links to the contact's website.
          example: https://www.example.com/leyah-miller
        type:
          type: string
          description: The website type.
          enum:
            - work
            - home
            - other
          example: work
    contact:
      title: Contact
      type: object
      properties:
        birthday:
          $ref: '#/components/schemas/contact_birthday'
        company_name:
          $ref: '#/components/schemas/contact_company_name'
        emails:
          type:
            - array
            - 'null'
          description: The contact's email addresses. May be `null` if the contact has no email addresses. Treat `null` the same as an empty array.
          items:
            $ref: '#/components/schemas/contact_email'
        given_name:
          $ref: '#/components/schemas/contact_given_name'
        grant_id:
          $ref: '#/components/schemas/grant_id'
        groups:
          type:
            - array
            - 'null'
          description: |-
            The contact's explicit provider-backed group memberships. Address-book containers and aggregate
            views such as iCloud All Contacts are not groups. May be `null` if the contact has no group
            memberships. Treat `null` the same as an empty array.
          items:
            $ref: '#/components/schemas/contact_group_id'
        id:
          $ref: '#/components/schemas/id'
        im_addresses:
          type:
            - array
            - 'null'
          description: The contact's IM addresses. May be `null` if the contact has no IM addresses. Treat `null` the same as an empty array.
          items:
            $ref: '#/components/schemas/contact_im_address'
        job_title:
          $ref: '#/components/schemas/contact_job_title'
        manager_name:
          $ref: '#/components/schemas/contact_manager_name'
        metadata:
          $ref: '#/components/schemas/metadata'
        middle_name:
          $ref: '#/components/schemas/contact_middle_name'
        nickname:
          $ref: '#/components/schemas/contact_nickname'
        notes:
          $ref: '#/components/schemas/contact_notes'
        object:
          type: string
          description: The response object type.
          example: contact
        office_location:
          $ref: '#/components/schemas/contact_office_location'
        phone_numbers:
          type:
            - array
            - 'null'
          description: The contact's phone numbers. May be `null` if the contact has no phone numbers. Treat `null` the same as an empty array.
          items:
            $ref: '#/components/schemas/contact_phone_number'
        physical_addresses:
          type:
            - array
            - 'null'
          description: The contact's physical addresses. May be `null` if the contact has no physical addresses. Treat `null` the same as an empty array.
          items:
            $ref: '#/components/schemas/contact_physical_address'
        picture_url:
          $ref: '#/components/schemas/contact_picture_url'
        source:
          $ref: '#/components/schemas/contact_source'
        suffix:
          $ref: '#/components/schemas/contact_suffix'
        surname:
          $ref: '#/components/schemas/contact_surname'
        web_pages:
          type:
            - array
            - 'null'
          description: The contact's web pages. May be `null` if the contact has no web pages. Treat `null` the same as an empty array.
          items:
            $ref: '#/components/schemas/contact_web_page'
    contact_picture:
      title: Contact Picture
      type: string
      description: |-
        The contact's picture, represented as a Base64-encoded string. Native iCloud and Yahoo CardDAV
        contacts don't support profile pictures. See
        [Contacts limitations](/docs/v3/email/contacts/#contacts-limitations) for more information.
      example: /9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHR...
    contact_with_picture:
      title: Contact With Picture
      type: object
      allOf:
        - $ref: '#/components/schemas/contact'
        - properties:
            picture:
              $ref: '#/components/schemas/contact_picture'
    contact_group:
      title: Contact Group
      type: object
      properties:
        grant_id:
          $ref: '#/components/schemas/grant_id'
        group_type:
          type: string
          description: The Contact Group type.
          enum:
            - system
            - user
            - other
          example: system
        id:
          $ref: '#/components/schemas/id'
        name:
          type: string
          description: The Contact Group display name.
          example: starred
        object:
          type: string
          description: The response object type.
          example: contact_group
        path:
          type: string
          description: The Contact Group's path.
          example: parentId/starred
    signature:
      title: Signature
      type: object
      properties:
        id:
          type: string
          description: Globally unique identifier for the signature.
          readOnly: true
          example: sig_abc123
        grant_id:
          $ref: '#/components/schemas/grant_id'
        name:
          type: string
          description: A label for the signature (for example, "Work", "Personal", or "Mobile").
          example: Work Signature
        body:
          type: string
          description: The HTML content of the signature. Images must use externally hosted URLs.
          example: <div><p><strong>Nick Barraclough</strong></p><p>Product Manager | Nylas</p></div>
        object:
          type: string
          description: The type of object.
          example: signature
          readOnly: true
        created_at:
          type: integer
          description: Unix timestamp when the signature was created.
          readOnly: true
          example: 1706367600
        updated_at:
          type: integer
          description: Unix timestamp when the signature was last modified.
          readOnly: true
          example: 1706367600
    workflow:
      type: object
      description: A custom workflow that sends messages from a template when certain events are triggered.
      required:
        - date_created
        - delay
        - id
        - is_enabled
        - name
        - template_id
        - trigger_event
      properties:
        app_id:
          type:
            - string
            - 'null'
          description: |-
            The ID of the Nylas application associated with the workflow. Returned only if the
            workflow is configured at the application level.
          example: 6c45fe5e-0bb6-41b9-9acc-ccb15bfc51eb
        date_created:
          type: integer
          description: When the workflow was created, in seconds using the Unix timestamp format.
          example: 1756477389
        delay:
          type: integer
          description: |-
            The number of minutes between a `trigger_event` being met and the workflow sending
            a message.
          example: 5
        grant_id:
          type:
            - string
            - 'null'
          description: |-
            The ID of the grant associated with the workflow. Returned only if the workflow is
            configured at the grant level.
          example: 6c45fe5e-0bb6-41b9-9acc-ccb15bfc51eb
        id:
          type: string
          description: The ID of the workflow.
          example: b79c82b2-a51b-4c54-8469-28006a43551a
        is_enabled:
          type: boolean
          description: When `true`, indicates that the workflow is enabled.
          example: true
        name:
          type: string
          description: The name of the workflow.
          example: New booking confirmation workflow
        template_id:
          type: string
          description: The ID of the email template the workflow uses.
          example: 14c00cc8-648c-4381-ad10-52641d9bac8e
        trigger_event:
          type: string
          enum:
            - booking.cancelled
            - booking.created
            - booking.pending
            - booking.reminder
            - booking.rescheduled
          description: The event which triggers the workflow.
          example: booking.created
        from:
          type:
            - object
            - 'null'
          description: Details of the sender if the workflow uses transactional send.
          properties:
            email:
              type: string
              description: The email address of the sender.
              example: support@example.com
            name:
              type: string
              description: The name of the sender.
              example: Support
    template:
      type: object
      description: A custom message template.
      required:
        - body
        - created_at
        - engine
        - id
        - name
        - object
        - subject
        - updated_at
      properties:
        app_id:
          type:
            - string
            - 'null'
          description: |-
            The ID of the Nylas application associated with the template. Returned only if the template is
            configured at the application level.
          example: 6c45fe5e-0bb6-41b9-9acc-ccb15bfc51eb
        body:
          type: string
          description: The body content of the template, in HTML format.
          example: <p>Hello {{user.name}}, your booking has been confirmed.</p>
        created_at:
          type: integer
          description: When the template was created, in seconds using the Unix timestamp format.
          example: 1640995200
        engine:
          type: string
          enum:
            - handlebars
            - mustache
            - nunjucks
            - twig
          description: The templating engine.
          example: mustache
        grant_id:
          type:
            - string
            - 'null'
          description: |-
            The ID of the grant associated with the template. Returned only if the template is configured
            at the grant level.
          example: 6c45fe5e-0bb6-41b9-9acc-ccb15bfc51eb
        id:
          type: string
          description: The template ID.
          example: b79c82b2-a51b-4c54-8469-28006a43551a
        name:
          type: string
          description: The name of the template.
          example: Booking confirmed message
        object:
          type: string
          description: The object type identifier.
          default: template
          example: template
        subject:
          type: string
          description: The subject line of the template.
          example: '{{user.name}}, your booking is confirmed!'
        updated_at:
          type: integer
          description: When the template was last updated, in seconds using the Unix timestamp format.
          example: 1640995200
    attachment_transactional_send:
      description: A file attachment for a transactional email message.
      type: object
      properties:
        content_type:
          type: string
          minLength: 1
          description: |-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types/Common_types) of the attachment, used by the email client to determine how to display the attachment. If you don't provide a type, Nylas infers it from the file name.
            The value of this field is exactly the same as the email attachment's `Content-Type` header.
            The provider might set additional parameters, such as `name` and `charset`.

            Nylas returns an empty `content_type` field if an attachment file name contains non-ASCII characters (for example, accented characters like `ü`). This is because Google can't detect its content type.
          example: image/png; name="pic.png"
        filename:
          type: string
          minLength: 1
          description: The file name of the attachment.
          example: pic.png
        content_id:
          type: string
          description: |-
            (Inline attachments only) The alphanumeric `cid` from the `<img>` tag in the message's HTML. For
            example, you might see something like `<img src=\"cid:ce9b9547-9eeb-43b2-ac4e-58768bdf04e4\">` in
            the message body.

            Sometimes, the `content_id` value is contained in angle brackets (for example,
            `<ce9b9547-9eeb-43b2-ac4e-58768bdf04e4>`).
          example: 1234567890
        content_disposition:
          type: string
          description: (Not supported for Microsoft and EWS) The content disposition of the attachment. Usually, this is `inline` or `attachment` followed by the file name (for example, `inline; filename="some-image.jpeg"`).
          example: inline
        is_inline:
          type: boolean
          description: If `true`, indicates that the attachment is an inline file.
          example: true
        size:
          type: integer
          description: The size of the attachment, in bytes.
          example: 13068
    transactional_send_message:
      type: object
      properties:
        id:
          type: string
          description: The message ID.
          example: 6c45fe5e-0bb6-41b9-9acc-ccb15bfc51eb
        attachments:
          type: array
          description: An array of Attachment objects. For google, linked Google Drive files are not included. For Microsoft, linked One Drive files are not included.
          items:
            $ref: '#/components/schemas/attachment_transactional_send'
          uniqueItems: true
          minItems: 0
          example:
            - content_disposition: attachment
              content_type: text/calendar
              filename: null
              content_id: 4kj2jrcoj9ve5j9yxqz5cuv98
              size: 1708
            - content_disposition: attachment
              content_type: application/ics
              filename: invite.ics
              content_id: 70jcsv367jaiavt4njeu4xswg
              size: 1708
        bcc:
          type: array
          description: |-
            An array of name/email address pairs that the message was BCC'd to. For received messages, this
            is nearly always empty.
          items:
            $ref: '#/components/schemas/message-participant'
        body:
          type: string
          description: The body of the message. This field is the same as the `body` field in your request.
          example: Hello, I just sent a message using Nylas!
        cc:
          type: array
          description: An array of name/email address pairs that the message was CC'd to.
          items:
            $ref: '#/components/schemas/message-participant'
        from:
          type: array
          description: A list of name/email address pairs that the message was sent from. For transactional send, this will always be one pair.
          items:
            $ref: '#/components/schemas/message-participant-response'
          uniqueItems: true
        object:
          type: string
          description: The object type of the response (in this case, `message`).
          example: message
        reply_to:
          type: array
          items:
            $ref: '#/components/schemas/message-participant'
          uniqueItems: true
          description: An array of name/email address pairs that should receive replies to the message.
        snippet:
          type: string
          minLength: 1
          description: |-
            A short snippet (the first 100 characters, with HTML tags removed) of the message body. This is
            useful for displaying a preview of the message.
          example: |-
            You have been invited to the following event. Welcome! WhenThu Oct 28, 2021 7am - 8am Eastern
            Time - Toronto Joining info
        subject:
          type: string
          description: The subject of the message.
          example: Nylas Send v3 Email
        tracking_options:
          type: object
          description: Tracking options for the message.
          properties:
            opens:
              type: boolean
              description: When `true`, shows that message open tracking is enabled.
              example: true
            links:
              type: boolean
              description: When `true`, shows that link clicked tracking is enabled.
              example: true
            label:
              type: string
              description: A label describing the message tracking purpose.
              maxLength: 2048
              example: Tracking test
        to:
          type: array
          description: An array of name/email address pairs that the message was sent to.
          items:
            $ref: '#/components/schemas/message-participant'
          uniqueItems: true
  requestBodies:
    calendar_create:
      content:
        application/json:
          schema:
            type: object
            required:
              - name
            properties:
              description:
                $ref: '#/components/schemas/calendar_description'
              location:
                $ref: '#/components/schemas/calendar_location'
              metadata:
                $ref: '#/components/schemas/metadata'
              name:
                $ref: '#/components/schemas/calendar_name'
              notetaker:
                $ref: '#/components/schemas/calendar_sync'
              timezone:
                $ref: '#/components/schemas/calendar_timezone'
          example:
            description: Calendar for work events.
            location: Los Angeles
            name: Work Calendar
            notetaker:
              notetaker_settings:
                name: Nyla's Notetaker
                action_items: true
                action_items_settings:
                  custom_instructions: Only return the 5 most important action items.
                recording_type: audio_video
                summary: true
                summary_settings:
                  custom_instructions: Return this summary in the MEDPIC sales methodology.
                transcription: true
                transcription_settings:
                  expected_languages:
                    - en
                    - es
                  fallback_language: en
              rules:
                event_selection:
                  - internal
                  - - own_events
                    - external
                participant_filter:
                  participants_gte: 5
                  participants_lte: 10
            timezone: America/Los_Angeles
    calendar_update:
      content:
        application/json:
          schema:
            type: object
            properties:
              description:
                $ref: '#/components/schemas/calendar_description'
              hex_color:
                $ref: '#/components/schemas/calendar_hex_color'
              hex_foreground_color:
                $ref: '#/components/schemas/calendar_hex_foreground_color'
              location:
                $ref: '#/components/schemas/calendar_location'
              metadata:
                $ref: '#/components/schemas/metadata'
              name:
                type: string
                description: |-
                  The name of the calendar.

                  Microsoft doesn't allow you to update the name of a user's primary calendar.
                example: My Updated Calendar
              timezone:
                $ref: '#/components/schemas/calendar_timezone'
              notetaker:
                $ref: '#/components/schemas/calendar_sync'
          example:
            name: My New Calendar
            description: Description of my new calendar
            location: Location description
            timezone: America/Los_Angeles
            hex_color: '#039BE5'
            notetaker:
              notetaker_settings:
                name: Nylas Notetaker
                recording_type: audio_video
                transcription: true
                transcription_settings:
                  expected_languages:
                    - en
                    - es
                  fallback_language: en
              rules:
                event_selection:
                  - internal
    freebusy:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/freebusy_request'
          example:
            start_time: 1633698000
            end_time: 1633698000
            emails:
              - user1@example.com
              - user2@example.com
    event_send_rsvp:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/event_send_rsvp'
    notetakers:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/notetakers'
    patch-notetaker:
      content:
        application/json:
          schema:
            type: object
            properties:
              join_time:
                type: integer
                description: |-
                  When Notetaker should join the meeting, in seconds using the Unix timestamp format. If empty, Notetaker joins the
                  meeting immediately.

                  If you provide a time that's in the past, Nylas returns an error.
                example: 1732657774
              config_id:
                type: string
                description: |-
                  The ID of an existing configuration to use for this Notetaker. Cannot be used
                  together with `notetaker_settings`.
                example: d4e78fca-2a90-4b6e-91c3-a7f2bcb0d498
              notetaker_settings:
                $ref: '#/components/schemas/notetaker_settings'
              meeting_settings:
                $ref: '#/components/schemas/meeting_settings'
                deprecated: true
                description: |-
                  **Deprecated.** Use `notetaker_settings` instead. Cannot be used together with
                  `notetaker_settings` or `config_id`.
              name:
                type: string
                description: |-
                  **Deprecated.** Use `notetaker_settings.name` instead. Cannot be used together with
                  `notetaker_settings` or `config_id`.
                default: Nylas Notetaker
                example: Nylas Notetaker
    create-config:
      content:
        application/json:
          schema:
            type: object
            properties:
              application_id:
                type: string
                description: |-
                  Optional. If provided, must match the application ID associated with your API key —
                  Nylas infers the application from your credentials when this field is omitted.
                example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
              workspace_id:
                type: string
                description: |-
                  The workspace ID. Provide to create a workspace-scope configuration.
                  Mutually exclusive with `grant_id`.
                example: ws-12345
              grant_id:
                type: string
                description: |-
                  The grant ID. Provide to create a policy-only grant configuration for
                  [dispatch suppression](/docs/v3/notetaker/dispatch-suppression/). Grant
                  configurations support only `dispatch_disabled_until` — requests that
                  include `notetaker_settings` or `deduplication_policy` return `400 Bad Request`.
                  The configuration's `config_id` is the grant ID. Mutually exclusive with
                  `workspace_id`.
                example: e19f8e1a-eb1c-41c0-b6d6-a24a6a9d6b28
              display_name:
                type: string
                description: A human-readable name to identify this configuration.
                example: Company defaults
              notetaker_settings:
                $ref: '#/components/schemas/notetaker_settings'
              deduplication_policy:
                type: string
                description: |-
                  Controls deduplication for an application or workspace configuration.
                  Grant configurations do not accept this field.
                enum:
                  - active
                  - inactive
                example: active
              dispatch_disabled_until:
                type: string
                format: date-time
                nullable: true
                description: |-
                  An RFC 3339 timestamp that suppresses Notetaker dispatch while it's in the
                  future. Accepted on application, workspace, and grant configurations. While
                  active, Nylas rejects immediate join requests and doesn't dispatch scheduled
                  Notetakers governed by this configuration. See
                  [Pause Notetaker dispatch](/docs/v3/notetaker/dispatch-suppression/).
                example: '2026-08-01T00:00:00Z'
    patch-config:
      content:
        application/json:
          schema:
            type: object
            properties:
              display_name:
                type: string
                description: A human-readable name to identify this configuration.
                example: Updated company defaults
              notetaker_settings:
                type: object
                nullable: true
                description: |-
                  Updates local settings overrides. Omitted fields remain unchanged; a field
                  set to null removes its local override so it inherits again. Set the whole
                  notetaker_settings object to null to clear all local settings overrides.
                allOf:
                  - $ref: '#/components/schemas/notetaker_settings'
              deduplication_policy:
                type: string
                description: Controls deduplication for this application or workspace configuration.
                enum:
                  - active
                  - inactive
                example: active
              dispatch_disabled_until:
                type: string
                format: date-time
                nullable: true
                description: |-
                  An RFC 3339 timestamp that suppresses Notetaker dispatch while it's in the
                  future. Accepted on application, workspace, and grant configurations.
                  Omit the field to leave the current value unchanged; send `null` to clear
                  the suppression and resume dispatch. See
                  [Pause Notetaker dispatch](/docs/v3/notetaker/dispatch-suppression/).
                example: '2026-08-01T00:00:00Z'
    message_update:
      content:
        application/json:
          schema:
            title: Message Update payload
            type: object
            properties:
              starred:
                type: boolean
                description: Set to `true` to mark as starred; `false` to mark as not starred.
                example: true
              unread:
                type: boolean
                description: Set to `true` to mark as unread; `false` to mark as read.
                example: true
              folders:
                type: array
                items:
                  type: string
                description: The ID(s) of the folder(s) to apply, overwriting all folders previously associated with the message. Microsoft messages can be in a single folder only. Google allows a single message to appear in multiple folders.
                example:
                  - folder-1
                  - folder-2
              metadata:
                $ref: '#/components/schemas/metadata'
    messages-clean:
      content:
        application/json:
          schema:
            type: object
            properties:
              message_id:
                type: array
                items:
                  type: string
                description: An array of IDs for the messages Nylas will clean.
                example:
                  - 18df98cadcc8534a
                maxItems: 20
              ignore_links:
                type: boolean
                description: If `true`, removes link-related tags (`<a>`) from the message while keeping the text.
                example: true
                default: true
              ignore_images:
                type: boolean
                description: If `true`, removes images from the message.
                example: true
                default: true
              images_as_markdown:
                type: boolean
                description: |-
                  If `true`, converts images in the message to
                  [Markdown](https://en.wikipedia.org/wiki/Markdown). Can't be `false` when `html_as_markdown`
                  is `true`.
                example: true
                default: true
              ignore_tables:
                type: boolean
                description: |-
                  If `true`, removes table-related tags (`<table>`, `<th>`, `<td>`, `<tr>`) from the message
                  while keeping rows.
                example: true
                default: true
              remove_conclusion_phrases:
                type: boolean
                description: If `true`, removes phrases such as "Best" and "Regards" from the message signature.
                example: true
                default: true
              html_as_markdown:
                type: boolean
                description: |-
                  **This property is in beta**. If `true`, converts the message to
                  [Markdown](https://en.wikipedia.org/wiki/Markdown). Can't be `true` when
                  `images_as_markdown` is `false`.
                example: false
                default: false
    message_send:
      content:
        application/json:
          schema:
            type: object
            required:
              - to
            properties:
              attachments:
                type: array
                description: An array of files to be sent with the message.
                items:
                  type: object
                  properties:
                    content:
                      type: string
                      description: |-
                        The Base64-encoded file content. See
                        [Working with email attachments](/docs/v3/email/attachments/#attachment-schemas-and-size-limits)
                        for more information.
                      example: YXR0YWNoDQoNCi0tLS0tLS0tLS0gRm9yd2FyZGVkIG1lc3NhZ2UgL=
                    content_disposition:
                      type: string
                      description: |-
                        (Not supported for Microsoft and EWS) The content disposition of the file. Usually,
                        this is `inline` or `attachment`, followed by the file name.
                      example: attachment; filename="nylas_logo.png"
                    content_id:
                      type: string
                      description: |-
                        (Inline attachments only) The alphanumeric `cid` from the `<img>` tag in the HTML
                        message body. To avoid unexpected behavior in threads, make sure to use unique CIDs
                        across messages of a thread.
                      example: ce9b9547-9eeb-43b2-ac4e-58768bdf04e4
                    content_type:
                      type: string
                      description: |-
                        The
                        [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types/Common_types)
                        of the file. This is used by the email client to determine how to display the
                        attachment.
                      minLength: 1
                      example: image/png
                    filename:
                      type: string
                      description: The file name.
                      minLength: 1
                      example: nylas_logo.png
              bcc:
                type: array
                description: A list of people BCC'd on the message.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: The name of the person BCC'd on the message.
                      example: Leyah Miller
                    email:
                      type: string
                      description: The email address of the person BCC'd on the message.
                      example: leyah@example.com
              body:
                type: string
                description: The HTML body of the message.
                example: Looking forward to seeing you!
              cc:
                type: array
                description: A list of people CC'd on the message.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: The name of the person CC'd on the message.
                      example: Kaveh
                    email:
                      type: string
                      description: The email address of the person CC'd on the message.
                      example: kaveh@example.com
              custom_headers:
                type: array
                description: An array of custom headers to add to the message.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: The header name.
                      example: Email-Campaign
                    value:
                      type: string
                      description: The header value.
                      example: meetings
              from:
                type: array
                description: |-
                  The sender of the message. Accepts a single object in an array. If omitted, Nylas uses the
                  grant's email address and display name.
                items:
                  type: object
                  required:
                    - email
                  properties:
                    name:
                      type: string
                      description: The name of the user sending the message.
                      example: Nyla
                    email:
                      type: string
                      description: The email address of the user sending the message.
                      example: nyla@example.com
              is_plaintext:
                type: boolean
                description: When `true`, the message body is sent as plain text and the MIME data doesn't include the HTML version of the message. When `false`, the message body is sent as HTML.
                default: false
              metadata:
                $ref: '#/components/schemas/metadata'
              reply_to:
                type: array
                description: A list of people who should receive replies to the message by default.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: The name of the person who should receive replies to the message.
                      example: Leyah Miller
                    email:
                      type: string
                      description: The email address of the person who should receive replies to the message.
                      example: leyah@example.com
              reply_to_message_id:
                type: string
                description: |-
                  The ID of the message you're replying to. For Gmail and Microsoft Graph, this is the
                  message ID on the provider. For IMAP Send, this is the
                  [RFC822](https://datatracker.ietf.org/doc/html/rfc822#section-4.6.1) `Message-ID` header
                  of the message you're replying to.
              send_at:
                type: integer
                description: |-
                  The time when Nylas should send the message, in seconds using the Unix timestamp format. This time must be
                  at least one minute in the future from the time you make your request. You can schedule
                  a message to be sent up to 30 days in the future. If the request includes
                  `tracking_options.domain_name`, Nylas validates the hostname when it creates the schedule
                  and revalidates it before delivery.
              subject:
                type: string
                description: The subject of the message.
                example: 'Reminder: Annual Philosophy Club Meeting'
              template:
                type: object
                description: The [template](/docs/reference/api/application-level-templates/) to use for the message. Can be overriden by the `body` and `subject` fields.
                properties:
                  id:
                    type: string
                    description: The template ID.
                    example: b79c82b2-a51b-4c54-8469-28006a43551a
                  strict:
                    type: boolean
                    description: |-
                      When `true`, Nylas returns an error if the template contains variables that aren't
                      defined in the `variables` object.
                    default: true
                    example: true
                  variables:
                    type: object
                    description: |-
                      A set of key/value pairs representing variables to substitute for values in the
                      template.
                    additionalProperties:
                      type: string
                    example:
                      user:
                        name: Leyah
                        surname: Miller
              to:
                type: array
                description: A list of people that the message will be sent to.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: The name of the person the message will be sent to.
                      example: Kim Townsend
                    email:
                      type: string
                      description: The email address of the person the message will be sent to.
                      example: kim@example.com
              tracking_options:
                type: object
                description: Tracking settings for the message. See [Track messages](/docs/v3/email/message-tracking/).
                properties:
                  opens:
                    type: boolean
                    description: |-
                      When `true`, enables
                      [message open tracking](/docs/v3/email/message-tracking/#message-open-tracking) on the
                      message. Nylas generates a
                      [`message.opened` webhook notification](/docs/reference/notifications/#message-opened-notifications)
                      when a participant first opens the message.
                    default: false
                  thread_replies:
                    type: boolean
                    description: |-
                      When `true`, enables
                      [thread replied tracking](/docs/v3/email/message-tracking/#thread-replied-tracking)
                      on the message. Nylas generates a
                      [`thread.replied` webhook notification](/docs/reference/notifications/#thread-replied-notifications)
                      when a participant replies to the thread.
                    default: false
                  links:
                    type: boolean
                    description: |-
                      When `true`, enables
                      [link clicked tracking](/docs/v3/email/message-tracking/#link-clicked-tracking) on the
                      message. Nylas generates a
                      [`message.link_clicked` webhook notification](/docs/reference/notifications/#link-clicked-notifications)
                      when a participant clicks a link in the message.
                    default: false
                  label:
                    type: string
                    description: |-
                      A brief description of the message, why it's being tracked, or the tracking options
                      enabled.
                    maxLength: 2048
                  domain_name:
                    $ref: '#/components/schemas/tracking_domain_name'
              use_draft:
                type: boolean
                description: |-
                  (Google and Microsoft only) When `true`, Nylas saves the message in the user's Drafts folder
                  until its `send_at` time. This field can't be `true` if `send_at` is undefined.
                default: false
              signature_id:
                type: string
                description: |-
                  The ID of a [signature](/docs/v3/email/signatures/) to append to the message body. Nylas
                  inserts the signature after a line break at the end of the body, including after any quoted
                  text in replies and forwards. Only one signature can be used per message.
                example: sig_abc123
