    409_idempotent:
      description: Conflict. Returned when an `Idempotency-Key` conflicts with an existing entry.
      content:
        application/json:
          schema:
            title: error
            type: object
            properties:
              request_id:
                type: string
                description: The request ID.
              error:
                type: object
                description: The response error object.
                properties:
                  type:
                    type: string
                    description: The error type.
                  message:
                    type: string
                    description: The error message.
          examples:
            Different payload, same key:
              value:
                request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
                error:
                  type: api.invalid_idempotent_request
                  message: The Idempotency-Key was reused with a different request payload. Use a different key, or match the original payload.
            Concurrent request in flight:
              value:
                request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
                error:
                  type: api.concurrent_idempotent_request
                  message: A request with the same Idempotency-Key is currently in progress. Wait a moment and retry with the same key.
