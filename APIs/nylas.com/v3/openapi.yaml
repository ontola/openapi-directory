  /v3/notetakers/configs:
    get:
      summary: Return all Notetaker Configurations
      tags:
        - Notetaker Configurations
      operationId: get-all-notetaker-configs
      description: |-
        Returns a paginated list of public configurations for the application.
        Internal calendar, recurring-series, and per-Notetaker configurations are excluded.
      x-scopes:
        google:
          min: ''
        microsoft:
          min: ''
        yahoo:
          min: ''
      security:
        - NYLAS_API_KEY: []
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          $ref: '#/components/responses/get-configs-200'
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
    post:
      summary: Create a Notetaker Configuration
      tags:
        - Notetaker Configurations
      operationId: create-notetaker-config
      description: |-
        Creates a new configuration for the application. Configurations define reusable
        settings that Notetakers inherit through a hierarchical chain.

        The scope of the configuration is determined by which context fields you provide:
        - `application_id` only → application scope
        - `workspace_id` → workspace scope
        - `grant_id` → grant scope. Grant configurations are policy-only: they support
          `dispatch_disabled_until` for [dispatch suppression](/docs/v3/notetaker/dispatch-suppression/)
          and reject `notetaker_settings` and `deduplication_policy`.
        - Other scopes (calendar, recurring event) are created automatically by the calendar
          and event sync endpoints.

        `workspace_id` and `grant_id` are mutually exclusive.

        Calendar and event settings are managed through their sync endpoints, not the
        public configuration endpoints.

        To upload a [custom video output image](/docs/v3/notetaker/custom-video-output/),
        send the request as `multipart/form-data` with the JSON body in a part named `config`
        and the image in a file part referenced by `notetaker_settings.video_output.file_key`.
        Small images (up to 1,376,256 decoded bytes) can be sent inline on `application/json`
        requests using `video_output.media_type` and `video_output.data` instead.
      x-scopes:
        google:
          min: ''
        microsoft:
          min: ''
        yahoo:
          min: ''
      security:
        - NYLAS_API_KEY: []
      requestBody:
        $ref: '#/components/requestBodies/create-config'
      responses:
        '201':
          $ref: '#/components/responses/create-config-201'
        '400':
          $ref: '#/components/responses/400-2'
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
  /v3/notetakers/configs/{config_id}:
    parameters:
      - $ref: '#/components/parameters/config_id'
    get:
      summary: Return a Notetaker Configuration
      tags:
        - Notetaker Configurations
      operationId: get-notetaker-config
      description: |-
        Returns the specified configuration with its resolved settings (merged from
        all ancestors in the hierarchy). Use `?include=history` to include the version
        history of the configuration.
      x-scopes:
        google:
          min: ''
        microsoft:
          min: ''
        yahoo:
          min: ''
      security:
        - NYLAS_API_KEY: []
      parameters:
        - $ref: '#/components/parameters/config_include'
      responses:
        '200':
          $ref: '#/components/responses/get-config-200'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
    patch:
      summary: Update a Notetaker Configuration
      tags:
        - Notetaker Configurations
      operationId: update-notetaker-config
      description: |-
        Updates the specified configuration. Only the fields you include in the request
        body are changed; all other fields remain unchanged. Each update increments the
        configuration's version number.

        To upload a [custom video output image](/docs/v3/notetaker/custom-video-output/),
        send the request as `multipart/form-data` with the JSON body in a part named `config`
        and the image in a file part referenced by `notetaker_settings.video_output.file_key`.
        Small images (up to 1,376,256 decoded bytes) can be sent inline on `application/json`
        requests using `video_output.media_type` and `video_output.data` instead.
      x-scopes:
        google:
          min: ''
        microsoft:
          min: ''
        yahoo:
          min: ''
      security:
        - NYLAS_API_KEY: []
      requestBody:
        $ref: '#/components/requestBodies/patch-config'
      responses:
        '200':
          $ref: '#/components/responses/get-config-200'
        '400':
          $ref: '#/components/responses/400-2'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
    delete:
      summary: Delete a Notetaker Configuration
      tags:
        - Notetaker Configurations
      operationId: delete-notetaker-config
      description: |-
        Deletes the specified configuration. If this configuration has children, they
        are reparented to this configuration's parent, preserving the hierarchy chain.
        You cannot delete the platform default configuration.
      x-scopes:
        google:
          min: ''
        microsoft:
          min: ''
        yahoo:
          min: ''
      security:
        - NYLAS_API_KEY: []
      responses:
        '200':
          $ref: '#/components/responses/delete-config-200'
        '400':
          $ref: '#/components/responses/400-2'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
