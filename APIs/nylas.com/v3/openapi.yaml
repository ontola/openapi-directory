          description: A cursor pointing to the next page of results for the request.
      example:
        request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
        next_cursor: CigKGjRlaDdyNGQydTFqbWJ0bGo5a2QxdWJtdDZnGAEggIDAu7fw7bEYGg8IABIAGPjh2PGEi_0CIAEiBwgCEOqs6i4=
    calendar_description:
      title: Calendar description
      type: string
      description: (Not supported for iCloud or EWS) A brief description of the calendar.
      example: Junior sports league carpool drivers
    grant_id:
      title: Grant ID
      type: string
      description: The ID of grant for the connected user.
      example: 41009df5-bf11-4c97-aa18-b285b5f2e386
      readOnly: true
    calendar_hex_color:
      title: Background color hex code
      type: string
      description: |-
        (Not supported for iCloud or EWS) The background color of the calendar, in hexadecimal format (for
        example, `#0099EE`). When empty, Nylas uses the default background color.

        You can set or modify this value using a `PUT` request only.
      example: '#039BE5'
    calendar_hex_foreground_color:
      title: Foreground color hex code
      type: string
      description: |-
        (Google only) The foreground color of the calendar, in hexadecimal format (for example, `#0099EE`).
        When empty, Nylas uses the default foreground color.

        You can modify this value using a `PUT` request only.
      example: '#039BE5'
    id:
      title: ID
      type: string
      minLength: 1
      description: A globally unique object identifier for Microsoft accounts. An email address for Google accounts.
      example: 5d3qmne77v32r8l4phyuksl2x, nyla@example.com
    is_owned_by_user:
      title: Is Owned By User
      type: boolean
      description: If `true`, indicates that the user owns the calendar. This field can't be modified once set.
    calendar_location:
      type: string
      description: (Not supported for iCloud or EWS) The geographic location of the calendar, as free-form text.
      example: London, England
    metadata:
      title: Metadata
      type: object
      description: |-
        The metadata associated with the object. For more information, see
        [Metadata](/docs/reference/api/#metadata).
      propertyNames:
        type: string
        maxLength: 40
      additionalProperties:
        type: string
        description: A key-value pair.
        maxLength: 500
      maxProperties: 50
    calendar_name:
      type: string
      description: The name of the calendar.
      example: My New Calendar
    object:
      type: string
      description: The type of object.
    calendar_owner_email:
      title: Owner email
      type: string
      description: |-
        (Microsoft only) The email address of the account that owns the calendar. Use it to tell the grant's own
        calendars apart from calendars shared with the grant.

        This field is read-only.
      example: nyla@example.com
    calendar_read_only:
      title: Read-only setting
      type: boolean
      description: |-
        Set by the provider. If `true`, indicates that the calendar is read-only.

        If the calendar is read-only, all of its events have `read_only` set to `true`. This field _cannot_
        be modified.
    calendar_timezone:
      title: Calendar timezone
      type: string
      description: |-
        (Google, Agent Accounts, and virtual calendars only) An [IANA timezone database](https://en.wikipedia.org/wiki/Tz_database)
        formatted string (for example, `America/New_York`).
      example: America/Los_Angeles
    calendar_common:
      title: Calendar
      type: object
      description: A Calendar object.
      properties:
        description:
          $ref: '#/components/schemas/calendar_description'
        grant_id:
          $ref: '#/components/schemas/grant_id'
        hex_color:
          $ref: '#/components/schemas/calendar_hex_color'
        hex_foreground_color:
          $ref: '#/components/schemas/calendar_hex_foreground_color'
        id:
          $ref: '#/components/schemas/id'
        is_owned_by_user:
          $ref: '#/components/schemas/is_owned_by_user'
        is_primary:
          type:
            - boolean
          description: If `true`, indicates that the calendar is the primary for the grant.
        location:
          $ref: '#/components/schemas/calendar_location'
        metadata:
          $ref: '#/components/schemas/metadata'
        name:
          $ref: '#/components/schemas/calendar_name'
        object:
          $ref: '#/components/schemas/object'
          example: calendar
        owner_email:
          $ref: '#/components/schemas/calendar_owner_email'
        read_only:
          $ref: '#/components/schemas/calendar_read_only'
        timezone:
          $ref: '#/components/schemas/calendar_timezone'
    on_join_message:
      type: object
      description: A message the Notetaker bot posts to the meeting chat shortly after joining.
      required:
        - type
        - content
        - send_after_ms
      properties:
        type:
          type: string
          description: |-
            The message format. Currently only `text` is supported. Plain-text content
            is preferred; any HTML tags in `content` are stripped before the message
            is sent.
          enum:
            - text
          example: text
        content:
          type: string
          description: |-
            The message text the bot posts to the meeting chat. After HTML tags are
            stripped, the remaining text must be at least 1 character. Requests whose
            `content` becomes empty after sanitization are rejected with a validation
            error.
          minLength: 1
          maxLength: 1000
          example: 👋 Hey team! I'm your AI notetaker — here to capture the key points.
        send_after_ms:
          type: integer
          description: |-
            Delay in milliseconds between the moment the bot joins the meeting and
            the moment this message is posted. Each `on_join` message is scheduled
            independently against its own delay; messages are posted in the order
            their delays expire.
          minimum: 1
          maximum: 600000
          example: 5000
    on_participant_join_message:
      type: object
      description: |-
        A message the Notetaker bot posts to the meeting chat when a new participant
        joins, using a trailing debounce window so a burst of joins only produces a
        single message.
      required:
        - type
        - content
        - debounce_ms
      properties:
        type:
          type: string
          description: |-
            The message format. Currently only `text` is supported. Plain-text content
            is preferred; any HTML tags in `content` are stripped before the message
            is sent.
          enum:
            - text
          example: text
        content:
          type: string
          description: |-
            The message text the bot posts to the meeting chat. After HTML tags are
            stripped, the remaining text must be at least 1 character. Requests whose
            `content` becomes empty after sanitization are rejected with a validation
            error.
          minLength: 1
          maxLength: 1000
          example: 👋 Welcome! Recording and transcription are running.
        debounce_ms:
          type: integer
          description: |-
            Trailing debounce window in milliseconds. When a participant joins, the
            bot waits this long before posting the message. If another participant
            joins inside the window, the timer resets — the message is only posted
            once the window expires without another join event. This collapses a
            burst of nearly-simultaneous joins into a single announcement.
          minimum: 1
          maximum: 600000
          example: 3000
    messages:
      type: object
      description: |-
        Custom announcements the Notetaker bot posts to the meeting chat. Use this to
        greet attendees when the bot joins, or to acknowledge new participants as they
        arrive. Messages are optional; when omitted, the bot only posts the default
        recording-and-transcription notice described in [Using Nylas Notetaker](/docs/v3/notetaker/).

        Like other `notetaker_settings` fields, `messages` participates in the
        configuration hierarchy and uses whole-object override semantics: the most
        specific layer that sets `messages` completely replaces the parent's value
        (there is no per-message merging). See [Custom announcements](/docs/v3/notetaker/custom-announcements/)
        for the full inheritance model.
      properties:
        on_join:
          type: array
          description: |-
            Messages the bot sends shortly after it joins the meeting. Each message has
            its own configurable delay measured from the moment the bot joins. Up to
            10 messages per trigger.
          maxItems: 10
          items:
            $ref: '#/components/schemas/on_join_message'
        on_participant_join:
          type: array
          description: |-
            Messages the bot sends when a new participant joins the meeting. Each message
            uses a trailing debounce window — if another participant joins before the
            window expires, the timer resets and only one message is posted per burst of
            joins. Up to 10 messages per trigger.
          maxItems: 10
          items:
            $ref: '#/components/schemas/on_participant_join_message'
    video_output:
      type: object
      description: |-
        A static image the Notetaker bot shows as its camera feed when it joins a meeting,
        instead of a blank tile. Sometimes called the bot avatar. Supported on Google Meet,
        Microsoft Teams, and Zoom; on other providers the bot joins without showing the image.
        Author images at a 16:9 aspect ratio. Text in the image appears mirrored in the
        recording.

        Upload the image in one of two ways:

        - **Multipart** (recommended): send the request as `multipart/form-data` and set
          `file_key` to the name of the file part that contains the image. The JSON part must be
          named `config` on the configuration endpoints and `notetaker` on the Notetaker
          endpoints. File parts up to 4 MiB.
        - **JSON + base64**: send `media_type` and `data` together on a plain `application/json`
          request. The decoded image must be 1,376,256 bytes (about 1.31 MB) or smaller.

        Accepted formats are PNG, JPEG, and static WebP, up to 3840x2160 pixels and no more than
        8,294,400 total pixels. The format is detected from the file content, not the declared
        content type.

        On `PATCH`, omitting `video_output` preserves the existing image, sending a new image
        replaces it, and sending an empty object (`{}`) disables video output at that layer.

        Accepted when you create or update a configuration or a Notetaker. Not supported on
        calendar sync or event sync requests. See
        [Notetaker custom video output](/docs/v3/notetaker/custom-video-output/).
      properties:
        file_key:
          type: string
          writeOnly: true
          description: |-
            The name of the multipart file part that contains the image. Only valid on
            `multipart/form-data` requests, must reference exactly one file part, and cannot be
            combined with `media_type` or `data`.
          example: avatar
        media_type:
          type: string
          description: |-
            The image MIME type. On a JSON write, required together with `data` and must match
            the actual file content. Always returned in responses.
          enum:
            - image/png
            - image/jpeg
            - image/webp
          example: image/png
        data:
          type: string
          format: byte
          writeOnly: true
          description: |-
            The base64-encoded image bytes. Only valid on `application/json` requests, required
            together with `media_type`, and must decode to 1,376,256 bytes or smaller.
          example: iVBORw0KGgoAAAANSUhEUg...
        size:
          type: integer
          readOnly: true
          description: The stored image size in bytes. Read-only; rejected on writes.
          example: 184320
        preview_url:
          type: string
          readOnly: true
          description: |-
            A signed URL for previewing the stored image. Valid for 1 hour; fetch the
            configuration again to get a fresh URL. Read-only; rejected on writes.
          example: https://storage.googleapis.com/...
        preview_url_expires_at:
          type: integer
          readOnly: true
          description: |-
            When `preview_url` expires, as a Unix timestamp in seconds. Read-only; rejected
            on writes.
          example: 1786128794
    notetaker_settings:
      type: object
      description: |-
        Flat Notetaker settings for the configuration system. Omitted fields inherit from
        the parent configuration. After inheritance, dependency rules determine effective
        settings: summary and action_items require transcription. Nylas captures effective
        settings at dispatch; later parent edits do not rewrite an existing run's snapshot.

        Cannot be used together with the legacy `name` and `meeting_settings` fields.
      properties:
        name:
          type: string
          description: The display name shown when the Notetaker joins a meeting.
          example: Acme Notetaker
        recording_type:
          type: string
          description: |-
            What Notetaker records. `audio_video` produces an MP4 recording of the meeting's
            video and audio. `audio` produces an MP3 audio-only recording and does not capture
            video. Transcription, summaries, and action items work with either value. When no
            level of the configuration hierarchy sets it, Notetaker records audio and video.
          enum:
            - audio_video
            - audio
          example: audio_video
        transcription:
          type: boolean
          description: When `true`, Notetaker transcribes the meeting's audio.
          example: true
        transcription_settings:
          type: object
          nullable: true
          description: |-
            Optional settings that tune how Notetaker transcribes audio. `transcription` must be
            `true` for these settings to take effect. Provide any combination of the fields below.

            The fields fall into two independent groups:

            - **Language hints** (`expected_languages`, `fallback_language`) constrain automatic
              language detection. This declares the languages you expect; it does not translate
              transcripts or force the recording into a specific language.
            - **Keyword hints** (`keywords`, `use_speaker_names_as_keywords`) bias recognition toward
              domain-specific terms such as names, acronyms, and product names.

            Set on individual Notetakers, on calendar sync, on event sync, or on a configuration.
            When set on a configuration or calendar, scheduled Notetakers inherit the value unless
            the request overrides it. Send `null` or `{}` to clear inherited settings and return to
            default transcription behavior.

            See [Set transcription languages](/docs/v3/notetaker/transcription-settings/) for
            supported language codes and validation rules.
          properties:
            expected_languages:
              type: array
              description: |-
                Language codes the audio is expected to contain. Optional. When provided, it must
                contain at least one supported code and cannot be `null` or empty. When omitted,
                transcription considers all supported languages.
              minItems: 1
              items:
                type: string
              example:
                - en
                - es
            fallback_language:
              type: string
              description: |-
                Language to use if Notetaker does not detect one of the `expected_languages`. Optional.
                When `expected_languages` is set, the fallback must be one of those codes. When
                `expected_languages` is omitted, transcription considers all supported languages and
                the fallback may be any supported code. When `fallback_language` is omitted, the
                transcriber auto-detects the language. The field is not stored, so responses do not
                return it.
              example: en
            keywords:
              type: array
              description: |-
                Domain-specific terms that bias transcription toward recognizing them correctly, such
                as names, acronyms, and product names. Optional. Up to 200 terms; each term must be
                1 to 200 characters and cannot contain control characters. Cannot be `null`.
              maxItems: 200
              items:
                type: string
                maxLength: 200
              example:
                - Nylas
                - AssemblyAI
            use_speaker_names_as_keywords:
              type: boolean
              description: |-
                When `true`, Notetaker adds known speaker names to the keyword set so they are
                transcribed accurately. Optional. Cannot be `null`.
              example: true
        summary:
          type: boolean
          description: |-
            When `true`, Notetaker generates a summary of the meeting. Requires
            `transcription` to also be `true`.
          example: true
        summary_settings:
          type: object
          properties:
            custom_instructions:
              type: string
              maxLength: 3000
              description: Custom instructions for the AI summary model.
              example: Summarize in bullet points.
        action_items:
          type: boolean
          description: |-
            When `true`, Notetaker generates a list of action items. Requires
            `transcription` to also be `true`.
          example: true
        action_items_settings:
          type: object
          properties:
            custom_instructions:
              type: string
              maxLength: 3000
              description: Custom instructions for the AI action items model.
              example: Only return the 5 most important action items.
        leave_after_silence_seconds:
          type: integer
          description: |-
            Seconds of continuous silence after which the Notetaker automatically leaves
            the meeting. Must be between 10 and 3600 seconds (1 hour).
          minimum: 10
          maximum: 3600
          default: 300
          example: 600
        messages:
          $ref: '#/components/schemas/messages'
        video_output:
          $ref: '#/components/schemas/video_output'
        retention_time:
          type: integer
          minimum: 300
          maximum: 2592000
          description: |-
            How long Notetaker media (recording, transcript, summary, action items, and
            thumbnail) is kept before Nylas automatically deletes it, in seconds. The
            clock starts when the media is first stored after the meeting ends. Defaults
            to 1,209,600 seconds (14 days). Like other `notetaker_settings` fields, the
            effective value is resolved from the configuration hierarchy — set it on an
            application or workspace configuration for a new default, or override it on
            a single Notetaker to extend or shrink retention just for that bot.
          default: 1209600
          example: 604800
    meeting_settings_common:
      type: object
      description: A collection of settings for the Notetaker bot.
      properties:
        action_items:
          type: boolean
          description: |-
            When `true`, Notetaker generates a list of action items from the meeting. If `action_items` is
            `true`, `video_recording`, `audio_recording`, and `transcription` must also be `true`.
          default: true
          example: true
        action_items_settings:
          type: object
          properties:
            custom_instructions:
              type: string
              description: |-
                A custom prompt to pass to Nylas' AI model and specify settings for the list of action items
                it generates. `action_items` must be `true` to use this field.
              example: Only return the 5 most important action items.
        audio_recording:
          type: boolean
          description: When `true`, Notetaker records the meeting's audio.
          default: true
          example: true
        leave_after_silence_seconds:
          type: integer
          description: |-
            The number of seconds of silence after which the Notetaker bot automatically leaves
            the meeting. This helps end recordings when meetings have concluded but participants
            haven't disconnected the call. Must be between 10 and 3600 seconds (1 hour).
          minimum: 10
          maximum: 3600
          default: 300
          example: 360
        summary:
          type: boolean
          description: |-
            When `true`, Notetaker generates a summary of the meeting. If `summary` is `true`,
            `video_recording`, `audio_recording`, and `transcription` must also be `true`.
          default: true
          example: true
        summary_settings:
          type: object
          properties:
            custom_instructions:
              type: string
              description: |-
                A custom prompt to pass to Nylas' AI model and specify settings for the summary it generates.
                `summary` must be `true` to use this field.
              example: Return this summary in the MEDPIC sales methodology.
        transcription:
          type: boolean
          description: |-
            When `true`, Notetaker transcribes the meeting's audio. If `transcription` is `true`,
            `video_recording` and `audio_recording` must also be `true`.
          default: true
          example: true
        video_recording:
          type: boolean
          description: When `true`, Notetaker records the meeting's video.
          default: true
          example: true
    meeting_settings:
      allOf:
        - $ref: '#/components/schemas/meeting_settings_common'
        - type: object
          properties:
            transcription_settings:
              type:
                - object
                - 'null'
              description: |-
                Optional settings that tune how Notetaker transcribes audio. `transcription` must be
                `true` for these settings to take effect. Provide any combination of the fields below.

                The fields fall into two independent groups:

                - **Language hints** (`expected_languages`, `fallback_language`) constrain automatic
                  language detection. This declares the languages you expect; it does not translate
                  transcripts or force the recording into a specific language.
                - **Keyword hints** (`keywords`, `use_speaker_names_as_keywords`) bias recognition toward
                  domain-specific terms such as names, acronyms, and product names.

                Set on individual Notetakers, on calendar sync, or on event sync. When set on a calendar,
                events inherit the value unless the event's own request overrides it. Send `null` or `{}`
                to clear inherited settings and return to default transcription behavior.

                See [Set transcription languages](/docs/v3/notetaker/transcription-settings/) for
                supported language codes and validation rules.
              properties:
                expected_languages:
                  type: array
                  description: |-
                    Language codes the audio is expected to contain. Optional. When provided, it must
                    contain at least one supported code and cannot be `null` or empty. When omitted,
                    transcription considers all supported languages.
                  minItems: 1
                  items:
                    type: string
                  example:
                    - en
                    - es
                fallback_language:
                  type: string
                  description: |-
                    Language to use if Notetaker does not detect one of the `expected_languages`. Optional.
                    When `expected_languages` is set, the fallback must be one of those codes. When
                    `expected_languages` is omitted, transcription considers all supported languages and
                    the fallback may be any supported code. When `fallback_language` is omitted, the
                    transcriber auto-detects the language. The field is not stored, so responses do not
                    return it.
                  example: en
                keywords:
                  type: array
                  description: |-
                    Domain-specific terms that bias transcription toward recognizing them correctly, such
                    as names, acronyms, and product names. Optional. Up to 200 terms; each term must be
                    1 to 200 characters and cannot contain control characters. Cannot be `null`.
                  maxItems: 200
                  items:
                    type: string
                    maxLength: 200
                  example:
                    - Nylas
                    - AssemblyAI
                use_speaker_names_as_keywords:
                  type: boolean
                  description: |-
                    When `true`, Notetaker adds known speaker names to the keyword set so they are
                    transcribed accurately. Optional. Cannot be `null`.
                  example: true
            messages:
              $ref: '#/components/schemas/messages'
    calendar_sync:
      type: object
      description: |-
        Notetaker settings for a calendar. Choose exactly one of the following modes to
        declare *what* Notetaker should do; combining them returns a validation error:

        - **`notetaker_settings`** (preferred) — inline flat settings using the configuration system.
        - **`config_id`** — reference an existing application or workspace configuration.
        - **`autocreate`** — create Notetakers for matching events using the inherited
          configuration.
        - **`name` + `meeting_settings`** (⚠️ deprecated) — legacy nested settings.

        `rules` is optional and declares *which* events Notetaker should join. You can
        combine `rules` with `notetaker_settings` or with the legacy `meeting_settings`
        mode.
      properties:
        notetaker_settings:
          $ref: '#/components/schemas/notetaker_settings'
        config_id:
          type: string
          description: |-
            The ID of an application or workspace [Notetaker configuration](/docs/v3/notetaker/configurations/)
            to apply to this calendar. Mutually exclusive with `notetaker_settings`,
            `autocreate`, and the legacy `name` and `meeting_settings` fields.
          example: d4e78fca-2a90-4b6e-91c3-a7f2bcb0d498
        autocreate:
          type: boolean
          description: |-
            When `true`, Nylas creates Notetakers for matching events on this calendar using
            settings resolved from the configuration hierarchy (default → application →
            workspace → calendar). Mutually exclusive with `notetaker_settings`, `config_id`,
            and the legacy `name` and `meeting_settings` fields.
          example: true
        deduplication_policy:
          type: string
          description: |-
            Controls whether Notetakers created from this calendar participate in
            [deduplication](/docs/v3/notetaker/deduplication/).

            - `inherit`: Use the deduplication policy resolved from the configuration hierarchy.
            - `disable`: Opt this calendar out of deduplication entirely.
          enum:
            - inherit
            - disable
          example: inherit
        meeting_settings:
          $ref: '#/components/schemas/meeting_settings'
          deprecated: true
          description: |-
            **Deprecated.** Use `notetaker_settings` instead. Cannot be used together with
            `notetaker_settings`, `config_id`, or `autocreate`.
        name:
          type: string
          description: |-
            **Deprecated.** Use `notetaker_settings.name` instead. Only valid with the legacy
            `meeting_settings` mode.
          default: Nylas Notetaker
          example: Nylas Notetaker
        rules:
          type: object
          description: |-
            Rules for when the Notetaker bot should join a meeting. Optional; can be combined
            with `notetaker_settings` or with the legacy `meeting_settings` mode.
          properties:
            event_selection:
              type: array
              items:
                oneOf:
                  - type: string
                    enum:
                      - all
                      - external
                      - internal
                      - own_events
                      - participant_only
                    x-enum-descriptions:
                      all: Join all events with meeting links.
                      external: Join all events where the host's domain differs from any participant's domain.
                      internal: Join all events where the host's domain matches all participants' domains.
                      own_events: Join all events where the user is the host.
                      participant_only: Join all events where the user is a participant, but not the host.
                  - type: array
                    description: A group of criteria that are AND'd together. The group itself is OR'd with other top-level items.
                    items:
                      type: string
                      enum:
                        - all
                        - external
                        - internal
                        - own_events
                        - participant_only
              description: |-
                Specify the types of events Notetaker should join. Each item can be either a single criterion (a string)
                or a group of criteria (an array of strings). Top-level items are OR'd together; criteria inside a
                nested array are AND'd together.

                Valid criteria:
                - "all": Join all events with meeting links.
                - "external": Join all events where the host's domain differs from any participant's domain.
                - "internal": Join all events where the host's domain matches all participants' domains.
                - "own_events": Join all events where the user is the host.
                - "participant_only": Join all events where the user is a participant, but not the host.

                Examples:
                - ["internal", "own_events"]: Match events that are internal OR owned by the user.
                - [["own_events", "external"]]: Match events that are owned by the user AND have at least one external participant.
                - ["internal", ["own_events", "external"]]: Match events that are internal, OR events that are both owned by the user AND have at least one external participant.
              example:
                - internal
                - - own_events
                  - external
            participant_filter:
              type: object
              description: |-
                Specify filters to determine which events Notetaker should join, based on the number of
                participants. If you don't specify any settings, a Notetaker joins meetings regardless of
                participants.
              properties:
                participants_gte:
                  type: integer
                  description: |-
                    Join all events where the number of participants is greater than or equal to the specified
                    value.
                  example: 5
                participants_lte:
                  type: integer
                  description: |-
                    Join all events where the number of participants is less than or equal to the specified
                    value.
                  example: 5
    common_response:
      properties:
        request_id:
          type: string
          description: The request ID.
        data:
          type: object
          description: The response object.
      example:
        request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
    calendar:
      allOf:
        - $ref: '#/components/schemas/calendar_common'
        - properties:
            notetaker:
              $ref: '#/components/schemas/calendar_sync'
    availability_buffer:
      title: buffer
      type: object
      properties:
        before:
          type: integer
          description: |-
            The amount of buffer time to add before meetings, in increments of five minutes. For example,
            if an account has a meeting scheduled from 10:00–11:00a.m., and you set a `before` buffer of
            30 minutes, Nylas treats 9:30–11:00a.m. as busy.

            This value must be between 0 and 120, and must be divisible by 5.
          default: 0
          minimum: 0
          maximum: 120
        after:
          type: integer
          description: |-
            The amount of buffer time to add after meetings, in increments of five minutes. For example, if
            an account has a meeting scheduled from 10:00–11:00a.m., and you set an `after` buffer of 15
            minutes, Nylas treats 10:00–11:15a.m. as busy.

            This value must be between 0 and 120, and must be divisible by 5.
          default: 0
          minimum: 0
          maximum: 120
    availability_open_hours:
      description: A time block when a participant is available for meetings.
      type: object
      title: Open Hours
      examples: []
      properties:
        days:
          type: array
          description: |-
            The days of the week that the open hours settings are applied to. Sunday corresponds to `0`, and
            Saturday corresponds to `6`.
          items:
            type: integer
            enum:
              - 0
              - 1
              - 2
              - 3
              - 4
              - 5
              - 6
          example:
            - 0
            - 1
            - 2
        timezone:
          type: string
          minLength: 1
          description: The calendar's time zone as an [IANA-formatted](https://en.wikipedia.org/wiki/Tz_database) string.
          example: America/Chicago
        start:
          type: string
          minLength: 1
          description: |-
            The start time for the open hours settings, in 24-hour time format. Nylas omits leading zeroes.

            The minimum start time is `0:00`, and the maximum is `23:49`.
          example: '10:00'
        end:
          type: string
          minLength: 1
          description: The end time for the open hours settings, in 24-hour time format. Nylas omits leading zeroes.
          example: '14:00'
        exdates:
          type: array
          description: A list of dates that Nylas excludes from the account's open hours, in `YYYY-MM-DD` format.
          items:
            type: string
          example:
            - '2006-01-18'
    availability_rules:
      title: ''
      type: object
      properties:
        availability_method:
          type: string
          default: max-availability
          enum:
            - collective
            - max-fairness
            - max-availability
        buffer:
          type: object
          description: |-
            The amount of buffer time Nylas adds around existing meetings, in minutes. For example, if an
            account has a meeting scheduled from 10:00–11:00a.m., and you set a buffer of 30 minutes, Nylas
            treats 9:30–11:30a.m. as busy.
          $ref: '#/components/schemas/availability_buffer'
        default_open_hours:
          type: array
          description: |-
            A default set of open hours to apply to all participants. You can overwrite these open hours for
            individual participants by specifying `open_hours` on the Participant object.
          items:
            $ref: '#/components/schemas/availability_open_hours'
        round_robin_group_id:
          type: string
          description: |-
            The ID on events that Nylas considers when calculating the order of round-robin participants.
            This is used for both max-fairness and max-availability calculations.

            To calculate participant order correctly, set the metadata key `key5` to the same value on any
            events you want to consider for the current set of round-robin participants. You can set this
            key to any value that helps you identify events used to calculate availability in this group
            (for example, `new_subscriber_onboarding`).
        tentative_as_busy:
          type: boolean
          default: true
          description: (Microsoft and EWS only) When `true`, Nylas treats tentative events as busy.
    availability_specific_time_availability:
      description: A specific date and time range when the participant is available.
      type: object
      required:
        - date
        - start
        - end
        - timezone
      properties:
        date:
          type: string
          description: The date in `YYYY-MM-DD` format.
          example: '2026-03-18'
        end:
          type: string
          description: The end time in `HH:MM` format (24-hour).
          example: '17:00'
        start:
          type: string
          description: The start time in `HH:MM` format (24-hour).
          example: '09:00'
        timezone:
          type: string
          description: The participant's IANA timezone for this availability window.
          example: America/Toronto
    availability_time_slot:
      title: TimeSlot
      type: object
      properties:
        emails:
          type:
            - array
            - 'null'
          description: A list of participant email addresses for this time slot. This field may be `null`. Treat `null` the same as an empty array.
          items:
            type: string
        start_time:
          type: integer
          description: The start of a time slot, in seconds using the Unix timestamp format.
        end_time:
          type: integer
          description: The end of a time slot, in seconds using the Unix timestamp format.
        event_id:
          type: string
          description: (Group Events Only). The event ID of the group event
        master_id:
          type: string
          description: (Group Events Only). The master ID of the recurring group event
        calendar_id:
          type: string
          description: (Group Events Only). The calendar ID of the group event
    availability_response:
      description: The response to a successful request to get availability for a participant.
      type: object
      properties:
        order:
          type: array
          items:
            type: string
          description: (Round-robin events only) The order of participants in line to attend the proposed meeting.
        time_slots:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/availability_time_slot'
          description: |-
            An array of the available time slots when you can create a meeting using the requested settings.
            This field may be `null` if no time slots are available. Treat `null` the same as an empty array.
    freebusy_request:
      title: free-busy
      type: object
      required:
        - start_time
        - end_time
        - emails
      properties:
        start_time:
          type: integer
          description: |-
            The start of a time block, in seconds using the Unix timestamp format. Nylas uses `start_time` and `end_time` to assess
            the specified account's free/busy schedule.
          example: 1690862400
        end_time:
          type: integer
          description: |-
            The end of a time block, in seconds using the Unix timestamp format. Nylas uses `start_time` and `end_time` to
            assess the specified account's free/busy schedule.

            For Google and EWS accounts, Nylas can query a timespan of up to 3 months from the `start_time`.

            For Microsoft Graph accounts, Nylas can query a timespan of up to 62 days from the `start_time`.
          example: 1691208000
        emails:
          type: array
          description: A list of email addresses to check the free/busy schedules for.
          items:
            type: string
        tentative_as_busy:
          type: boolean
          default: true
          description: When `true`, Nylas treats tentative events as busy.
    event_calendar_id:
      title: Event's Calendar ID
      type:
        - string
        - 'null'
      description: |-
        The calendar ID associated with the event. If you used the `calendar_id=primary` query parameter in
        your request, Nylas returns the real calendar ID instead of `primary`.

        For Microsoft calendars, there are some cases where the event Nylas returns isn't associated with
        a calendar ID. This happens most often when the event is created in a shared calendar.

        This field may be `null` for certain event types (for example, virtual calendar events). It's always populated for Agent Account events.
      example: 7d93zl2palhxqdy6e5qinsakt
    event_conferencing_response:
      title: Event with conferencing
      type: object
      description: |-
        An object that contains event conferencing details. Nylas appends the conference information to the
        Event `description`.
      properties:
        provider:
          type: string
          enum:
            - Google Meet
            - GoToMeeting
            - Microsoft Teams
            - Skype for Business
            - Skype for Consumer
            - WebEx
            - Zoom Meeting
            - unknown
      oneOf:
        - title: Auto-conferencing
          type: object
          description: Conference Nylas autocreated for the event.
          properties:
            autocreate:
              type: object
              description: |-
                The autocreate settings Nylas used to generate the conference for the event.

                After the conferencing provider creates the meeting, Nylas returns the concrete meeting
                information — such as the URL and meeting code — in the `details` object and appends it to
                the event `description`. For an autocreated conference, expect the response `conferencing`
                object to contain a `provider` and a `details` object once the meeting exists.
        - title: Google Meet
          type: object
          description: Manually-attached Google Meet conferencing details.
          properties:
            details:
              type: object
              description: An object that contains Google Meet conferencing details.
              properties:
                url:
                  type: string
                  description: The URL for the Google Meet conference.
                phone:
                  type: array
                  items:
                    type: string
                  description: The phone number associated with the Google Meet conference.
                pin:
                  type: string
                  description: The PIN associated with the Google Meet conference, if applicable.
        - title: Zoom Meeting
          type: object
          description: Manually-attached Zoom Meeting conferencing details.
          properties:
            details:
              type: object
              description: An object that contains Zoom conferencing details.
              properties:
                url:
                  type: string
                  description: The URL for the Zoom conference.
                meeting_code:
                  type: string
                  description: A unique ID associated with the Zoom conference.
                password:
                  type: string
                  description: The password for the Zoom conference, if applicable.
        - title: Microsoft Teams
          type: object
          description: Manually-attached Microsoft Teams conferencing details.
          properties:
            details:
              type: object
              description: An object that contains Microsoft Teams conferencing details.
              properties:
                url:
                  type: string
                  description: The URL for the Microsoft Teams conference.
        - title: WebEx
          type: object
          description: Manually-attached WebEx conferencing details.
          properties:
            details:
              type: object
              description: An object that contains WebEx conferencing details.
              properties:
                url:
                  type: string
                  description: The URL for the WebEx conference.
                password:
                  type: string
                  description: The password for the WebEx conference, if applicable.
                pin:
                  type: string
                  description: The PIN for the WebEx conference, if applicable.
                phone:
                  type: array
                  items:
                    type: string
                  description: The phone number associated with the WebEx conference.
        - title: GoToMeeting
          type: object
          description: Manually-attached GoToMeeting conferencing details.
          properties:
            details:
              type: object
              description: An object that contains GoToMeeting conferencing details.
              properties:
                url:
                  type: string
                  description: The URL for the GoToMeeting conference.
                meeting_code:
                  type: string
                  description: A unique ID associated with the GoToMeeting conference.
                password:
                  type: string
                  description: The password for the GoToMeeting conference, if applicable.
                phone:
                  type: array
                  items:
                    type: string
                  description: The phone number associated with the GoToMeeting conference.
    event_created_at:
      type:
        - integer
        - 'null'
      description: When the event was created, in seconds using the Unix timestamp format.
      example: 1661874192
    event_html_link:
      type: string
      description: (Not supported for EWS events) A link to the event on the provider.
      example: https://www.google.com/calendar/event?eid=bTMzcGJrNW4yYjk4bjk3OWE4Ef3feD2VuM29fMjAyMjA2MjdUMjIwMDAwWiBoYWxsYUBueWxhcy5jb20
    event_ical_uid:
      title: iCal format ID
      type:
        - string
        - 'null'
      description: |-
        A unique ID that you can use to identify events across calendaring systems, in
        [iCalendar format](https://datatracker.ietf.org/doc/html/rfc5545#section-3.8.4.7).
        Recurring events might share the same ID.

        Can be `null` for events synced before the year 2020.
    event_id:
      title: Event ID
      type: string
      minLength: 1
      description: The ID of the event. Event IDs are usually unique to each user, except for Google which maintains the same event ID for an event regardless of the user querying it.
      example: 5d3qmne77v32r8l4phyuksl2x
    organizer:
      type: object
      description: An object that contains information about an event's organizer.
      properties:
        name:
          type: string
          description: The organizer's full name.
          example: Leyah Miller
        email:
          type: string
          description: |-
            The organizer's email address. 

            For an event in a Google calendar, Nylas returns the `email` based on the calender type.
            - For a primary calendar, `email` is the same as the `calendar_id`.
            - For a non-primary calendar, `email` is set to the actual ID of the calendar.
          example: leyah@example.com
    event_participants:
      title: Event participants list
      type: array
      description: |-
        An array of participants invited to the event. The organizer doesn't need to be explicitly
        included in this list.
      uniqueItems: true
      minItems: 1
      items:
        type: object
        properties:
          comment:
            type: string
            description: A note or comment about the participant (for example, their nickname).
            example: Will be 5 minutes late.
          email:
            type: string
            description: The participant's email address. For Microsoft Graph, this field can be missing.
            example: kaveh@example.com
          name:
            type: string
            description: The participant's name.
            example: Kaveh
          phone_number:
            type: string
            description: The participant's phone number.
            example: 555-555-5555
          status:
            type: string
            description: The participant's RSVP status.
            enum:
              - 'yes'
              - 'no'
              - maybe
              - noreply
            default: noreply
            example: 'yes'
    event_resources:
      title: Resource information
      description: Resources are physical locations or equipment that can be reserved for events, and which are tracked using an email address with an associated calendar.
      type: object
      properties:
        email:
          type: string
          description: The resource's email address.
          example: conference-room@resource.google.com
        name:
          type: string
          description: The resource's full name.
          example: Conference room
      required:
        - email
    event_read_only:
      title: Event read-only setting
      type: boolean
      description: |-
        If `true`, indicates that the event is read-only. The provider sets the `read_only` value based on
        the connected calendar, and you can't modify it.

        In cases where you _can_ update this field on a cloned event (for example, an event imported to your
        calendar from an email invitation), `read_only` is `true`.

        If the calendar is read-only, all events on the calendar have `read_only` set to `true`.
    event_reminders:
      title: Event reminders list
      type: object
      description: |-
        A list of reminders to generate for the event. If not defined, Nylas uses the provider's default
        settings.
      properties:
        use_default:
          type:
            - boolean
            - 'null'
          description: |-
            When `true`, the event uses the calendar's default reminder settings.
            This field may be `null` if reminders are not explicitly configured.

            - **Google**: Generates a `popup`-style reminder 10 minutes before the event begins.
            - **Microsoft**: Generates a reminder 15 minutes before the event begins.
            - **iCloud**: Does not generate a reminder.
            - **EWS**: Generates a `display`-style reminder 15 minutes before the event begins.
        overrides:
          type:
            - array
            - 'null'
          description: |-
            A list of reminders for the event to use when `use_default` is `false`. If this field is empty
            or omitted, and `use_default` is `false`, the event does not send reminders. If `true`, Nylas
            generates both the default event reminder and any reminders in the `overrides` list.

            You cannot set reminder overrides if `use_default` is `true`.

            For Microsoft Graph, EWS, and iCloud, you can set only one reminder per event.

            This field may be `null` if no reminder overrides have been set. Treat `null` the same as an
            empty array.
          items:
            type: object
            properties:
              reminder_minutes:
                type: integer
                example: 20
                description: The number of minutes before the event to display a reminder.
              reminder_method:
                type: string
                description: |-
                  (Google and iCloud only) The method used to notify the user about the event, with separate
                  options and default settings for each provider.

                  - **Google**:
                    - Default: `popup`
                    - Options: `popup`, `email`
                  - **iCloud**:
                    - Default: `display`
                    - Options: `display`, `sound`
                enum:
                  - popup
                  - email
                  - display
                  - sound
                example: popup
    event_recurrence:
      title: Event recurrence settings
      type: array
      items:
        type: string
      example:
        - RRULE:FREQ=WEEKLY;BYDAY=MO
        - EXDATE:20210405T000000Z
      description: |-
        An array of `RRULE` and `EXDATE` strings. Nylas includes this field only if the event is the main
        (master) event. See [RFC-5545](https://tools.ietf.org/html/rfc5545#section-3.8.5) for more details.
        You can use [this tool](https://jkbrzt.github.io/rrule/) to learn more about the `RRULE` spec.

        Events inherit their timezone from the `when` object. Nylas recommends that you use the `when`
        object to specify the event's start and end time.

        Provider specifics:
        - On some providers, `EXDATE` might not include exception or cancelled event timestamps. When this
        happens, Nylas represents those event instances as separate objects in its responses.
        - Agent Accounts and virtual calendars don't support `DTSTART` or `TZID`. Nylas uses the event's `when` values as the start of the series instead.
        - iCloud accounts do _not_ support changing an event from recurring to non-recurring. You can create,
        update, or delete information on recurring events.
        - Microsoft Graph adds one day to the `UNTIL` date.
    event_status:
      title: Event status
      type: string
      description: |-
        (Not supported for iCloud) The status of the event. You can't set this field when creating or updating
        an event. If you're the organizer of the event and you want to reply "maybe" or "no" to the
        invitation, use the
        [Send RSVP endpoint](/docs/reference/api/events/send-rsvp/)
        instead.

        For Google events, a `cancelled` status indicates that the event was an occurrence of a recurring
        event, and that the occurrence has been cancelled by the event organizer.

        For Microsoft and EWS events, a `cancelled` status indicates that the event was organized by someone
        else, and the organizer cancelled or deleted the event.
      example: confirmed
      enum:
        - confirmed
        - cancelled
        - maybe
    event_updated_at:
      type:
        - integer
        - 'null'
      description: When the event was last updated, in seconds using the Unix timestamp format.
      example: 1661874192
    event_visibility:
      title: Event visibility on calendars
      type:
        - string
        - 'null'
      enum:
        - default
        - private
        - public
      examples: []
      description: |-
        (Not supported for iCloud events) Specifies whether the event is `public` or `private`. If not
        defined, Nylas uses the account's default provider settings. For Google and Microsoft, event visibility is `public` by default.

        The `default` enum value is only valid for Google events, where it defers to the calendar's own sharing settings. Microsoft and EWS events only support `public` and `private`; sending `default` for these providers returns a 400 error.

        For Agent Account and virtual calendar events, you can explicitly set `visibility` to `private` or `public` on create and update requests, and the value is returned on read. If not set, virtual calendar events default to `public` behavior.
    event_timespan:
      title: Timespan
      type: object
      description: A period of time with a specified beginning and end (for example, an hour-long lunch meeting).
      properties:
        start_time:
          type: integer
          description: The event's start time, in seconds using the Unix timestamp format.
          example: 1409594400
        end_time:
          type: integer
          example: 1409598000
          description: The event's end time, in seconds using the Unix timestamp format.
        start_timezone:
          type:
            - string
            - 'null'
          minLength: 1
          example: America/New_York
          description: |-
            The timezone of the event's `start_time` as an
            [IANA-formatted](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones) string.

            If you define `start_timezone` in your request, you must also define `end_timezone`.
        end_timezone:
          type:
            - string
            - 'null'
          minLength: 1
          example: America/New_York
          description: |-
            The timezone of the event's `end_time` as an
            [IANA-formatted](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones) string.

            If you define `end_timezone` in your request, you must also define `start_timezone`.
    event_date:
      title: Date
      type: object
      description: |-
        The date on which the event occurs, without a clock-based start
        or end time (for example, a birthday or holiday).
      properties:
        date:
          type: string
          example: '2021-05-09'
          description: The date of the event, in [ISO 8601 format](https://en.wikipedia.org/wiki/ISO_8601#Calendar_dates).
    event_datespan:
      title: Datespan
      type: object
      description: |-
        A span of days, without specific clock-based start and end times
        (for example, a business quarter or semester). For more information, see [All-day event handling](/docs/v3/calendar/using-the-events-api/#all-day-event-handling).
      properties:
        start_date:
          type: string
          minLength: 1
          description: The event's start date, in [ISO 8601 format](https://en.wikipedia.org/wiki/ISO_8601#Calendar_dates).
          example: '2024-12-01'
        end_date:
          type: string
          description: The event's end date (inclusive), in [ISO 8601 format](https://en.wikipedia.org/wiki/ISO_8601#Calendar_dates).
          example: '2024-12-02'
    event_when_response:
      title: When
      type:
        - object
        - 'null'
      description: |-
        An object that represents the time and duration of an event. Nylas might format `when` as one of three
        sub-objects: `timespan`, `date`, or `datespan`. These sub-objects allow Nylas to capture and represent
        specific points in time.

        `timespan` objects include optional timezone support.

        This field may be `null` when event timing data is unavailable (for example, when using field selection
        that excludes the underlying time fields).
      anyOf:
        - allOf:
            - $ref: '#/components/schemas/event_timespan'
            - type: object
            - readOnly: true
        - allOf:
            - $ref: '#/components/schemas/event_date'
            - type: object
            - readOnly: true
        - allOf:
            - $ref: '#/components/schemas/event_datespan'
            - type: object
            - readOnly: true
    event_sync:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: The Notetaker bot ID. Read-only; returned in responses but not required in create or update requests.
          example: 71c807752c744ad0902f64d43e6cc399
        meeting_settings:
          $ref: '#/components/schemas/meeting_settings'
        name:
          type: string
          description: The display name for the Notetaker bot.
          default: Nylas Notetaker
          example: Nylas Notetaker
    event_common:
      title: Event
      type: object
      properties:
        busy:
          type: boolean
          description: |-
            If `true`, shows the event's time block as `busy` on shared or public calendars. This may be
            called "transparency" in some systems.
        calendar_id:
          $ref: '#/components/schemas/event_calendar_id'
        conferencing:
          $ref: '#/components/schemas/event_conferencing_response'
        created_at:
          $ref: '#/components/schemas/event_created_at'
        description:
          type:
            - string
            - 'null'
          description: |-
            A brief description of the event (for example, its agenda). The description might be returned
            as an HTML string, depending on how the provider formats it.
            For Google accounts, this field accepts a maximum of 8,192 characters.
          example: Time for us to sync weekly on any new project changes
          minLength: 0
        text_description:
          type:
            - string
            - 'null'
          description: |-
            A brief text description of the event (for example, its agenda). If the description is HTML-formatted,
            this field will contain the text version of the description.
          example: Time for us to sync weekly on any new project changes
          minLength: 0
        hide_participants:
          type: boolean
          description: (Not supported for iCloud or EWS events) When `true`, hides the event's list of participants.
        grant_id:
          $ref: '#/components/schemas/grant_id'
        html_link:
          $ref: '#/components/schemas/event_html_link'
        ical_uid:
          $ref: '#/components/schemas/event_ical_uid'
        id:
          $ref: '#/components/schemas/event_id'
        location:
          type:
            - string
            - 'null'
          description: The location of the event (for example, a physical address or the name of a meeting room).
        master_event_id:
          type:
            - string
            - 'null'
          description: |-
            If the event is an instance of a recurring event series, this field lists the ID of the parent
            event. If the parent event belongs to a different calendar that you don't have access to, or it's
            been deleted or cancelled, you can't retrieve it using this ID.
        metadata:
          $ref: '#/components/schemas/metadata'
        object:
          $ref: '#/components/schemas/object'
        organizer:
          $ref: '#/components/schemas/organizer'
        participants:
          $ref: '#/components/schemas/event_participants'
        resources:
          type: array
          description: An array of room resource bookings added to the event.
          items:
            $ref: '#/components/schemas/event_resources'
        read_only:
          $ref: '#/components/schemas/event_read_only'
        reminders:
          $ref: '#/components/schemas/event_reminders'
        recurrence:
          $ref: '#/components/schemas/event_recurrence'
        status:
          $ref: '#/components/schemas/event_status'
        title:
          type: string
          minLength: 1
          description: The name of the event.
          maxLength: 1024
          example: 'Remote Event: Group Yoga Class'
        updated_at:
          $ref: '#/components/schemas/event_updated_at'
        visibility:
          $ref: '#/components/schemas/event_visibility'
        when:
          $ref: '#/components/schemas/event_when_response'
        original_start_time:
          type: integer
          description: |-
            (Not supported for virtual calendars, but supported for Agent Accounts) The original start time of the event, in seconds using the Unix timestamp
            format. This field is present only if the event is an instance of a recurring event.
          example: 1633698000
        notetaker:
          $ref: '#/components/schemas/event_sync'
    event_busy:
      title: Event busy settings
      type:
        - boolean
        - 'null'
      description: |-
        When `true`, shows the event's time block as "busy" on shared or public calendars. This might be
        called "transparency" in some systems. This field may be `null` if not explicitly set. Treat `null`
        the same as `true` (the default behavior).
      example: true
    event_capacity:
      title: Event capacity settings
      type: integer
      description: The maximum number of participants that can attend the event.
      example: 5
    event_conferencing_request:
      title: Event with conferencing
      type: object
      description: |-
        An object that lets you automatically create a conference, or enter conferencing details manually.

        You can't use `autocreate` and `details` in the same request. If you do, Nylas returns an error.

        Nylas stores conference information in the event description. To remove conference details, set
        `conferencing` to `{}` and remove the corresponding conference information from the description in
        the same request.
      oneOf:
        - title: Auto-conferencing
          type: object
          description: Let Nylas autocreate the conference link.
          properties:
            provider:
              type: string
              description: The conferencing provider that Nylas uses to create the conference.
              enum:
                - Google Meet
                - Zoom Meeting
                - Microsoft Teams
            autocreate:
              type: object
              description: |-
                When you include `autocreate` in your request, Nylas automatically creates the conference
                for the event and appends the conferencing details to the event description.

                If the `provider` is `Zoom Meeting`, your Zoom OAuth app must include the following
                [granular scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-granular/)
                for Nylas to manage meetings on behalf of the user:

                - `meeting:write:meeting` — required to **create** Zoom meetings.
                - `meeting:update:meeting` — required to **update** Zoom meetings (for example, when event time or title changes).
                - `meeting:delete:meeting` — required to **delete** Zoom meetings (when events are removed).

                If any of these scopes are missing, the Zoom API rejects the request. After adding scopes
                to your Zoom app, affected users must re-authenticate their grant so their access tokens
                include the new scopes.
              properties:
                conf_grant_id:
                  type: string
                  description: |-
                    The grant ID of the account that hosts the conference. The user that belongs to this
                    grant acts as the conference host: they join the conference at the scheduled time and
                    admit other participants during the meeting.

                    Include `conf_grant_id` when the conferencing `provider` isn't available on the user's
                    own account — for example, when the `provider` is `Google Meet` but the user
                    authenticated with a Microsoft account (cross-provider autocreation). When the
                    `provider` is `Zoom Meeting`, `conf_grant_id` is always required.
                conf_settings:
                  type: object
                  additionalProperties: true
                  description: |-
                    Optional provider-specific settings that Nylas passes through when it creates the
                    conference. For `Zoom Meeting`, each key is sent as a top-level parameter to
                    [Zoom's Create a Meeting API](https://developers.zoom.us/docs/api/rest/reference/zoom-api/methods/#operation/meetingCreate)
                    — for example, `agenda`, `password`, or Zoom's own `settings` object. Nylas does _not_
                    validate these values. They can make your Zoom integration more accessible but
                    potentially less secure, so review your organization's security requirements.
        - title: Google Meet
          type: object
          description: Manually attach Google Meet details to the event.
          properties:
            provider:
              type: string
              enum:
                - Google Meet
              description: The conferencing provider for the event.
            details:
              type: object
              description: An object that contains Google Meet conferencing details.
              required:
                - url
              properties:
                url:
                  type: string
                  description: The URL for the Google Meet conference.
                phone:
                  type: array
                  items:
                    type: string
                  description: |-
                    The phone number associated with the Google Meet conference. This array accepts only
                    one phone number.
                pin:
                  type: string
                  description: The PIN associated with the Google Meet conference, if applicable.
        - title: Zoom Meeting
          type: object
          description: Manually attach Zoom Meeting details to the event.
          properties:
            provider:
              type: string
              enum:
                - Zoom Meeting
              description: The conferencing provider for the event.
            details:
              type: object
              description: An object that contains Zoom conferencing details.
              required:
                - url
              properties:
                url:
                  type: string
                  description: The URL for the Zoom conference.
                meeting_code:
                  type:
                    - string
                    - 'null'
                  description: A unique ID associated with the Zoom conference.
                password:
                  type:
                    - string
                    - 'null'
                  description: The password for the Zoom conference, if applicable.
        - title: Microsoft Teams
          type: object
          description: Manually attach Microsoft Teams details to the event.
          properties:
            provider:
              type: string
              enum:
                - Microsoft Teams
              description: The conferencing provider for the event.
            details:
              type: object
              description: An object that contains Microsoft Teams conferencing details.
              required:
                - url
              properties:
                url:
                  type: string
                  description: The URL for the Microsoft Teams conference.
        - title: Teams for Business
          type: object
          description: Manually attach Teams for Business details to the event.
          properties:
            provider:
              type: string
              enum:
                - Teams for Business
              description: The conferencing provider for the event.
            details:
              type: object
              description: An object that contains Microsoft Teams for Enterprise conferencing details.
              required:
                - url
              properties:
                url:
                  type: string
                  description: The URL for the Microsoft Teams for Enterprise conference.
        - title: Skype for Consumer
          type: object
          description: Manually attach Skype for Consumer details to the event.
          properties:
            provider:
              type: string
              enum:
                - Skype for Consumer
              description: The conferencing provider for the event.
            details:
              type: object
              description: An object that contains Skype for Consumer conferencing details.
              required:
                - url
              properties:
                url:
                  type: string
                  description: The URL for the Skype for Consumer conference.
        - title: Skype for Business
          type: object
          description: Manually attach Skype for Business details to the event.
          properties:
            provider:
              type: string
              enum:
                - Skype for Business
              description: The conferencing provider for the event.
            details:
              type: object
              description: An object that contains Skype for Business conferencing details.
              required:
                - url
              properties:
                url:
                  type: string
                  description: The URL for the Skype for Business conference.
        - title: WebEx
          type: object
          description: Manually attach WebEx details to the event.
          properties:
            provider:
              type: string
              enum:
                - WebEx
              description: The conferencing provider for the event.
            details:
              type: object
              description: An object that contains WebEx conferencing details.
              required:
                - url
              properties:
                url:
                  type: string
                  description: The URL for the WebEx conference.
                password:
                  type: string
                  description: The password for the WebEx conference, if applicable.
                pin:
                  type: string
                  description: The PIN for the WebEx conference, if applicable.
                phone:
                  type: array
                  items:
                    type: string
                  description: The phone number associated with the WebEx conference.
        - title: GoToMeeting
          type: object
          description: Manually attach GoToMeeting details to the event.
          properties:
            provider:
              type: string
              enum:
                - GoToMeeting
              description: The conferencing provider for the event.
            details:
              type: object
              description: An object that contains GoToMeeting conferencing details.
              required:
                - url
              properties:
                url:
                  type: string
                  description: The URL for the GoToMeeting conference.
                meeting_code:
                  type: string
                  description: A unique ID associated with the GoToMeeting conference.
                password:
                  type: string
                  description: The password for the GoToMeeting conference, if applicable.
                phone:
                  type: array
                  items:
                    type: string
                  description: The phone number associated with the GoToMeeting conference.
    event_description:
      title: Event description
      type: string
      description: |-
        A brief description of the event (for example, its agenda). Nylas might return the description as
        an HTML string, depending on how the provider formats it.

        For Google accounts, this field accepts a maximum of 8,192 characters.
      example: Come ready to talk philosophy!
    event_hide_participants:
      title: Hide participants on event
      type: boolean
      description: When `true`, hides the event's list of participants.
      example: false
    event_location:
      title: Event location
      type: string
      description: The location of the event (for example, a physical address or the name of a meeting room).
      maxLength: 255
      example: Room 130
    event_participants_create_update:
      title: Create event with these participants
      type: object
      properties:
        comment:
          type: string
          description: A note or comment about the participant (for example, their nickname). If the participant's email address is missing, this field is also missing.
        email:
          type: string
          description: |-
            The participant's email address.
            For Microsoft Graph, this field can be missing.
          example: dorothy@example.com
        name:
          type: string
          description: The participant's full name.
          example: Dorothy Vaughan
        phone_number:
          type: string
          description: The participant's phone number. If the participant's email address is missing, this field is also missing.
      required:
        - email
    event_reminders_create:
      title: Create reminders list
      type: object
      description: A list of reminders to send for the event. If left empty or omitted, the event uses the provider defaults.
      properties:
        use_default:
          type: boolean
          title: Use Default
          description: |-
            When `true`, the event uses the calendar's default reminder settings.

            - **Google**: Generates a `popup`-style reminder 10 minutes before the event begins.
            - **Microsoft**: Generates a reminder 15 minutes before the event begins.
            - **iCloud**: Does not generate a reminder.
            - **EWS**: Generates a `display`-style reminder 15 minutes before the event begins.
        overrides:
          type: array
          title: Overrides
          description: |-
            A list of reminders for the event to use when `use_default` is `false`. If this field is empty
            or omitted, and `use_default` is `false`, the event does not send reminders. If `true`, Nylas
            generates both the default event reminder and any reminders in the `overrides` list.

            You cannot set reminder overrides if `use_default` is `true`.

            For Microsoft Graph, EWS, and iCloud, you can set only one reminder per event.
          items:
            type: object
            properties:
              reminder_minutes:
                type: integer
                example: 20
                description: The number of minutes before the event start time when a user wants to receive a reminder for this event.
              reminder_method:
                type: string
                description: |-
                  (Google and iCloud only) The method used to notify the user about the event, with separate
                  options and default settings for each provider.

                  - **Google**:
                    - Default: `popup`
                    - Options: `popup`, `email`
                  - **iCloud**:
                    - Default: `display`
                    - Options: `display`, `sound`
                enum:
                  - popup
                  - email
                  - display
                  - sound
                example: popup
    event_title:
      title: Event title
      type: string
      description: The name of the event.
      maxLength: 1024
      example: Annual Philosophy Club Meeting
    event_time:
      title: Time
      type: object
      description: A specific point in time (for example, the start time of an event).
      properties:
        time:
          type: integer
          description: The time that the meeting occurs, in seconds using the Unix timestamp format.
          example: 1633698000
        timezone:
          type: string
          description: |-
            The timezone of the event as an
            [IANA-formatted](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones) string. If
            populated, Nylas reads the value of `time` with the provided timezone.
          example: America/New_York
    event_when:
      title: When
      type: object
      description: |-
        An object that represents the time and duration of an event.

        You can format `when` as one of four sub-objects: `time`, `timespan`, `date`, or `datespan`. These
        sub-objects allow you to capture and represent specific points in time.

        `time` and `timespan` objects include optional timezone support.
      oneOf:
        - $ref: '#/components/schemas/event_time'
        - $ref: '#/components/schemas/event_timespan'
        - $ref: '#/components/schemas/event_date'
        - $ref: '#/components/schemas/event_datespan'
    event_create:
      title: create_event
      type: object
      required:
        - when
      properties:
        busy:
          $ref: '#/components/schemas/event_busy'
        capacity:
          $ref: '#/components/schemas/event_capacity'
        conferencing:
          $ref: '#/components/schemas/event_conferencing_request'
        description:
          $ref: '#/components/schemas/event_description'
        hide_participants:
          $ref: '#/components/schemas/event_hide_participants'
        location:
          $ref: '#/components/schemas/event_location'
        metadata:
          $ref: '#/components/schemas/metadata'
        notetaker:
          $ref: '#/components/schemas/event_sync'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/event_participants_create_update'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/event_resources'
        recurrence:
          $ref: '#/components/schemas/event_recurrence'
        reminders:
          $ref: '#/components/schemas/event_reminders_create'
        title:
          $ref: '#/components/schemas/event_title'
        visibility:
          $ref: '#/components/schemas/event_visibility'
        when:
          $ref: '#/components/schemas/event_when'
    event:
      allOf:
        - $ref: '#/components/schemas/event_common'
    event_send_rsvp:
