    post:
      summary: Invite standalone Notetaker to meeting
      tags:
        - Standalone Notetaker
      operationId: invite-standalone-notetaker
      description: |-
        Adds a standalone Notetaker bot to the specified meeting.

        You can optionally provide a `config_id` to reference an existing [configuration](/docs/v3/notetaker/configurations/),
        or pass `notetaker_settings` inline to create a per-notetaker configuration. If neither is provided,
        settings are resolved from the nearest ancestor configuration in the hierarchy.

        If [dispatch suppression](/docs/v3/notetaker/dispatch-suppression/) is active for the
        application or workspace, requests that would join immediately return
        `400 Bad Request` ("notetaker dispatch is disabled") and no Notetaker is created.

        To upload a [custom video output image](/docs/v3/notetaker/custom-video-output/),
        send the request as `multipart/form-data` with the JSON body in a part named
        `notetaker` and the image in a file part referenced by
        `notetaker_settings.video_output.file_key`. Small images (up to 1,376,256 decoded
        bytes) can be sent inline on `application/json` requests using
        `video_output.media_type` and `video_output.data` instead.
      x-scopes:
        google:
          min: ''
        microsoft:
          min: ''
        yahoo:
          min: ''
