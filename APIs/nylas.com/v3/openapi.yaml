    signature_create:
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - body
            properties:
              name:
                type: string
                description: A label for the signature (for example, "Work", "Personal", or "Mobile").
                example: Work Signature
              body:
                type: string
                description: |-
                  The HTML content of the signature. Maximum 100 KB. Images must use externally hosted URLs
                  (base64 inline images are not supported). Nylas sanitizes the HTML on input to prevent
                  malicious content.
                example: <div><p><strong>Nick Barraclough</strong></p><p>Product Manager | Nylas</p><p><a href="mailto:nick@nylas.com">nick@nylas.com</a></p></div>
          example:
            name: Work Signature
            body: <div><p><strong>Nick Barraclough</strong></p><p>Product Manager | Nylas</p><p><a href="mailto:nick@nylas.com">nick@nylas.com</a></p></div>
    signature_update:
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: Updated label for the signature.
                example: Updated Work Signature
              body:
                type: string
                description: |-
                  Updated HTML content for the signature. Maximum 100 KB. Images must use externally hosted
                  URLs (base64 inline images are not supported). Nylas sanitizes the HTML on input to prevent
                  malicious content.
                example: <div><p><strong>Nick Barraclough</strong></p><p>Senior Product Manager | Nylas</p></div>
          example:
            name: Updated Work Signature
            body: <div><p><strong>Nick Barraclough</strong></p><p>Senior Product Manager | Nylas</p></div>
    workflow_create:
      description: Create workflow request
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - template_id
              - trigger_event
            properties:
              delay:
                type: integer
                description: |-
                  The number of minutes between a `trigger_event` being met and the workflow
                  sending a message.
                default: 0
                example: 5
              is_enabled:
                type: boolean
                description: When `true`, indicates that the workflow is enabled.
                default: true
                example: true
              name:
                type: string
                description: The name of the workflow.
                example: New booking confirmation workflow
              template_id:
                type: string
                description: The ID of the email template the workflow uses.
                example: 14c00cc8-648c-4381-ad10-52641d9bac8e
              trigger_event:
                type: string
                enum:
                  - booking.cancelled
                  - booking.created
                  - booking.pending
                  - booking.reminder
                  - booking.rescheduled
                description: The event which triggers the workflow.
                example: booking.created
              from:
                type:
                  - object
                  - 'null'
                description: |-
                  Details of the sender if the workflow should use [transactional send](/docs/reference/api/transactional-send/).
                  If not provided, the sender will be the grant associated with the trigger event.
                properties:
                  email:
                    type: string
                    description: The email address of the sender.
                    example: support@example.com
                  name:
                    type: string
                    description: The name of the sender.
                    example: Support
    workflow_update:
      description: Update workflow request
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              delay:
                type: integer
                description: |-
                  The number of minutes between a `trigger_event` being met and the workflow
                  sending a message.
                example: 1
              is_enabled:
                type: boolean
                description: When `true`, indicates that the workflow is enabled.
                example: false
              name:
                type: string
                description: The name of the workflow.
                example: Updated booking confirmation workflow
              template_id:
                type: string
                description: The ID of the email template the workflow uses.
                example: 14c00cc8-648c-4381-ad10-52641d9bac8e
              trigger_event:
                type: string
                enum:
                  - booking.cancelled
                  - booking.created
                  - booking.pending
                  - booking.reminder
                  - booking.rescheduled
                description: The event which triggers the workflow.
                example: booking.created
              from:
                type:
                  - object
                  - 'null'
                description: |-
                  Details of the sender if the workflow should use [transactional send](/docs/reference/api/transactional-send/).
                  If not provided, the sender will be the grant associated with the trigger event.
                properties:
                  email:
                    type: string
                    description: The email address of the sender.
                    example: support@example.com
                  name:
                    type: string
                    description: The name of the sender.
                    example: Support
    template_create:
      description: Create template request
      content:
        application/json:
          schema:
            type: object
            required:
              - body
              - name
              - subject
            properties:
              body:
                type: string
                description: The body content of the template, in HTML format.
                example: <p>Hello {{user.name}}, your booking has been confirmed.</p>
              engine:
                type: string
                description: The templating engine to use.
                enum:
                  - handlebars
                  - mustache
                  - nunjucks
                  - twig
                default: mustache
                example: mustache
              name:
                type: string
                description: The name of the template.
                example: Booking confirmed message
              subject:
                type: string
                description: The subject line of the template.
                example: '{{user.name}}, your booking is confirmed!'
    template_update:
      description: Update template request
      content:
        application/json:
          schema:
            type: object
            properties:
              body:
                type: string
                description: The body content of the template, in HTML format.
                example: <p>Hello {{user.name}}, your booking has been confirmed.</p>
              engine:
                type: string
                description: The templating engine to use.
                enum:
                  - handlebars
                  - mustache
                  - nunjucks
                  - twig
                example: mustache
              name:
                type: string
                description: The name of the template.
                example: Updated booking confirmed message
              subject:
                type: string
                description: The subject line of the template.
                example: '{{user.name}}, your booking is confirmed!'
    template_render_html:
      content:
        application/json:
          schema:
            type: object
            required:
              - body
              - engine
              - variables
            properties:
              body:
                type: string
                description: The body content of the template, in HTML format.
                example: <p>Hello {{user.name}}, this shows test was {{ foo }}.</p>
              engine:
                type: string
                description: The templating engine to use.
                enum:
                  - handlebars
                  - mustache
                  - nunjucks
                  - twig
                example: mustache
              strict:
                type: boolean
                description: |-
                  When `true`, Nylas returns an error if the template contains variables that aren't defined
                  in the `variables` object.
                default: true
                example: true
              variables:
                type: object
                description: |-
                  A set of key/value pairs representing variables to substitute for values in the
                  template.
                additionalProperties:
                  type: string
                example:
                  user:
                    name: Leyah
                    surname: Miller
                  foo: testing successful
    template_render:
      content:
        application/json:
          schema:
            type: object
            required:
              - variables
            properties:
              strict:
                type: boolean
                description: |-
                  When `true`, Nylas returns an error if the template contains variables that aren't
                  defined in the `variables` object.
                default: true
                example: true
              variables:
                type: object
                description: |-
                  A set of key/value pairs representing variables to substitute for values in the
                  template.
                additionalProperties:
                  type: string
                example:
                  user:
                    name: Leyah
                    surname: Miller
  securitySchemes:
    ACCESS_TOKEN:
      scheme: bearer
      type: http
      bearerFormat: NYLAS_ACCESS_TOKEN
      description: |-
        The Nylas **access token** for a specific grant. Issued as part of OAuth 2.1 flow token
        exchange.
    NYLAS_API_KEY:
      scheme: bearer
      type: http
      bearerFormat: NYLAS_API_KEY
      description: |-
        The Nylas **API key** provides application-level access to APIs and all grants. You can
        generate these from the Dashboard. Learn more about [authorizing requests](/docs/v3/auth/).
  responses:
    '202':
      description: Email Send Accepted
      content:
        application/json:
          schema:
            type: object
            required:
              - grant_id
              - data
              - request_id
              - schedule_id
            properties:
              grant_id:
                type: string
              request_id:
                type: string
              data:
                $ref: '#/components/schemas/message_send_response'
          examples:
            example1:
              description: Save a scheduled message with an Attachment as a draft
              value:
                request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
                schedule_id: 17d0281e-0c25-4ad1-a275-639c74f5f6a4
                send_at: 1671234087
                use_draft: true
                grant_id: your grant_id
                data:
                  subject: Sending Emails with Nylas
                  body: Nylas API v3 Test!
                  from:
                    - name: John Doe
                      email: johnn.doe@example.com
                  to:
                    - name: Jane Doe
                      email: jane.doe@example.com
                  cc:
                    - name: Nylas
                      email: nylas@example.com
                  bcc:
                    - name: Nylas
                      email: nylas@example.com
                  attachments:
                    - content_id: HASKDJhiuahsdjlkhKJAsd=
                      content_type: text/plain
                      content_disposition: inline
                      filename: myfile.txt
            example2:
              description: Send a scheduled message with many recipients
              value:
                request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
                schedule_id: 17d0281e-0c25-4ad1-a275-639c74f5f6a4
                send_at: 1671234087
                use_draft: false
                grant_id: your grant_id
                data:
                  subject: Sending Emails with Nylas
                  body: Nylas API v3 Test!
                  from:
                    - name: John Doe
                      email: johnn.doe@example.com
                  to:
                    - name: Jane Doe
                      email: jane.doe@example.com
                    - name: Scott
                      email: scott@example.com
                    - name: Tom
                      email: tom@example.com
                  attachments:
                    - content_id: HASKDJhiuahsdjlkhKJAsd=
                      content_type: text/plain
                      filename: myfile.txt
                      content_disposition: attachment
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            title: error
            type: object
            properties:
              request_id:
                type: string
                description: The request ID.
              error:
                type: object
                description: The response error object.
                properties:
                  type:
                    type: string
                    description: The error type.
                  message:
                    type: string
                    description: The error message.
                  provider_error:
                    type: object
                    description: The error from the provider.
          examples:
            Bad Request:
              value:
                request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
                error:
                  type: invalid_request_error
                  message: error parsing request body
                  provider_error:
                    code: TargetIdShouldNotBeMeOrWhitespace
                    message: Id is malformed.
            Invalid Idempotency-Key:
              value:
                request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
                error:
                  type: api.invalid_idempotency_key
