servers:
  - url: https://pollen.googleapis.com
paths:
  /v1/forecast:lookup:
    get:
      operationId: pollen.forecast.lookup
      description: Returns up to 5 days of daily pollen information in more than 65 countries, up to 1km resolution.
      parameters:
        - name: days
          in: query
          schema:
            format: int32
            type: integer
          description: Required. A number that indicates how many forecast days to request (minimum value 1, maximum value is 5).
        - name: languageCode
          in: query
          schema:
            type: string
          description: Optional. Allows the client to choose the language for the response. If data cannot be provided for that language, the API uses the closest match. Allowed values rely on the IETF BCP-47 standard. The default value is "en".
        - name: location.latitude
          in: query
          schema:
            format: double
            type: number
          description: The latitude in degrees. It must be in the range [-90.0, +90.0].
        - name: location.longitude
          in: query
          schema:
            format: double
            type: number
          description: The longitude in degrees. It must be in the range [-180.0, +180.0].
        - name: pageSize
          in: query
          schema:
            format: int32
            type: integer
          description: Optional. The maximum number of daily info records to return per page. The default and max value is 5, indicating 5 days of data.
        - name: pageToken
          in: query
          schema:
            type: string
          description: Optional. A page token received from a previous daily call. It is used to retrieve the subsequent page. Note that when providing a value for the page token, all other request parameters provided must match the previous call that provided the page token.
        - name: plantsDescription
          in: query
          schema:
            type: boolean
          description: Optional. Contains general information about plants, including details on their seasonality, special shapes and colors, information about allergic cross-reactions, and plant photos. The default value is "true".
      tags:
        - forecast
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/cloud-platform
        - Oauth2c:
            - https://www.googleapis.com/auth/cloud-platform
      responses:
        2XX:
          description: Successful response; Discovery does not specify an HTTP status code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupForecastResponse'
      x-google-discovery:
        path: v1/forecast:lookup
        flatPath: v1/forecast:lookup
        parameterOrder: []
    parameters:
      - $ref: '#/components/parameters/$.xgafv'
      - $ref: '#/components/parameters/access_token'
      - $ref: '#/components/parameters/alt'
      - $ref: '#/components/parameters/callback'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/key'
      - $ref: '#/components/parameters/oauth_token'
      - $ref: '#/components/parameters/prettyPrint'
      - $ref: '#/components/parameters/quotaUser'
      - $ref: '#/components/parameters/uploadType'
      - $ref: '#/components/parameters/upload_protocol'
  /v1/mapTypes/{mapType}/heatmapTiles/{zoom}/{x}/{y}:
    get:
      operationId: pollen.mapTypes.heatmapTiles.lookupHeatmapTile
      description: Returns a byte array containing the data of the tile PNG image.
      parameters:
        - name: mapType
          in: path
          schema:
            enum:
              - MAP_TYPE_UNSPECIFIED
              - TREE_UPI
              - GRASS_UPI
              - WEED_UPI
            x-google-enum-descriptions:
              - Unspecified map type.
              - The heatmap type will represent a tree index graphical map.
              - The heatmap type will represent a grass index graphical map.
              - The heatmap type will represent a weed index graphical map.
            type: string
          description: Required. The type of the pollen heatmap. Defines the combination of pollen type and index that the map will graphically represent.
          required: true
        - name: zoom
          in: path
          schema:
            format: int32
            type: integer
          description: 'Required. The map''s zoom level. Defines how large or small the contents of a map appear in a map view. * Zoom level 0 is the entire world in a single tile. * Zoom level 1 is the entire world in 4 tiles. * Zoom level 2 is the entire world in 16 tiles. * Zoom level 16 is the entire world in 65,536 tiles. Allowed values: 0-16'
          required: true
        - name: x
          in: path
          schema:
            format: int32
            type: integer
          description: Required. Defines the east-west point in the requested tile.
          required: true
        - name: y
          in: path
          schema:
            format: int32
            type: integer
          description: Required. Defines the north-south point in the requested tile.
          required: true
      tags:
        - mapTypes
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/cloud-platform
        - Oauth2c:
            - https://www.googleapis.com/auth/cloud-platform
      responses:
        2XX:
          description: Successful response; Discovery does not specify an HTTP status code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpBody'
      x-google-discovery:
        path: v1/mapTypes/{mapType}/heatmapTiles/{zoom}/{x}/{y}
        flatPath: v1/mapTypes/{mapType}/heatmapTiles/{zoom}/{x}/{y}
        parameterOrder:
          - mapType
          - zoom
          - x
          - y
    parameters:
