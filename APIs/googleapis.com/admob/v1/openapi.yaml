        - Oauth2c:
            - https://www.googleapis.com/auth/admob.report
      responses:
        2XX:
          description: Successful response; Discovery does not specify an HTTP status code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherAccount'
