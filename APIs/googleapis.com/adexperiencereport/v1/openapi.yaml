          description: 'Component of the original `name` resource name. Required. The name of the site whose summary to get, e.g. `sites/http%3A%2F%2Fwww.google.com%2F`. Format: `sites/{site}`'
          schema:
            type: string
      tags:
        - sites
      responses:
