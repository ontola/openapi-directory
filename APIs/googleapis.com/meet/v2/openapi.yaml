            - $ref: '#/components/schemas/RecordingConfig'
        smartNotesConfig:
          description: Configuration for auto-smart-notes.
          allOf:
            - $ref: '#/components/schemas/SmartNotesConfig'
        transcriptionConfig:
          description: Configuration for auto-transcript.
          allOf:
            - $ref: '#/components/schemas/TranscriptionConfig'
      type: object
    BatchUpdateMembersRequest:
      description: Request to update members of one space within a batch.
      x-google-discovery-id: BatchUpdateMembersRequest
      properties:
        requests:
          description: Required. The request message specifying the resources to update. A maximum of 500 members can be modified in a batch.
          items:
            $ref: '#/components/schemas/UpdateMemberRequest'
          type: array
        updateMask:
          description: 'Optional. Top-level field mask used to specify the fields to be updated in the member for all UpdateMemberRequests. There are 4 possible scenarios for top-level and child field mask: 1. top-level and child field mask is absent: All fields provided in the requests are updated, including deleting fields not set in the requests. 2. top-level field mask is present but child field mask is absent: The fields specified in the top-level field mask are updated. 3. top-level and child field mask is present: The child field mask must be the same as the top-level field mask. 4. top-level field mask is absent but child field mask is present: It isn''t supported and will return an error.'
          format: google-fieldmask
          type: string
      type: object
    BatchUpdateMembersResponse:
      description: Response of batch update members.
      x-google-discovery-id: BatchUpdateMembersResponse
      properties:
        members:
          description: Members updated.
          items:
            $ref: '#/components/schemas/Member'
          type: array
      type: object
    ConferenceRecord:
      description: Single instance of a meeting held in a space.
      x-google-discovery-id: ConferenceRecord
      properties:
        endTime:
          description: Output only. Timestamp when the conference ended. Set for past conferences. Unset if the conference is ongoing.
          format: google-datetime
          readOnly: true
          type: string
