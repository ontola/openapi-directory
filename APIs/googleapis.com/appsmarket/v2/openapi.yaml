            type: string
          description: The ID of the customer.
          required: true
      tags:
        - customerLicense
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/appsmarketplace.license
        - Oauth2c:
            - https://www.googleapis.com/auth/appsmarketplace.license
      responses:
