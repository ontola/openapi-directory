          description: By changing the type to DIST, the patching is performed using `apt-get dist-upgrade` instead.
          enum:
            - TYPE_UNSPECIFIED
            - DIST
            - UPGRADE
          x-google-enum-descriptions:
            - By default, upgrade will be performed.
