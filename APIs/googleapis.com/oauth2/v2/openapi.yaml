components:
  schemas:
    Tokeninfo:
      x-google-discovery-id: Tokeninfo
      properties:
        audience:
          description: Who is the intended audience for this token. In general the same as issued_to.
          type: string
        email:
          description: The email address of the user. Present only if the email scope is present in the request.
          type: string
        expires_in:
          description: The expiry time of the token, as number of seconds left until expiry.
          format: int32
          type: integer
        issued_to:
          description: To whom was the token issued to. In general the same as audience.
          type: string
        scope:
          description: The space separated list of scopes granted to this token.
          type: string
        user_id:
          description: The obfuscated user id.
          type: string
        verified_email:
          description: Boolean flag which is true if the email address is verified. Present only if the email scope is present in the request.
          type: boolean
      type: object
    Userinfo:
      x-google-discovery-id: Userinfo
      properties:
        email:
          description: The user's email address.
          type: string
        family_name:
          description: The user's last name.
          type: string
        gender:
          description: The user's gender.
          type: string
        given_name:
          description: The user's first name.
          type: string
        hd:
          description: The hosted domain e.g. example.com if the user is Google apps user.
          type: string
        id:
          description: The obfuscated ID of the user.
          type: string
        link:
          description: URL of the profile page.
          type: string
        locale:
          description: The user's preferred locale.
          type: string
        name:
          description: The user's full name.
          type: string
        picture:
          description: URL of the user's picture image.
          type: string
        verified_email:
          default: true
          description: Boolean flag which is true if the email address is verified. Always verified because we only return the user's primary email address.
          type: boolean
      type: object
  parameters:
    alt:
      name: alt
      in: query
      schema:
        default: json
        enum:
          - json
        x-google-enum-descriptions:
          - Responses with Content-Type of application/json
        type: string
      description: Data format for the response.
    fields:
      name: fields
      in: query
      schema:
        type: string
      description: Selector specifying which fields to include in a partial response.
    key:
      name: key
      in: query
      schema:
        type: string
      description: API key. Your API key identifies your project and provides you with API access, quota, and reports. Required unless you provide an OAuth 2.0 token.
    oauth_token:
      name: oauth_token
      in: query
      schema:
        type: string
      description: OAuth 2.0 token for the current user.
    prettyPrint:
      name: prettyPrint
      in: query
      schema:
        default: true
        type: boolean
      description: Returns response with indentations and line breaks.
    quotaUser:
      name: quotaUser
      in: query
      schema:
        type: string
      description: An opaque string that represents a user for quota purposes. Must not exceed 40 characters.
    userIp:
      name: userIp
      in: query
      schema:
        type: string
      description: Deprecated. Please use quotaUser instead.
  securitySchemes:
    Oauth2:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
          scopes:
            https://www.googleapis.com/auth/userinfo.email: See your primary Google Account email address
            https://www.googleapis.com/auth/userinfo.profile: See your personal info, including any personal info you've made publicly available
            openid: Associate you with your personal info on Google
    Oauth2c:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          scopes:
            https://www.googleapis.com/auth/userinfo.email: See your primary Google Account email address
            https://www.googleapis.com/auth/userinfo.profile: See your personal info, including any personal info you've made publicly available
            openid: Associate you with your personal info on Google
