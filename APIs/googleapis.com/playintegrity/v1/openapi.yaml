      - $ref: '#/components/parameters/prettyPrint'
      - $ref: '#/components/parameters/quotaUser'
      - $ref: '#/components/parameters/uploadType'
      - $ref: '#/components/parameters/upload_protocol'
  /v1/{v1Id}:decodeIntegrityToken:
    post:
      operationId: playintegrity.decodeIntegrityToken
      description: Decodes the integrity token and returns the token payload.
      parameters:
        - name: v1Id
          in: path
          required: true
          description: Component of the original `packageName` resource name.  Package name of the app the attached integrity token belongs to.
          schema:
            type: string
      tags:
        - v1
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/playintegrity
        - Oauth2c:
            - https://www.googleapis.com/auth/playintegrity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecodeIntegrityTokenRequest'
      responses:
        2XX:
          description: Successful response; Discovery does not specify an HTTP status code.
          content:
