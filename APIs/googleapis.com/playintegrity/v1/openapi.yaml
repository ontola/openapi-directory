              schema:
                $ref: '#/components/schemas/DecodeIntegrityTokenResponse'
      x-google-discovery:
        path: v1/{+packageName}:decodeIntegrityToken
        flatPath: v1/{v1Id}:decodeIntegrityToken
        resourceNameBindings:
          v1Id: packageName
        resourceNameParameters:
          packageName:
            description: ' Package name of the app the attached integrity token belongs to.'
            location: path
            pattern: ^[^/]+$
            required: true
            type: string
        parameterOrder:
          - packageName
    parameters:
      - $ref: '#/components/parameters/$.xgafv'
      - $ref: '#/components/parameters/access_token'
