servers:
  - url: https://playintegrity.googleapis.com
paths:
  /v1/{v1Id}/deviceRecall:write:
    post:
      operationId: playintegrity.deviceRecall.write
      description: Writes recall bits for the device where Play Integrity API token is obtained. The endpoint is available to select Play partners in an early access program (EAP).
      parameters:
        - name: v1Id
          in: path
          required: true
          description: Component of the original `packageName` resource name. Required. Package name of the app the attached integrity token belongs to.
          schema:
            type: string
      tags:
        - deviceRecall
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/playintegrity
        - Oauth2c:
            - https://www.googleapis.com/auth/playintegrity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteDeviceRecallRequest'
      responses:
        2XX:
          description: Successful response; Discovery does not specify an HTTP status code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteDeviceRecallResponse'
      x-google-discovery:
        path: v1/{+packageName}/deviceRecall:write
        flatPath: v1/{v1Id}/deviceRecall:write
        resourceNameBindings:
          v1Id: packageName
        resourceNameParameters:
          packageName:
            description: Required. Package name of the app the attached integrity token belongs to.
            location: path
            pattern: ^[^/]+$
            required: true
            type: string
        parameterOrder:
          - packageName
    parameters:
      - $ref: '#/components/parameters/$.xgafv'
      - $ref: '#/components/parameters/access_token'
