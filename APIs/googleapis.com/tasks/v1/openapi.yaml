        flatPath: tasks/v1/lists/{tasklist}/tasks
        parameterOrder:
          - tasklist
    get:
      operationId: tasks.tasks.list
      description: Returns all tasks in the specified task list. Doesn't return assigned tasks by default (from Docs, Chat Spaces). A user can have up to 20,000 non-hidden tasks per list and up to 100,000 tasks in total at a time.
      parameters:
        - name: tasklist
          in: path
          schema:
            type: string
          description: Task list identifier.
          required: true
        - name: completedMax
          in: query
          schema:
            type: string
          description: Optional. Upper bound for a task's completion date (as a RFC 3339 timestamp) to filter by. The default is not to filter by completion date.
        - name: completedMin
          in: query
          schema:
            type: string
          description: Optional. Lower bound for a task's completion date (as a RFC 3339 timestamp) to filter by. The default is not to filter by completion date.
        - name: dueMax
          in: query
          schema:
            type: string
          description: Optional. Upper bound for a task's due date (as a RFC 3339 timestamp) to filter by. The default is not to filter by due date.
        - name: dueMin
          in: query
          schema:
            type: string
          description: Optional. Lower bound for a task's due date (as a RFC 3339 timestamp) to filter by. The default is not to filter by due date.
        - name: maxResults
          in: query
          schema:
            format: int32
            type: integer
          description: 'Optional. Maximum number of tasks returned on one page. The default is 20 (max allowed: 100).'
        - name: pageToken
          in: query
          schema:
            type: string
          description: Optional. Token specifying the result page to return.
        - name: showAssigned
          in: query
          schema:
            type: boolean
          description: Optional. Flag indicating whether tasks assigned to the current user are returned in the result. The default is False.
        - name: showCompleted
          in: query
          schema:
            type: boolean
          description: Optional. Flag indicating whether completed tasks are returned in the result. Note that showHidden must also be True to show tasks completed in first party clients, such as the web UI and Google's mobile apps. The default is True.
        - name: showDeleted
          in: query
          schema:
            type: boolean
          description: Optional. Flag indicating whether deleted tasks are returned in the result. The default is False.
        - name: showHidden
          in: query
          schema:
            type: boolean
          description: Optional. Flag indicating whether hidden tasks are returned in the result. The default is False.
        - name: updatedMin
          in: query
          schema:
            type: string
          description: Optional. Lower bound for a task's last modification time (as a RFC 3339 timestamp) to filter by. The default is not to filter by last modification time.
      tags:
        - tasks
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/tasks
        - Oauth2c:
            - https://www.googleapis.com/auth/tasks
        - Oauth2:
            - https://www.googleapis.com/auth/tasks.readonly
        - Oauth2c:
            - https://www.googleapis.com/auth/tasks.readonly
      responses:
        2XX:
          description: Successful response; Discovery does not specify an HTTP status code.
          content:
            application/json:
              schema:
