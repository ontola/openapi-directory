  /tasks/v1/lists/{tasklist}/tasks:
    post:
      operationId: tasks.tasks.insert
      description: Creates a new task on the specified task list. Tasks assigned from Docs or Chat Spaces cannot be inserted from Tasks Public API; they can only be created by assigning them from Docs or Chat Spaces. A user can have up to 20,000 non-hidden tasks per list and up to 100,000 tasks in total at a time.
      parameters:
        - name: tasklist
          in: path
          schema:
            type: string
          description: Task list identifier.
          required: true
        - name: hidden
          in: query
          schema:
            type: boolean
          description: Optional. Flag indicating whether the task is created as 'hidden', as if it had been completed and then cleared from the task list (see the "clear" method). Hidden tasks are not returned by default when retrieving all tasks for a task list (see showHidden). Only completed tasks can be created as hidden, and they can not be nested or positioned, so parent and previous must be empty.
        - name: parent
          in: query
          schema:
            type: string
          description: Optional. Parent task identifier. If the task is created at the top level, this parameter is omitted. An assigned task cannot be a parent task, nor can it have a parent. Setting the parent to an assigned task results in failure of the request.
        - name: previous
          in: query
          schema:
            type: string
          description: Optional. Previous sibling task identifier. If the task is created at the first position among its siblings, this parameter is omitted.
      tags:
        - tasks
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/tasks
        - Oauth2c:
