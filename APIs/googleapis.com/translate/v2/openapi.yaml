servers:
  - url: https://translation.googleapis.com/language/translate
paths:
  /v2/detect:
    post:
      operationId: language.detections.detect
      description: Detects the language of text within a request.
      tags:
        - detections
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/cloud-translation
        - Oauth2c:
            - https://www.googleapis.com/auth/cloud-translation
        - Oauth2:
            - https://www.googleapis.com/auth/cloud-platform
        - Oauth2c:
            - https://www.googleapis.com/auth/cloud-platform
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetectLanguageRequest'
      responses:
        2XX:
          description: Successful response; Discovery does not specify an HTTP status code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionsListResponse'
      x-google-discovery:
        path: v2/detect
        parameterOrder: []
    get:
      operationId: language.detections.list
      description: Detects the language of text within a request.
      parameters:
        - name: q
          in: query
          schema:
            type: array
            items:
              type: string
          description: 'The input text upon which to perform language detection. Repeat this

            parameter to perform language detection on multiple text inputs.'
          required: true
          style: form
          explode: true
      tags:
        - detections
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/cloud-translation
        - Oauth2c:
            - https://www.googleapis.com/auth/cloud-translation
        - Oauth2:
            - https://www.googleapis.com/auth/cloud-platform
        - Oauth2c:
            - https://www.googleapis.com/auth/cloud-platform
      responses:
        2XX:
          description: Successful response; Discovery does not specify an HTTP status code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionsListResponse'
      x-google-discovery:
        path: v2/detect
        parameterOrder:
          - q
    parameters:
      - $ref: '#/components/parameters/$.xgafv'
      - $ref: '#/components/parameters/access_token'
      - $ref: '#/components/parameters/alt'
      - $ref: '#/components/parameters/bearer_token'
      - $ref: '#/components/parameters/callback'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/key'
      - $ref: '#/components/parameters/oauth_token'
      - $ref: '#/components/parameters/pp'
      - $ref: '#/components/parameters/prettyPrint'
      - $ref: '#/components/parameters/quotaUser'
      - $ref: '#/components/parameters/uploadType'
      - $ref: '#/components/parameters/upload_protocol'
  /v2/languages:
    get:
      operationId: language.languages.list
      description: Returns a list of supported languages for translation.
      parameters:
        - name: model
          in: query
          schema:
            type: string
          description: The model type for which supported languages should be returned.
        - name: target
          in: query
          schema:
            type: string
          description: 'The language to use to return localized, human readable names of supported

            languages.'
      tags:
        - languages
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/cloud-translation
        - Oauth2c:
            - https://www.googleapis.com/auth/cloud-translation
        - Oauth2:
            - https://www.googleapis.com/auth/cloud-platform
        - Oauth2c:
            - https://www.googleapis.com/auth/cloud-platform
      responses:
        2XX:
          description: Successful response; Discovery does not specify an HTTP status code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguagesListResponse'
      x-google-discovery:
        path: v2/languages
    parameters:
      - $ref: '#/components/parameters/$.xgafv'
      - $ref: '#/components/parameters/access_token'
      - $ref: '#/components/parameters/alt'
      - $ref: '#/components/parameters/bearer_token'
      - $ref: '#/components/parameters/callback'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/key'
      - $ref: '#/components/parameters/oauth_token'
      - $ref: '#/components/parameters/pp'
      - $ref: '#/components/parameters/prettyPrint'
      - $ref: '#/components/parameters/quotaUser'
      - $ref: '#/components/parameters/uploadType'
      - $ref: '#/components/parameters/upload_protocol'
  /v2:
    get:
      operationId: language.translations.list
      description: Translates input text, returning translated text.
      parameters:
        - name: cid
          in: query
          schema:
            type: array
            items:
              type: string
          description: The customization id for translate
          style: form
          explode: true
        - name: format
          in: query
          schema:
            enum:
              - html
              - text
            x-google-enum-descriptions:
              - Specifies the input is in HTML
              - Specifies the input is in plain textual format
            type: string
          description: 'The format of the source text, in either HTML (default) or plain-text. A

            value of "html" indicates HTML and a value of "text" indicates plain-text.'
        - name: model
          in: query
          schema:
            type: string
          description: 'The `model` type requested for this translation. Valid values are

            listed in public documentation.'
        - name: q
          in: query
          schema:
            type: array
            items:
              type: string
          description: 'The input text to translate. Repeat this parameter to perform translation

            operations on multiple text inputs.'
          required: true
          style: form
          explode: true
        - name: source
          in: query
          schema:
            type: string
          description: 'The language of the source text, set to one of the language codes listed in

            Language Support. If the source language is not specified, the API will

            attempt to identify the source language automatically and return it within

            the response.'
        - name: target
          in: query
          schema:
            type: string
          description: 'The language to use for translation of the input text, set to one of the

            language codes listed in Language Support.'
          required: true
      tags:
        - translations
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/cloud-translation
        - Oauth2c:
            - https://www.googleapis.com/auth/cloud-translation
        - Oauth2:
            - https://www.googleapis.com/auth/cloud-platform
        - Oauth2c:
            - https://www.googleapis.com/auth/cloud-platform
      responses:
        2XX:
          description: Successful response; Discovery does not specify an HTTP status code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationsListResponse'
      x-google-discovery:
        path: v2
        parameterOrder:
          - q
          - target
    post:
      operationId: language.translations.translate
      description: Translates input text, returning translated text.
      tags:
        - translations
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/cloud-translation
        - Oauth2c:
            - https://www.googleapis.com/auth/cloud-translation
        - Oauth2:
            - https://www.googleapis.com/auth/cloud-platform
        - Oauth2c:
            - https://www.googleapis.com/auth/cloud-platform
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslateTextRequest'
      responses:
        2XX:
          description: Successful response; Discovery does not specify an HTTP status code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationsListResponse'
      x-google-discovery:
        path: v2
        parameterOrder: []
    parameters:
      - $ref: '#/components/parameters/$.xgafv'
      - $ref: '#/components/parameters/access_token'
      - $ref: '#/components/parameters/alt'
      - $ref: '#/components/parameters/bearer_token'
      - $ref: '#/components/parameters/callback'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/key'
      - $ref: '#/components/parameters/oauth_token'
      - $ref: '#/components/parameters/pp'
      - $ref: '#/components/parameters/prettyPrint'
      - $ref: '#/components/parameters/quotaUser'
      - $ref: '#/components/parameters/uploadType'
      - $ref: '#/components/parameters/upload_protocol'
components:
  schemas:
    DetectLanguageRequest:
      description: The request message for language detection.
      x-google-discovery-id: DetectLanguageRequest
      properties:
        q:
          description: 'The input text upon which to perform language detection. Repeat this

            parameter to perform language detection on multiple text inputs.'
          items:
            type: string
          type: array
      type: object
    DetectionsListResponse:
      x-google-discovery-id: DetectionsListResponse
      properties:
        detections:
          description: A detections contains detection results of several text
          items:
            $ref: '#/components/schemas/DetectionsResource'
          type: array
      type: object
    DetectionsResource:
      description: An array of languages which we detect for the given text The most likely language list first.
      x-google-discovery-id: DetectionsResource
      items:
        properties:
          confidence:
            description: The confidence of the detection result of this language.
            format: float
            type: number
          isReliable:
            description: A boolean to indicate is the language detection result reliable.
            type: boolean
          language:
            description: The language we detected.
            type: string
        type: object
      type: array
    GetSupportedLanguagesRequest:
      description: The request message for discovering supported languages.
      x-google-discovery-id: GetSupportedLanguagesRequest
      properties:
        target:
          description: 'The language to use to return localized, human readable names of supported

            languages.'
          type: string
      type: object
    LanguagesListResponse:
      x-google-discovery-id: LanguagesListResponse
      properties:
        languages:
          description: List of source/target languages supported by the translation API. If target parameter is unspecified, the list is sorted by the ASCII code point order of the language code. If target parameter is specified, the list is sorted by the collation order of the language name in the target language.
          items:
            $ref: '#/components/schemas/LanguagesResource'
          type: array
      type: object
    LanguagesResource:
      x-google-discovery-id: LanguagesResource
      properties:
        language:
          description: 'Supported language code, generally consisting of its ISO 639-1

            identifier. (E.g. ''en'', ''ja''). In certain cases, BCP-47 codes including

            language + region identifiers are returned (e.g. ''zh-TW'' and ''zh-CH'')'
          type: string
        name:
          description: Human readable name of the language localized to the target language.
          type: string
      type: object
    TranslateTextRequest:
      description: The main translation request message for the Cloud Translation API.
      x-google-discovery-id: TranslateTextRequest
      properties:
        format:
          description: 'The format of the source text, in either HTML (default) or plain-text. A

            value of "html" indicates HTML and a value of "text" indicates plain-text.'
          type: string
        model:
          description: 'The `model` type requested for this translation. Valid values are

            listed in public documentation.'
          type: string
        q:
          description: 'The input text to translate. Repeat this parameter to perform translation

            operations on multiple text inputs.'
          items:
            type: string
          type: array
        source:
          description: 'The language of the source text, set to one of the language codes listed in

            Language Support. If the source language is not specified, the API will

            attempt to identify the source language automatically and return it within

            the response.'
          type: string
        target:
          description: 'The language to use for translation of the input text, set to one of the

            language codes listed in Language Support.'
          type: string
      type: object
    TranslationsListResponse:
      description: The main language translation response message.
      x-google-discovery-id: TranslationsListResponse
      properties:
        translations:
          description: Translations contains list of translation results of given text
          items:
            $ref: '#/components/schemas/TranslationsResource'
          type: array
      type: object
    TranslationsResource:
      x-google-discovery-id: TranslationsResource
      properties:
        detectedSourceLanguage:
          description: 'The source language of the initial request, detected automatically, if

            no source language was passed within the initial request. If the

            source language was passed, auto-detection of the language will not

            occur and this field will be empty.'
          type: string
        model:
          description: 'The `model` type used for this translation. Valid values are

            listed in public documentation. Can be different from requested `model`.

            Present only if specific model type was explicitly requested.'
          type: string
        translatedText:
          description: Text translated into the target language.
          type: string
      type: object
  parameters:
    $.xgafv:
      name: $.xgafv
      in: query
      schema:
        enum:
          - '1'
          - '2'
        x-google-enum-descriptions:
          - v1 error format
          - v2 error format
        type: string
      description: V1 error format.
    access_token:
      name: access_token
      in: query
      schema:
        type: string
      description: OAuth access token.
    alt:
      name: alt
      in: query
      schema:
        default: json
        enum:
          - json
          - media
          - proto
        x-google-enum-descriptions:
          - Responses with Content-Type of application/json
          - Media download with context-dependent Content-Type
          - Responses with Content-Type of application/x-protobuf
        type: string
      description: Data format for response.
    bearer_token:
      name: bearer_token
      in: query
      schema:
        type: string
      description: OAuth bearer token.
    callback:
      name: callback
      in: query
      schema:
        type: string
      description: JSONP
    fields:
      name: fields
      in: query
      schema:
        type: string
      description: Selector specifying which fields to include in a partial response.
    key:
      name: key
      in: query
      schema:
        type: string
      description: API key. Your API key identifies your project and provides you with API access, quota, and reports. Required unless you provide an OAuth 2.0 token.
    oauth_token:
      name: oauth_token
      in: query
      schema:
        type: string
      description: OAuth 2.0 token for the current user.
    pp:
      name: pp
      in: query
      schema:
        default: true
        type: boolean
      description: Pretty-print response.
    prettyPrint:
      name: prettyPrint
      in: query
      schema:
        default: true
        type: boolean
      description: Returns response with indentations and line breaks.
    quotaUser:
      name: quotaUser
      in: query
      schema:
        type: string
      description: Available to use for quota purposes for server-side applications. Can be any arbitrary string assigned to a user, but should not exceed 40 characters. Overrides userIp if both are provided.
    uploadType:
      name: uploadType
      in: query
      schema:
        type: string
      description: Legacy upload protocol for media (e.g. "media", "multipart").
    upload_protocol:
      name: upload_protocol
      in: query
      schema:
        type: string
      description: Upload protocol for media (e.g. "raw", "multipart").
  securitySchemes:
    Oauth2:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
          scopes:
            https://www.googleapis.com/auth/cloud-platform: View and manage your data across Google Cloud Platform services
            https://www.googleapis.com/auth/cloud-translation: Translate text from one language to another using Google Translate
    Oauth2c:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          scopes:
            https://www.googleapis.com/auth/cloud-platform: View and manage your data across Google Cloud Platform services
            https://www.googleapis.com/auth/cloud-translation: Translate text from one language to another using Google Translate
