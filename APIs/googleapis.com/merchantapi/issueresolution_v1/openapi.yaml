dialog. * `tooltip-icon` - marks a section of the text within a `tooltip`, that can be replaced with a tooltip icon, for example ''?'' or ''i''. By default, this section contains a `br` tag, that is separating the main text and the tooltip text when the style is not used. * `tooltip-style-question` - the tooltip shows helpful information, can use the ''?'' as an icon. * `tooltip-style-info` - the tooltip adds additional information fitting to the context, can use the ''i'' as an icon.'
