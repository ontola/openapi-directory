  /v1/photoSequences:
    get:
      operationId: streetviewpublish.photoSequences.list
      description: Lists all the PhotoSequences that belong to the user, in descending CreatePhotoSequence timestamp order.
      parameters:
        - name: filter
          in: query
          schema:
            type: string
          description: 'Optional. The filter expression. For example: `imagery_type=SPHERICAL`. The filters supported are: `imagery_type`, `processing_state`, `min_latitude`, `max_latitude`, `min_longitude`, `max_longitude`, `filename_query`, `min_capture_time_seconds`, `max_capture_time_seconds. See https://google.aip.dev/160 for more information. Filename queries should sent as a Phrase in order to support multiple words and special characters by adding escaped quotes. Ex: filename_query="example of a phrase.mp4"'
        - name: pageSize
          in: query
          schema:
            format: int32
            type: integer
          description: Optional. The maximum number of photo sequences to return. `pageSize` must be non-negative. If `pageSize` is zero or is not provided, the default page size of 100 is used. The number of photo sequences returned in the response may be less than `pageSize` if the number of matches is less than `pageSize`. This is currently unimplemented but is in process.
        - name: pageToken
          in: query
          schema:
            type: string
          description: Optional. The nextPageToken value returned from a previous ListPhotoSequences request, if any.
      tags:
