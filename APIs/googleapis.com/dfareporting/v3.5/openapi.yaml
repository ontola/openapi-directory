paths:
  /userprofiles/{userprofilesId}/creativeAssets/{creativeAssetsId}/creativeAssets:
    post:
      operationId: dfareporting.media.upload
      description: Inserts a new creative asset.
      parameters:
        - name: userprofilesId
          in: path
          required: true
          description: Component of the original `profileId` resource name. User profile ID associated with this request.
          schema:
            type: string
        - name: creativeAssetsId
          in: path
          required: true
          description: Component of the original `advertiserId` resource name. Advertiser ID of this creative. This is a required field.
          schema:
            type: string
      tags:
        - media
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/dfatrafficking
        - Oauth2c:
            - https://www.googleapis.com/auth/dfatrafficking
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreativeAssetMetadata'
      responses:
        2XX:
          description: Successful response; Discovery does not specify an HTTP status code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreativeAssetMetadata'
      x-google-discovery:
        path: userprofiles/{+profileId}/creativeAssets/{+advertiserId}/creativeAssets
        flatPath: userprofiles/{userprofilesId}/creativeAssets/{creativeAssetsId}/creativeAssets
        resourceNameBindings:
          userprofilesId: profileId
          creativeAssetsId: advertiserId
        resourceNameParameters:
          advertiserId:
            description: Advertiser ID of this creative. This is a required field.
            format: int64
            location: path
            pattern: ^[^/]+$
            required: true
            type: string
          profileId:
            description: User profile ID associated with this request.
            format: int64
            location: path
            pattern: ^[^/]+$
            required: true
            type: string
        mediaUpload:
          accept:
            - '*/*'
          maxSize: '1073741824'
          protocols:
            simple:
              multipart: true
              path: /upload/dfareporting/v3.5/userprofiles/{+profileId}/creativeAssets/{+advertiserId}/creativeAssets
        supportsMediaUpload: true
        parameterOrder:
          - profileId
          - advertiserId
    parameters:
      - $ref: '#/components/parameters/$.xgafv'
      - $ref: '#/components/parameters/access_token'
      - $ref: '#/components/parameters/alt'
      - $ref: '#/components/parameters/callback'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/key'
