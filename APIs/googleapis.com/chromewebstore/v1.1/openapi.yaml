paths:
  /chromewebstore/v1.1/items/{itemId}:
    get:
      operationId: chromewebstore.items.get
      description: Gets your own Chrome Web Store item.
      parameters:
        - name: itemId
          in: path
          schema:
            type: string
          description: Unique identifier representing the Chrome App, Chrome Extension, or the Chrome Theme.
          required: true
        - name: projection
          in: query
          schema:
            enum:
              - DRAFT
              - PUBLISHED
            x-google-enum-descriptions:
              - Return information extracted from the current draft.
              - Return information extracted from the published item draft.
            type: string
          description: Determines which subset of the item information to return.
      tags:
        - items
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/chromewebstore
        - Oauth2c:
            - https://www.googleapis.com/auth/chromewebstore
        - Oauth2:
            - https://www.googleapis.com/auth/chromewebstore.readonly
        - Oauth2c:
            - https://www.googleapis.com/auth/chromewebstore.readonly
      responses:
        2XX:
          description: Successful response; Discovery does not specify an HTTP status code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
      x-google-discovery:
        path: chromewebstore/v1.1/items/{itemId}
        flatPath: chromewebstore/v1.1/items/{itemId}
        parameterOrder:
          - itemId
    put:
      operationId: chromewebstore.items.update
      description: Updates an existing item.
      parameters:
        - name: itemId
          in: path
          schema:
            type: string
          description: The ID of the item to upload.
          required: true
      tags:
        - items
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/chromewebstore
        - Oauth2c:
            - https://www.googleapis.com/auth/chromewebstore
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Item'
      responses:
        2XX:
          description: Successful response; Discovery does not specify an HTTP status code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
      x-google-discovery:
        path: chromewebstore/v1.1/items/{itemId}
        flatPath: chromewebstore/v1.1/items/{itemId}
        mediaUpload:
          accept:
            - '*/*'
