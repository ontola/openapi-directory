components:
  schemas:
    AISkillAnalysisNote:
      description: AISkillAnalysisNote provides the metadata of an AI-based skill analysis.
      x-google-discovery-id: AISkillAnalysisNote
      properties: {}
      type: object
    AISkillAnalysisOccurrence:
      description: AISkillAnalysisOccurrence provides the results of an AI-based skill analysis.
      x-google-discovery-id: AISkillAnalysisOccurrence
      properties:
        findings:
          description: Findings produced by the analysis.
          items:
            $ref: '#/components/schemas/Finding'
          type: array
        maxSeverity:
          description: Maximum severity found among findings.
          enum:
            - SEVERITY_UNSPECIFIED
            - CRITICAL
            - HIGH
          x-google-enum-descriptions:
            - Unspecified severity.
            - Critical severity.
            - High severity.
          type: string
        perScannerVerdict:
          description: Per scanner verdict.
          allOf:
            - $ref: '#/components/schemas/PerScannerVerdict'
        skillName:
          description: Name of the skill that produced this analysis.
          type: string
      type: object
    AliasContext:
      description: An alias to a repo revision.
      x-google-discovery-id: AliasContext
      properties:
        kind:
          description: The alias kind.
          enum:
            - KIND_UNSPECIFIED
            - FIXED
            - MOVABLE
            - OTHER
          x-google-enum-descriptions:
            - Unknown.
            - Git tag.
            - Git branch.
            - Used to specify non-standard aliases. For example, if a Git repo has a ref named "refs/foo/bar".
          type: string
        name:
          description: The alias name.
          type: string
      type: object
    AnalysisCompleted:
      description: Indicates which analysis completed successfully. Multiple types of analysis can be performed on a single resource.
      x-google-discovery-id: AnalysisCompleted
      properties:
        analysisType:
          items:
            type: string
          type: array
      type: object
    Artifact:
      description: Artifact describes a build product.
      x-google-discovery-id: Artifact
      properties:
        checksum:
          description: Hash or checksum value of a binary, or Docker Registry 2.0 digest of a container.
          type: string
        id:
          description: Artifact ID, if any; for container images, this will be a URL by digest like `gcr.io/projectID/imagename@sha256:123456`.
          type: string
        names:
          description: Related artifact names. This may be the path to a binary or jar file, or in the case of a container build, the name used to push the container image to Google Container Registry, as presented to `docker push`. Note that a single Artifact ID can have multiple names, for example if two tags are applied to one image.
          items:
            type: string
          type: array
      type: object
    ArtifactHashes:
      description: Defines a hash object for use in Materials and Products.
      x-google-discovery-id: ArtifactHashes
      properties:
        sha256:
          type: string
      type: object
    ArtifactRule:
      description: Defines an object to declare an in-toto artifact rule
      x-google-discovery-id: ArtifactRule
      properties:
        artifactRule:
          items:
            type: string
          type: array
      type: object
