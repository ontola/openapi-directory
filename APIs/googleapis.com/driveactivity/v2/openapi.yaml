servers:
  - url: https://driveactivity.googleapis.com
paths:
  /v2/activity:query:
    post:
      operationId: driveactivity.activity.query
      description: Query past activity in Google Drive.
      tags:
        - activity
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/drive.activity
        - Oauth2c:
            - https://www.googleapis.com/auth/drive.activity
        - Oauth2:
            - https://www.googleapis.com/auth/drive.activity.readonly
        - Oauth2c:
            - https://www.googleapis.com/auth/drive.activity.readonly
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryDriveActivityRequest'
      responses:
        2XX:
          description: Successful response; Discovery does not specify an HTTP status code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryDriveActivityResponse'
      x-google-discovery:
        path: v2/activity:query
        flatPath: v2/activity:query
        parameterOrder: []
    parameters:
      - $ref: '#/components/parameters/$.xgafv'
      - $ref: '#/components/parameters/access_token'
      - $ref: '#/components/parameters/alt'
      - $ref: '#/components/parameters/callback'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/key'
      - $ref: '#/components/parameters/oauth_token'
      - $ref: '#/components/parameters/prettyPrint'
      - $ref: '#/components/parameters/quotaUser'
      - $ref: '#/components/parameters/uploadType'
      - $ref: '#/components/parameters/upload_protocol'
components:
  schemas:
    Action:
      description: Information about the action.
      x-google-discovery-id: Action
      properties:
        actor:
