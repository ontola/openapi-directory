components:
  schemas:
    Amount:
      description: Describes the amount unit including the currency code.
      x-google-discovery-id: Amount
      properties:
        amountMicros:
          description: Required. Amount in micros (1_000_000 micros = 1 currency unit)
          format: int64
          type: string
        currencyCode:
          description: Required. Currency codes in accordance with [ISO-4217 Currency Codes] (https://en.wikipedia.org/wiki/ISO_4217). For example, USD.
          type: string
      type: object
    CancelSubscriptionRequest:
      description: Request to cancel a subscription.
      x-google-discovery-id: CancelSubscriptionRequest
      properties:
        cancelImmediately:
          description: Optional. If true, Google will cancel the subscription immediately, and may or may not (based on the contract) issue a prorated refund for the remainder of the billing cycle. Otherwise, Google defers the cancellation at renewal_time, and will not issue a refund. - YouTube subscriptions must use this option currently. However, the user will still have access to the subscription until the end of the billing cycle.
          type: boolean
        cancellationReason:
          description: Specifies the reason for the cancellation.
          enum:
            - CANCELLATION_REASON_UNSPECIFIED
            - CANCELLATION_REASON_FRAUD
            - CANCELLATION_REASON_REMORSE
            - CANCELLATION_REASON_ACCIDENTAL_PURCHASE
            - CANCELLATION_REASON_PAST_DUE
            - CANCELLATION_REASON_ACCOUNT_CLOSED
            - CANCELLATION_REASON_UPGRADE_DOWNGRADE
            - CANCELLATION_REASON_USER_DELINQUENCY
            - CANCELLATION_REASON_SYSTEM_ERROR
            - CANCELLATION_REASON_SYSTEM_CANCEL
            - CANCELLATION_REASON_BILLING_SYSTEM_SWITCH
            - CANCELLATION_REASON_OTHER
          x-google-enum-descriptions:
            - Reason is unspecified. Should not be used.
            - Fraudulent transaction.
            - Buyer's remorse.
            - Accidental purchase.
            - Payment is past due.
            - Used for notification only, do not use in Cancel API. User account closed.
            - Used for notification only, do not use in Cancel API. Cancellation due to upgrade or downgrade.
            - Cancellation due to user delinquency
            - Used for notification only, do not use in Cancel API. Cancellation due to an unrecoverable system error.
            - Used for notification only, do not use in Cancel API. The subscription is cancelled by Google automatically since it is no longer valid.
            - Cancellation due to a billing system switch.
            - Other reason.
          type: string
      type: object
    CancelSubscriptionResponse:
      description: Response that contains the cancelled subscription resource.
      x-google-discovery-id: CancelSubscriptionResponse
      properties:
        subscription:
          description: The cancelled subscription resource.
          allOf:
            - $ref: '#/components/schemas/Subscription'
      type: object
    CreateSubscriptionIntent:
      description: Intent message for creating a Subscription resource.
      x-google-discovery-id: CreateSubscriptionIntent
      properties:
        cycleOptions:
          description: Optional. The cycle options for the subscription.
          allOf:
            - $ref: '#/components/schemas/CycleOptions'
        parent:
          deprecated: true
          description: 'Optional. Deprecated: Use the `parent` field in `GenerateUserSessionRequest` instead. The parent resource name, which is the identifier of the partner.'
          type: string
        subscription:
          description: Required. The Subscription to be created.
          allOf:
            - $ref: '#/components/schemas/Subscription'
        subscriptionId:
          description: Required. Identifies the subscription resource on the Partner side. The value is restricted to 63 ASCII characters at the maximum. If a subscription was previously created with the same subscription_id, we will directly return that one.
          type: string
      type: object
    CycleOptions:
      description: The cycle options when starting and resuming a subscription.
      x-google-discovery-id: CycleOptions
      properties:
        initialCycleDuration:
          description: 'Optional. The duration of the initial cycle. Only `DAY` is supported. If set, Google will start the subscription with this initial cycle duration starting at the request time (see available methods below). A prorated charge will be applied. This option is available to the following methods: - partners.subscriptions.provision - partners.subscriptions.resume - partners.userSessions.generate '
          allOf:
            - $ref: '#/components/schemas/Duration'
      type: object
    Duration:
      description: Describes the length of a period of a time.
      x-google-discovery-id: Duration
      properties:
        count:
          description: number of duration units to be included.
          format: int32
          type: integer
        unit:
          description: The unit used for the duration
          enum:
            - UNIT_UNSPECIFIED
            - MONTH
            - DAY
            - HOUR
          x-google-enum-descriptions:
            - Default value, reserved as an invalid or an unexpected value.
            - Unit of a calendar month.
            - Unit of a day.
            - Unit of an hour. It is used for testing.
          type: string
      type: object
    EntitleSubscriptionIntent:
      description: Intent for entitling the previously provisioned subscription to an end user.
      x-google-discovery-id: EntitleSubscriptionIntent
      properties:
        name:
          description: Required. The name of the subscription resource that is entitled to the current end user. It is in the format of "partners/{partner_id}/subscriptions/{subscriptionId}".
          type: string
      type: object
    EntitleSubscriptionRequest:
      description: Partner request for entitling the previously provisioned subscription to an end user. The end user identity is inferred from the request OAuth context.
      x-google-discovery-id: EntitleSubscriptionRequest
      properties:
        lineItemEntitlementDetails:
          deprecated: true
          description: 'Optional. Deprecated: This field is no longer supported. All line items are entitled automatically. Optional. The line items to be entitled. If unspecified, all line items will be entitled.'
          items:
            $ref: '#/components/schemas/EntitleSubscriptionRequestLineItemEntitlementDetails'
          type: array
      type: object
    EntitleSubscriptionRequestLineItemEntitlementDetails:
      description: The details of the line item to be entitled.
      x-google-discovery-id: EntitleSubscriptionRequestLineItemEntitlementDetails
      properties:
        lineItemIndex:
          description: Required. The index of the line item to be entitled.
          format: int32
          type: integer
        products:
          description: Optional. Only applicable if the line item corresponds to a hard bundle. Product resource names that identify the bundle elements to be entitled in the line item. If unspecified, all bundle elements will be entitled. The format is 'partners/{partner_id}/products/{product_id}'.
          items:
            type: string
          type: array
      type: object
    EntitleSubscriptionResponse:
      description: Response that contains the entitled subscription resource.
      x-google-discovery-id: EntitleSubscriptionResponse
      properties:
        subscription:
          description: The subscription that has user linked to it.
          allOf:
            - $ref: '#/components/schemas/Subscription'
      type: object
    ExtendSubscriptionRequest:
      description: Request message for extending a Subscription resource. A new recurrence will be made based on the subscription schedule defined by the original product.
      x-google-discovery-id: ExtendSubscriptionRequest
      properties:
        extension:
          description: Required. Specifies details of the extension. Currently, the duration of the extension must be exactly one billing cycle of the original subscription.
          allOf:
            - $ref: '#/components/schemas/Extension'
        requestId:
          description: Required. Restricted to 36 ASCII characters. A random UUID is recommended. The idempotency key for the request. The ID generation logic is controlled by the partner. request_id should be the same as on retries of the same request. A different request_id must be used for a extension of a different cycle.
          type: string
      type: object
    ExtendSubscriptionResponse:
      description: Response that contains the timestamps after the extension.
      x-google-discovery-id: ExtendSubscriptionResponse
      properties:
        cycleEndTime:
          description: The time at which the subscription is expected to be extended, in ISO 8061 format. UTC timezone. Example, "cycleEndTime":"2019-08-31T17:28:54.564Z"
          format: google-datetime
          type: string
        freeTrialEndTime:
          description: End of the free trial period, in ISO 8061 format. UTC timezone. Example, "freeTrialEndTime":"2019-08-31T17:28:54.564Z" This time will be set the same as initial subscription creation time if no free trial period is offered to the partner.
          format: google-datetime
          type: string
        renewalTime:
          description: 'Output only. The time at which the subscription is expected to be renewed by Google - a new charge will be incurred and the service entitlement will be renewed. A non-immediate cancellation will take place at this time too, before which, the service entitlement for the end user will remain valid. UTC timezone in ISO 8061 format. For example: "2019-08-31T17:28:54.564Z"'
          format: google-datetime
          readOnly: true
          type: string
      type: object
    Extension:
      description: Describes the details of an extension request.
      x-google-discovery-id: Extension
      properties:
        duration:
          description: Required. Specifies the period of access the subscription should grant.
          allOf:
            - $ref: '#/components/schemas/Duration'
        partnerUserToken:
          description: Required. Identifier of the end-user in partner’s system.
          type: string
      type: object
    FindEligiblePromotionsRequest:
      description: Request to find eligible promotions for the current user.
      x-google-discovery-id: FindEligiblePromotionsRequest
      properties:
        filter:
          description: 'Optional. Specifies the filters for the promotion results. The syntax is defined in https://google.aip.dev/160 with the following caveats: 1. Only the following features are supported: - Logical operator `AND` - Comparison operator `=` (no wildcards `*`) - Traversal operator `.` - Has operator `:` (no wildcards `*`) 2. Only the following fields are supported: - `applicableProducts` - `regionCodes` - `youtubePayload.partnerEligibilityId` - `youtubePayload.postalCode` 3. Unless explicitly mentioned above, other features are not supported. Example: `applicableProducts:partners/partner1/products/product1 AND regionCodes:US AND youtubePayload.postalCode=94043 AND youtubePayload.partnerEligibilityId=eligibility-id`'
          type: string
        pageSize:
          description: Optional. The maximum number of promotions to return. The service may return fewer than this value. If unspecified, at most 50 promotions will be returned. The maximum value is 1000; values above 1000 will be coerced to 1000.
          format: int32
          type: integer
        pageToken:
          description: Optional. A page token, received from a previous `FindEligiblePromotions` call. Provide this to retrieve the subsequent page. When paginating, all other parameters provided to `FindEligiblePromotions` must match the call that provided the page token.
          type: string
      type: object
    FindEligiblePromotionsResponse:
      description: Response containing the found promotions for the current user.
      x-google-discovery-id: FindEligiblePromotionsResponse
      properties:
        nextPageToken:
          description: A token, which can be sent as `page_token` to retrieve the next page. If this field is empty, there are no subsequent pages.
          type: string
        promotions:
          description: The promotions for the current user.
          items:
            $ref: '#/components/schemas/Promotion'
          type: array
      type: object
    FiniteBillingCycleDetails:
      description: Details for a subscription line item with finite billing cycles.
      x-google-discovery-id: FiniteBillingCycleDetails
      properties:
        billingCycleCountLimit:
          description: The number of a subscription line item billing cycles after which billing will stop automatically.
          format: int64
          type: string
      type: object
    GenerateUserSessionRequest:
