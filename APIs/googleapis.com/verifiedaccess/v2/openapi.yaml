            - https://www.googleapis.com/auth/verifiedaccess
        - Oauth2c:
            - https://www.googleapis.com/auth/verifiedaccess
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empty'
      responses:
        2XX:
          description: Successful response; Discovery does not specify an HTTP status code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
      x-google-discovery:
        path: v2/challenge:generate
        flatPath: v2/challenge:generate
        parameterOrder: []
    parameters:
