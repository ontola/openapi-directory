            type: string
          readOnly: true
          type: array
        deviceEnrollmentDomain:
          description: Output only. Enrollment domain of the customer which is currently managing the device.
          readOnly: true
          type: string
        deviceManufacturer:
          description: Output only. The name of the device's manufacturer.
          readOnly: true
          type: string
        deviceModel:
