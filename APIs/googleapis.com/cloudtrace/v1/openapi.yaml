servers:
  - url: https://cloudtrace.googleapis.com
paths:
  /v1/projects/{projectId}/traces:
    patch:
      operationId: cloudtrace.projects.patchTraces
      description: Sends trace spans to Cloud Trace. Spans cannot be updated. If the trace ID and span ID already exist, an additional copy of the span will be stored.
      parameters:
        - name: projectId
          in: path
          schema:
            type: string
          description: Required. ID of the Cloud project where the trace data is stored.
          required: true
      tags:
        - projects
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/cloud-platform
        - Oauth2c:
            - https://www.googleapis.com/auth/cloud-platform
        - Oauth2:
            - https://www.googleapis.com/auth/trace.append
        - Oauth2c:
            - https://www.googleapis.com/auth/trace.append
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Traces'
      responses:
        2XX:
          description: Successful response; Discovery does not specify an HTTP status code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
      x-google-discovery:
        path: v1/projects/{projectId}/traces
        flatPath: v1/projects/{projectId}/traces
        parameterOrder:
          - projectId
    get:
      operationId: cloudtrace.projects.traces.list
      description: Returns a list of traces that match the specified filter conditions.
      parameters:
        - name: projectId
          in: path
          schema:
            type: string
          description: Required. ID of the Cloud project where the trace data is stored.
          required: true
        - name: endTime
          in: query
          schema:
            format: google-datetime
            type: string
          description: Required. End of the time interval (inclusive) during which the trace data was collected from the application.
        - name: filter
          in: query
          schema:
            type: string
          description: Optional. A filter against properties of the trace. See [filter syntax documentation](https://cloud.google.com/trace/docs/trace-filters) for details.
        - name: orderBy
          in: query
          schema:
            type: string
          description: 'Optional. Field used to sort the returned traces. Can be one of the following: * `trace_id` * `name` (`name` field of root span in the trace) * `duration` (difference between `end_time` and `start_time` fields of the root span) * `start` (`start_time` field of the root span) Descending order can be specified by appending `desc` to the sort field (for example, `name desc`). Only one sort field is permitted.'
        - name: pageSize
          in: query
          schema:
            format: int32
            type: integer
          description: Optional. Maximum number of traces to return. If not specified or <= 0, the implementation selects a reasonable value. The implementation may return fewer traces than the requested page size.
        - name: pageToken
          in: query
          schema:
            type: string
          description: Optional. Token identifying the page of results to return. If provided, use the value of the `next_page_token` field from a previous request.
        - name: startTime
          in: query
          schema:
            format: google-datetime
            type: string
          description: Required. Start of the time interval (inclusive) during which the trace data was collected from the application.
        - name: view
          in: query
          schema:
            enum:
              - VIEW_TYPE_UNSPECIFIED
              - MINIMAL
              - ROOTSPAN
              - COMPLETE
            x-google-enum-descriptions:
              - Default is `MINIMAL` if unspecified.
              - Minimal view of the trace record that contains only the project and trace IDs.
              - Root span view of the trace record that returns the root spans along with the minimal trace data.
              - Complete view of the trace record that contains the actual trace data. This is equivalent to calling the REST `get` or RPC `GetTrace` method using the ID of each listed trace.
            type: string
          description: Optional. Type of data returned for traces in the list. Default is `MINIMAL`.
      tags:
        - projects
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/cloud-platform
        - Oauth2c:
            - https://www.googleapis.com/auth/cloud-platform
        - Oauth2:
            - https://www.googleapis.com/auth/trace.readonly
        - Oauth2c:
            - https://www.googleapis.com/auth/trace.readonly
      responses:
        2XX:
          description: Successful response; Discovery does not specify an HTTP status code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTracesResponse'
      x-google-discovery:
        path: v1/projects/{projectId}/traces
        flatPath: v1/projects/{projectId}/traces
        parameterOrder:
          - projectId
    parameters:
      - $ref: '#/components/parameters/$.xgafv'
      - $ref: '#/components/parameters/access_token'
      - $ref: '#/components/parameters/alt'
      - $ref: '#/components/parameters/callback'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/key'
      - $ref: '#/components/parameters/oauth_token'
      - $ref: '#/components/parameters/prettyPrint'
      - $ref: '#/components/parameters/quotaUser'
      - $ref: '#/components/parameters/uploadType'
      - $ref: '#/components/parameters/upload_protocol'
  /v1/projects/{projectId}/traces/{traceId}:
    get:
      operationId: cloudtrace.projects.traces.get
      description: Gets a single trace by its ID.
      parameters:
        - name: projectId
          in: path
          schema:
            type: string
          description: Required. ID of the Cloud project where the trace data is stored.
          required: true
        - name: traceId
          in: path
          schema:
            type: string
          description: Required. ID of the trace to return.
          required: true
      tags:
        - projects
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/cloud-platform
        - Oauth2c:
            - https://www.googleapis.com/auth/cloud-platform
        - Oauth2:
            - https://www.googleapis.com/auth/trace.readonly
        - Oauth2c:
            - https://www.googleapis.com/auth/trace.readonly
      responses:
        2XX:
          description: Successful response; Discovery does not specify an HTTP status code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trace'
      x-google-discovery:
        path: v1/projects/{projectId}/traces/{traceId}
        flatPath: v1/projects/{projectId}/traces/{traceId}
        parameterOrder:
          - projectId
          - traceId
    parameters:
      - $ref: '#/components/parameters/$.xgafv'
      - $ref: '#/components/parameters/access_token'
      - $ref: '#/components/parameters/alt'
      - $ref: '#/components/parameters/callback'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/key'
      - $ref: '#/components/parameters/oauth_token'
      - $ref: '#/components/parameters/prettyPrint'
      - $ref: '#/components/parameters/quotaUser'
      - $ref: '#/components/parameters/uploadType'
      - $ref: '#/components/parameters/upload_protocol'
components:
  schemas:
    Empty:
      description: 'A generic empty message that you can re-use to avoid defining duplicated empty messages in your APIs. A typical example is to use it as the request or the response type of an API method. For instance: service Foo { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }'
      x-google-discovery-id: Empty
      properties: {}
      type: object
    ListTracesResponse:
      description: The response message for the `ListTraces` method.
      x-google-discovery-id: ListTracesResponse
      properties:
        nextPageToken:
          description: If defined, indicates that there are more traces that match the request and that this value should be passed to the next request to continue retrieving additional traces.
          type: string
        traces:
          description: List of trace records as specified by the view parameter.
          items:
            $ref: '#/components/schemas/Trace'
          type: array
      type: object
    Trace:
      description: A trace describes how long it takes for an application to perform an operation. It consists of a set of spans, each of which represent a single timed event within the operation.
      x-google-discovery-id: Trace
      properties:
        projectId:
          description: Required. Project ID of the Cloud project where the trace data is stored.
          type: string
        spans:
          description: Collection of spans in the trace.
          items:
            $ref: '#/components/schemas/TraceSpan'
          type: array
        traceId:
          description: Required. Globally unique identifier for the trace. This identifier is a 128-bit numeric value formatted as a 32-byte hex string. For example, `382d4f4c6b7bb2f4a972559d9085001d`. The numeric value should not be zero.
          type: string
      type: object
    TraceSpan:
      description: A span represents a single timed event within a trace. Spans can be nested and form a trace tree. Often, a trace contains a root span that describes the end-to-end latency of an operation and, optionally, one or more subspans for its suboperations. Spans do not need to be contiguous. There may be gaps between spans in a trace.
      x-google-discovery-id: TraceSpan
      properties:
        endTime:
          description: Required. End time of the span in seconds and nanoseconds from the UNIX epoch.
          format: google-datetime
          type: string
        kind:
          description: Optional. Distinguishes between spans generated in a particular context. For example, two spans with the same name may be distinguished using `RPC_CLIENT` and `RPC_SERVER` to identify queueing latency associated with the span.
          enum:
            - SPAN_KIND_UNSPECIFIED
            - RPC_SERVER
            - RPC_CLIENT
          x-google-enum-descriptions:
            - Unspecified.
            - Indicates that the span covers server-side handling of an RPC or other remote network request.
            - Indicates that the span covers the client-side wrapper around an RPC or other remote request.
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. Collection of labels associated with the span. Label keys must be less than 128 bytes. Label values must be less than 16 KiB. Some keys might have predefined meaning, and you can also create your own. For more information, see [Cloud Trace labels](https://cloud.google.com/trace/docs/trace-labels).
          type: object
        name:
          description: Required. Name of the span. Must be less than 128 bytes. The span name is sanitized and displayed in the Trace tool in the Google Cloud Platform Console. The name may be a method name or some other per-call site name. For the same executable and the same call point, a best practice is to use a consistent name, which makes it easier to correlate cross-trace spans.
          type: string
        parentSpanId:
          description: Optional. ID of the parent span, if any.
          format: uint64
          type: string
        spanId:
          description: Required. Identifier for the span. Must be a 64-bit integer other than 0 and unique within a trace. For example, `2205310701640571284`.
          format: uint64
          type: string
        startTime:
          description: Required. Start time of the span in seconds and nanoseconds from the UNIX epoch.
          format: google-datetime
          type: string
      type: object
    Traces:
      description: List of new or updated traces.
      x-google-discovery-id: Traces
      properties:
        traces:
          description: List of traces.
          items:
            $ref: '#/components/schemas/Trace'
          type: array
      type: object
