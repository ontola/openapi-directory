components:
  schemas:
    AnchoredReviewComment:
      description: A structured review comment anchored to a specific location in the document.
      x-google-discovery-id: AnchoredReviewComment
      properties:
        bodyMarkdown:
          description: Output only. Detailed markdown explanation of the review comment.
          readOnly: true
          type: string
        citationReport:
          description: Output only. Optional structured citation verification report when this comment corresponds to a bibliography reference.
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/CitationReport'
        commentId:
          description: Output only. Unique identifier for the comment within the review.
          readOnly: true
          type: string
        location:
          description: Output only. Polymorphic location in the document where this comment is anchored.
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/DocumentLocation'
        severity:
          description: Output only. Severity classification of the comment.
          enum:
            - SEVERITY_UNSPECIFIED
            - CRITICAL
            - MAJOR
            - MINOR
            - SUGGESTION
          x-google-enum-descriptions:
            - Default unspecified severity.
            - Critical flaw in proofs, methodology, or empirical claims.
            - Major issue affecting key conclusions or experimental validity.
            - Minor issue, presentation clarity, or missing detail.
            - Constructive suggestion or optional improvement.
          readOnly: true
          type: string
        suggestedEdit:
          description: Output only. Optional suggested replacement text or edit for the anchored span.
          readOnly: true
          type: string
        summary:
          description: Output only. Short one-line summary of the review comment.
          readOnly: true
          type: string
      type: object
    Author:
      description: Author name components.
      x-google-discovery-id: Author
