          in: query
          schema:
            type: boolean
          description: Optional. If set to `true`, and the document is not found, the request succeeds.
        - name: force
          in: query
          schema:
            type: boolean
          description: Optional. If set to `true`, any child resources (e.g. review resources) are also deleted. If `false` and the document has existing reviews, the request fails with `FAILED_PRECONDITION`.
      tags:
        - documents
