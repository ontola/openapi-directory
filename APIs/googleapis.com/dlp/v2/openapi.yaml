    GooglePrivacyDlpV2AdjustByMatchingInfoTypes:
      description: AdjustmentRule condition for matching infoTypes.
      x-google-discovery-id: GooglePrivacyDlpV2AdjustByMatchingInfoTypes
      properties:
        infoTypes:
          description: Sensitive Data Protection adjusts the likelihood of a finding if that finding also matches one of these infoTypes. For example, you can create a rule to adjust the likelihood of a `PHONE_NUMBER` finding if the string is found within a document that is classified as `DOCUMENT_TYPE/HR/RESUME`. To configure this, set `PHONE_NUMBER` in `InspectionRuleSet.info_types`. Add an `adjustment_rule` with an `adjust_by_matching_info_types.info_types` that contains `DOCUMENT_TYPE/HR/RESUME`. In this case, the likelihood of the `PHONE_NUMBER` finding is adjusted, but the likelihood of the `DOCUMENT_TYPE/HR/RESUME` finding is not.
          items:
            $ref: '#/components/schemas/GooglePrivacyDlpV2InfoType'
          type: array
        matchingType:
          description: 'How the adjustment rule is applied. Only `MATCHING_TYPE_PARTIAL_MATCH` is supported: - Partial match: adjusts the findings of infoTypes specified in the inspection rule when they have a nonempty intersection with a finding of an infoType specified in this adjustment rule.'
          enum:
            - MATCHING_TYPE_UNSPECIFIED
            - MATCHING_TYPE_FULL_MATCH
            - MATCHING_TYPE_PARTIAL_MATCH
            - MATCHING_TYPE_INVERSE_MATCH
            - MATCHING_TYPE_RULE_SPECIFIC
          x-google-enum-descriptions:
            - Invalid.
            - 'Full match. - Dictionary: join of Dictionary results matched the complete finding quote - Regex: all regex matches fill a finding quote from start to end - Exclude infoType: completely inside affecting infoTypes findings - Exclude by prompt: finding matches the prompt definition'
