            - $ref: '#/components/schemas/GooglePrivacyDlpV2Deidentify'
        jobNotificationEmails:
          description: Sends an email when the job completes. The email goes to IAM project owners and technical [Essential Contacts](https://docs.cloud.google.com/resource-manager/docs/managing-notification-contacts).
          allOf:
            - $ref: '#/components/schemas/GooglePrivacyDlpV2JobNotificationEmails'
        pubSub:
          description: Publish a notification to a Pub/Sub topic.
          allOf:
            - $ref: '#/components/schemas/GooglePrivacyDlpV2PublishToPubSub'
        publishFindingsToCloudDataCatalog:
          deprecated: true
          description: Deprecated because Data Catalog is being turned down. Use publish_findings_to_dataplex_catalog to publish findings to Dataplex Universal Catalog.
          allOf:
            - $ref: '#/components/schemas/GooglePrivacyDlpV2PublishFindingsToCloudDataCatalog'
        publishFindingsToDataplexCatalog:
          description: Publish findings as an aspect to Dataplex Universal Catalog.
          allOf:
            - $ref: '#/components/schemas/GooglePrivacyDlpV2PublishFindingsToDataplexCatalog'
        publishSummaryToCscc:
          description: Publish summary to Cloud Security Command Center (Alpha).
          allOf:
            - $ref: '#/components/schemas/GooglePrivacyDlpV2PublishSummaryToCscc'
        publishToStackdriver:
          description: Enable Stackdriver metric dlp.googleapis.com/finding_count.
          allOf:
            - $ref: '#/components/schemas/GooglePrivacyDlpV2PublishToStackdriver'
        saveFindings:
          description: Save resulting findings in a provided location.
          allOf:
            - $ref: '#/components/schemas/GooglePrivacyDlpV2SaveFindings'
      type: object
    GooglePrivacyDlpV2ActionDetails:
      description: The results of an Action.
      x-google-discovery-id: GooglePrivacyDlpV2ActionDetails
      properties:
        deidentifyDetails:
          description: Outcome of a de-identification action.
          allOf:
            - $ref: '#/components/schemas/GooglePrivacyDlpV2DeidentifyDataSourceDetails'
      type: object
    GooglePrivacyDlpV2ActivateJobTriggerRequest:
      description: Request message for ActivateJobTrigger.
      x-google-discovery-id: GooglePrivacyDlpV2ActivateJobTriggerRequest
