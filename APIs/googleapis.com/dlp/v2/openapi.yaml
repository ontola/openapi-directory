    GooglePrivacyDlpV2AdjustByImageFindings:
      description: AdjustmentRule condition for image findings. This rule is silently ignored if the content being inspected is not an image.
      x-google-discovery-id: GooglePrivacyDlpV2AdjustByImageFindings
      properties:
        imageContainmentType:
          description: Specifies the required spatial relationship between the bounding boxes of the target finding and the context infoType findings.
          allOf:
            - $ref: '#/components/schemas/GooglePrivacyDlpV2ImageContainmentType'
        infoTypes:
          description: A list of image-supported infoTypes—excluding [document infoTypes](https://docs.cloud.google.com/sensitive-data-protection/docs/infotypes-reference#documents)—to be used as context for the adjustment rule. Sensitive Data Protection adjusts the likelihood of an image finding if its bounding box has the specified spatial relationship (defined by `image_containment_type`) with a finding of an infoType in this list. For example, you can create a rule to adjust the likelihood of a `US_PASSPORT` finding if it is enclosed by a finding of `OBJECT_TYPE/PERSON/PASSPORT`. To configure this, set `US_PASSPORT` in `InspectionRuleSet.info_types`. Add an `adjustment_rule` with an `adjust_by_image_findings.info_types` that contains `OBJECT_TYPE/PERSON/PASSPORT` and `image_containment_type` set to `encloses`. In this case, the likelihood of the `US_PASSPORT` finding is adjusted, but the likelihood of the `OBJECT_TYPE/PERSON/PASSPORT` finding is not.
          items:
            $ref: '#/components/schemas/GooglePrivacyDlpV2InfoType'
          type: array
        minLikelihood:
          description: Required. Minimum likelihood of the `adjust_by_image_findings.info_types` finding. If the likelihood is lower than this value, Sensitive Data Protection doesn't adjust the likelihood of the `InspectionRuleSet.info_types` finding.
          enum:
            - LIKELIHOOD_UNSPECIFIED
            - VERY_UNLIKELY
            - UNLIKELY
            - POSSIBLE
            - LIKELY
            - VERY_LIKELY
          x-google-enum-descriptions:
            - Default value; same as POSSIBLE.
            - Highest chance of a false positive.
            - High chance of a false positive.
            - Some matching signals. The default value.
            - Low chance of a false positive.
            - Confidence level is high. Lowest chance of a false positive.
