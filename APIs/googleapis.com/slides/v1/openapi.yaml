      x-google-discovery-id: TableRange
      properties:
        columnSpan:
          description: The column span of the table range.
          format: int32
          type: integer
        location:
          description: The starting location of the table range.
          allOf:
            - $ref: '#/components/schemas/TableCellLocation'
