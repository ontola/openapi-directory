      url: https://raw.githubusercontent.com/googleapis/discovery-artifact-manager/1f1d01578507ceded42f7453bbef1bb0f637faee/discoveries/databasecenter.v1beta.json
      version: v1
    - format: openapi
      url: https://raw.githubusercontent.com/googleapis/discovery-artifact-manager/1f1d01578507ceded42f7453bbef1bb0f637faee/discoveries/databasecenter.v1beta.json
      version: '3.0'
  x-conversion:
