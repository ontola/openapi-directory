            - https://www.googleapis.com/auth/classroom.guardianlinks.students.readonly
        - Oauth2c:
            - https://www.googleapis.com/auth/classroom.guardianlinks.students.readonly
      responses:
        2XX:
          description: Successful response; Discovery does not specify an HTTP status code.
          content:
