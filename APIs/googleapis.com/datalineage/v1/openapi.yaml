        - Oauth2c:
            - https://www.googleapis.com/auth/datalineage.read-write
        - Oauth2:
            - https://www.googleapis.com/auth/datalineage.readonly
        - Oauth2c:
            - https://www.googleapis.com/auth/datalineage.readonly
      requestBody:
