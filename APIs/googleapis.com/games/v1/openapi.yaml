        achievementLifecycleState:
          description: Output only. The lifecycle state of the achievement.
          enum:
            - ACHIEVEMENT_LIFECYCLE_STATE_UNSPECIFIED
            - ACHIEVEMENT_LIFECYCLE_STATE_ACTIVE
            - ACHIEVEMENT_LIFECYCLE_STATE_ARCHIVED
