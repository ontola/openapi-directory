      x-google-discovery-id: SasPortalDpaMoveList
      properties:
        dpaId:
          description: The ID of the DPA.
          type: string
        frequencyRange:
          description: The frequency range that the move list affects.
          allOf:
            - $ref: '#/components/schemas/SasPortalFrequencyRange'
      type: object
