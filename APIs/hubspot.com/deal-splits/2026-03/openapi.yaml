        - percentage
      type: object
      properties:
        ownerId:
          type: integer
          description: The unique identifier of the owner receiving the deal split.
          format: int32
        percentage:
          type: number
          description: The portion of the deal assigned to the owner, expressed as a percentage. The total percentage for all splits in a deal must sum up to 1.0 (100%) and can have up to 8 decimal places.
    PublicDealSplitsBatchCreateRequest:
