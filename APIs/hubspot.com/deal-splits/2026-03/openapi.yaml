  x-hubspot-api-use-case: When two sales reps work together to close a deal, add a split to the deal to reflect that the credit and commission are being shared.
  x-hubspot-introduction: 'Use the deal splits API to split existing deals between owners when credit and/or commission are shared between them. '
  x-origin:
    - format: openapi
      url: https://api.hubspot.com/public/api/spec/v2/specs/release/75324/version/2026-03
      version: '3.0'
