  x-hubspot-api-use-case: You have a third-party service to manage organizational data for your business, and you need to confirm the business unit that a specific HubSpot user is in.
  x-hubspot-introduction: Use the business units API to retrieve information about the business unit associated with a user in your HubSpot account.
  x-origin:
    - format: openapi
      url: https://api.hubspot.com/public/api/spec/v2/specs/release/75363/version/2026-03
      version: '3.0'
  x-conversion:
    - Fetched from HubSpot's public API spec catalog (https://api.hubspot.com/public/api/spec/v1/specs), product 'Business Units', group 'Business Units', stable version 2026-03.
servers:
  - url: https://api.hubapi.com
tags:
  - name: Basic
paths:
  /business-units/public/2026-03/business-units/user/{userId}:
    get:
      tags:
        - Basic
      summary: Retrieve brands by associated user
      description: Retrieve the brands that a specific user can access.
      operationId: get-/business-units/public/2026-03/business-units/user/{userId}_getByUserID
      parameters:
        - name: userId
          in: path
          description: The unique identifier of the user whose associated business units are to be retrieved.
          required: true
          style: simple
          explode: false
          schema:
            type: string
        - name: name
          in: query
          description: A list of business unit names to filter the response by. Only business units with matching names will be included in the results.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: properties
          in: query
          description: A list of specific properties to include in the response. This allows for filtering the business unit details returned.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponsePublicBusinessUnitNoPaging'
        default:
          description: ''
          $ref: '#/components/responses/Error'
      security:
        - oauth2:
            - business_units_view.read
components:
  schemas:
    CollectionResponsePublicBusinessUnitNoPaging:
      required:
        - results
      type: object
      properties:
        results:
          type: array
          description: The collection of Business Units
          items:
            $ref: '#/components/schemas/PublicBusinessUnit'
    Error:
      required:
        - category
        - correlationId
        - message
      type: object
      properties:
        category:
          type: string
          description: The error category
        context:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Context about the error condition
          example: '{invalidPropertyName=[propertyValue], missingScopes=[scope1, scope2]}'
        correlationId:
