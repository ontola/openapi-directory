      security:
        - api-key: []
  /ecommerce/attribution/metrics:
    get:
      operationId: ecommerce_getAttributionMetricsForOneOrMoreBrevoCampaignsOrWorkflows
      summary: Get attribution metrics for one or more Brevo campaigns or workflows
      description: Retrieve aggregated ecommerce attribution metrics for one or more Brevo email campaigns, SMS campaigns, or automation workflows. You can optionally filter by a date range using `periodFrom` and `periodTo` in RFC3339 format. The response includes per-source metrics (orders count, revenue, and average basket) as well as aggregated totals across all requested sources.
      tags:
        - ecommerce
      parameters:
        - name: periodFrom
          in: query
          description: When getting metrics for a specific period, define the starting datetime in RFC3339 format
          required: false
          schema:
            type: string
            format: date-time
        - name: periodTo
          in: query
          description: When getting metrics for a specific period, define the end datetime in RFC3339 format
          required: false
          schema:
            type: string
            format: date-time
        - name: emailCampaignId[]
          in: query
          description: The email campaign ID(s) to get metrics for
          required: false
          schema:
            type: array
            items:
              type: string
        - name: smsCampaignId[]
          in: query
          description: The SMS campaign ID(s) to get metrics for
          required: false
          schema:
            type: array
            items:
              type: string
        - name: automationWorkflowEmailId[]
          in: query
          description: The automation workflow ID(s) to get email attribution metrics for
          required: false
          schema:
            type: array
            items:
              type: string
        - name: automationWorkflowSmsId[]
          in: query
          description: The automation workflow ID(s) to get SMS attribution metrics for
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ecommerce_getAttributionMetricsForOneOrMoreBrevoCampaignsOrWorkflows_Response_200'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAttributionMetricsForOneOrMoreBrevoCampaignsOrWorkflowsRequestBadRequestError'
      security:
        - api-key: []
  /ecommerce/activate:
    post:
      operationId: ecommerce_activateTheECommerceApp
      summary: Activate the eCommerce app
      description: Getting access to Brevo eCommerce.
      tags:
        - ecommerce
      responses:
        '200':
          description: eCommerce activation is in process, please wait for 5 minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ecommerce_activateTheECommerceApp_Response_200'
        '401':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateTheECommerceAppRequestUnauthorizedError'
        '404':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateTheECommerceAppRequestNotFoundError'
      security:
        - api-key: []
  /ecommerce/config/displayCurrency:
    post:
      operationId: ecommerce_setConfigDisplayCurrency
      summary: Set the ISO 4217 compliant display currency code for your Brevo account
      description: Set or update the ISO 4217 display currency code for your Brevo ecommerce account. This currency determines how monetary values are displayed in the ecommerce dashboard and reports. The provided currency code must be a valid ISO 4217 code; invalid codes result in a `422` error. Returns a `403` error if ecommerce is not activated on the account.
      tags:
        - ecommerce
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ecommerce_setConfigDisplayCurrency_Response_200'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetConfigDisplayCurrencyRequestBadRequestError'
        '401':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetConfigDisplayCurrencyRequestUnauthorizedError'
        '403':
          description: Permission denied. eCommerce is not activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
        '422':
          description: Invalid ISO 4217 currency code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
      requestBody:
        description: set ISO 4217 compliant display currency code payload
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: ISO 4217 compliant display currency code
              required:
                - code
      security:
        - api-key: []
    get:
      operationId: ecommerce_getTheIso4217CompliantDisplayCurrencyCodeForYourBrevoAccount
      summary: Get the ISO 4217 compliant display currency code for your Brevo account
      description: Retrieve the ISO 4217 display currency code currently configured for your Brevo ecommerce account. This currency is used to display monetary values across the ecommerce dashboard and reports. Returns a `403` error if ecommerce is not activated on the account.
      tags:
        - ecommerce
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ecommerce_getTheIso4217CompliantDisplayCurrencyCodeForYourBrevoAccount_Response_200'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTheIso4217CompliantDisplayCurrencyCodeForYourBrevoAccountRequestBadRequestError'
        '401':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTheIso4217CompliantDisplayCurrencyCodeForYourBrevoAccountRequestUnauthorizedError'
        '403':
          description: Permission denied. eCommerce is not activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
      security:
        - api-key: []
  /couponCollections:
    get:
      operationId: coupons_getCouponCollections
      summary: Get all your coupon collections
      description: Retrieve a paginated list of all coupon collections in your Brevo account. Results can be sorted by creation date, remaining coupons count, or expiration date, in ascending or descending order. Pagination defaults to 50 collections per page (maximum 100).
      tags:
        - coupons
      parameters:
        - name: limit
          in: query
          description: Number of documents returned per page
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 100
            default: 50
        - name: offset
          in: query
          description: Index of the first document on the page
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: sort
          in: query
          description: Sort the results by creation time in ascending/descending order
          required: false
          schema:
            $ref: '#/components/schemas/CouponCollectionsGetParametersSort'
            default: desc
        - name: sortBy
          in: query
          description: The field used to sort coupon collections
          required: false
          schema:
            $ref: '#/components/schemas/CouponCollectionsGetParametersSortBy'
            default: createdAt
      responses:
        '200':
          description: Coupon collections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getCouponCollection'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCouponCollectionsRequestBadRequestError'
        '401':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCouponCollectionsRequestUnauthorizedError'
      security:
        - api-key: []
    post:
      operationId: coupons_createCouponCollection
      summary: Create а coupon collection
      description: Create a new coupon collection with a name and a default coupon value. You can optionally set an expiration date in RFC3339 format and configure alert thresholds to receive email notifications when remaining coupons or remaining days before expiration fall below a specified number. The collection ID is auto-generated as a UUID and returned in the response.
      tags:
        - coupons
      responses:
        '201':
          description: Coupon collection created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupons_createCouponCollection_Response_201'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCouponCollectionRequestBadRequestError'
        '401':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCouponCollectionRequestUnauthorizedError'
      requestBody:
        description: Values to create a coupon collection
        content:
          application/json:
            schema:
              type: object
              properties:
                defaultCoupon:
                  type: string
                  description: Default coupons collection name
                expirationDate:
                  type: string
                  format: date-time
                  description: Specify an expiration date for the coupon collection in RFC3339 format. Use null to remove the expiration date.
                name:
                  type: string
                  description: Name of the coupons collection
                remainingCouponsAlert:
                  type: integer
                  description: Send a notification alert (email) when the remaining coupons count is equal or fall bellow this number. Use null to disable alerts.
                remainingDaysAlert:
                  type: integer
                  description: Send a notification alert (email) when the remaining days until the expiration date are equal or fall bellow this number. Use null to disable alerts.
              required:
                - defaultCoupon
                - name
      security:
        - api-key: []
  /couponCollections/{id}:
    get:
      operationId: coupons_getCouponCollection
      summary: Get a coupon collection by id
      description: Retrieve the details of a single coupon collection by its UUID. The response includes the collection name, default coupon value, total and remaining coupon counts, and creation timestamp. Returns a `404` error if no collection matches the provided ID.
      tags:
        - coupons
      parameters:
        - name: id
          in: path
          description: Id of the collection to return
          required: true
          schema:
            type: string
            format: uuidv4
      responses:
        '200':
          description: Coupon collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getCouponCollection'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCouponCollectionRequestBadRequestError'
        '401':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCouponCollectionRequestUnauthorizedError'
        '404':
          description: Coupon collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
      security:
        - api-key: []
    patch:
      operationId: coupons_updateCouponCollection
      summary: Update a coupon collection by id
      description: Update an existing coupon collection by its UUID. You can modify the default coupon value, set or remove the expiration date (pass `null` to remove), and configure or disable alert thresholds for remaining coupons or remaining days. Only the fields included in the request body are updated; omitted fields remain unchanged.
      tags:
        - coupons
      parameters:
        - name: id
          in: path
          description: Id of the collection to update
          required: true
          schema:
            type: string
            format: uuidv4
      responses:
        '200':
          description: Coupon collection updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupons_updateCouponCollection_Response_200'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCouponCollectionRequestBadRequestError'
        '401':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCouponCollectionRequestUnauthorizedError'
      requestBody:
        description: Values to update the coupon collection
        content:
          application/json:
            schema:
              type: object
              properties:
                defaultCoupon:
                  type: string
                  description: A default coupon to be used in case there are no coupons left
                expirationDate:
                  type: string
                  format: date-time
                  description: Specify an expiration date for the coupon collection in RFC3339 format. Use null to remove the expiration date.
                remainingCouponsAlert:
                  type: integer
                  description: Send a notification alert (email) when the remaining coupons count is equal or fall bellow this number. Use null to disable alerts.
                remainingDaysAlert:
                  type: integer
                  description: Send a notification alert (email) when the remaining days until the expiration date are equal or fall bellow this number. Use null to disable alerts.
      security:
        - api-key: []
  /coupons:
    post:
      operationId: coupons_createCoupons
      summary: Create coupons for a coupon collection
      description: Add coupons to an existing coupon collection. The `coupons` array must contain between 1 and 10,000 unique coupon code strings, all associated with the specified `collectionId`. Coupon creation is processed asynchronously and a `204` status is returned immediately upon acceptance. Returns a `404` error if the specified coupon collection does not exist.
      tags:
        - coupons
      responses:
        '204':
          description: Coupons creation in progress
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCouponsRequestBadRequestError'
        '401':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCouponsRequestUnauthorizedError'
        '404':
          description: Coupon collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
      requestBody:
        description: Values to create coupons
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionId:
                  type: string
                  format: uuidv4
                  description: The id of the coupon collection for which the coupons will be created
                coupons:
                  type: array
                  items:
                    type: string
              required:
                - collectionId
                - coupons
      security:
        - api-key: []
  /payments/requests:
    post:
      operationId: payments_createPaymentRequest
      summary: Create a payment request
      description: Create a new payment request for a Brevo contact. The request requires a reference (displayed on the payment page), a contact ID, and a cart with currency and amount in cents. You can optionally configure a custom success redirect URL and enable email notifications with reminders. Returns the payment request ID and its public payment URL. A `403` error is returned if Brevo Payments is not activated or the account is not validated.
      tags:
        - payments
      responses:
        '201':
          description: Payment request created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payments_createPaymentRequest_Response_201'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentRequestRequestBadRequestError'
        '401':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentRequestRequestUnauthorizedError'
        '403':
          description: Permission denied. Either you don't have access to Brevo Payments or your Brevo Payments account is not validated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
      requestBody:
        description: 'Create a payment request

          '
        content:
          application/json:
            schema:
              type: object
              properties:
                cart:
                  $ref: '#/components/schemas/cart'
                configuration:
                  $ref: '#/components/schemas/configuration'
                contactId:
                  type: integer
                  format: int64
                  description: 'Brevo ID of the contact requested to pay.

                    '
                description:
                  type: string
                  description: 'Description of payment request.

                    '
                notification:
                  $ref: '#/components/schemas/notification'
                reference:
                  type: string
                  description: 'Reference of the payment request, it will appear on the payment page.

                    '
              required:
                - cart
                - contactId
                - reference
      security:
        - api-key: []
  /payments/requests/{id}:
    get:
      operationId: payments_getPaymentRequest
      summary: Get payment request details
      description: Retrieve the details of a specific payment request by its ID. The response includes the reference, status (created, sent, reminderSent, or paid), cart details, notification configuration, contact ID, and the number of reminders sent. Returns a `404` error if no payment request matches the provided ID.
      tags:
        - payments
      parameters:
        - name: id
          in: path
          description: Id of the payment Request
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payments_getPaymentRequest_Response_200'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPaymentRequestRequestBadRequestError'
        '401':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPaymentRequestRequestUnauthorizedError'
        '403':
          description: Permission denied. Either you don't have access to Brevo Payments or your Brevo Payments account is not validated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
        '404':
          description: Payment request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
      security:
        - api-key: []
    delete:
      operationId: payments_deletePaymentRequest
      summary: Delete a payment request.
      description: Delete a payment request by its UUID. Once deleted, the payment request can no longer be accessed or paid. Returns a `404` error if no payment request matches the provided ID, and a `403` error if Brevo Payments is not activated or the account is not validated.
      tags:
        - payments
      parameters:
        - name: id
          in: path
          description: ID of the payment request.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Payment request deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '401':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletePaymentRequestRequestUnauthorizedError'
        '403':
          description: Permission denied. Either you don't have access to Brevo Payments or your Brevo Payments account is not validated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
        '404':
          description: Payment request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
      security:
        - api-key: []
tags:
  - name: ecommerce
  - name: coupons
  - name: payments
servers:
  - url: https://api.brevo.com/v3
    description: https://api.brevo.com/v3
components:
  schemas:
    OrderBilling:
      type: object
      properties:
        address:
          type: string
          description: Full billing address.
        city:
          type: string
          description: Exact city of the address.
        country:
          type: string
          description: Billing country name.
        countryCode:
          type: string
          description: Billing country 2-letter ISO code.
        paymentMethod:
          type: string
          description: How the visitor will pay for the item(s), e.g. paypal, check, etc.
        phone:
          type: string
          description: Billing phone number.
        postCode:
          type: string
          description: Postcode for delivery and billing.
        region:
          type: string
          description: Exact region (state/province) for delivery and billing.
      description: Billing details of an order.
      title: OrderBilling
    OrderIdentifiers:
      type: object
      properties:
        email_id:
          type: string
          description: Email of the contact associated with the order
        ext_id:
          type: string
          description: ext_id associated with the order
        loyalty_subscription_id:
          type: string
          description: loyalty_subscription_id associated with the order
        phone_id:
          type: string
          description: Phone number of the contact associated with the order
      description: Identifies the contact associated with the order.
      title: OrderIdentifiers
    OrderMetaInfo:
      oneOf:
        - type: string
        - type: integer
        - type: boolean
      title: OrderMetaInfo
    OrderProductsItems:
      type: object
      properties:
        price:
          type: number
          format: double
          description: The price of a unit of product
        productId:
          type: string
          description: ID of the product.
        variantId:
          type: string
          description: Product ID of the red color shirts.
        quantity:
          type: integer
          description: '**Required if quantityFloat is empty.**


            Number of product units added to the cart (whole numbers only, e.g., 10)

            '
        quantityFloat:
          type: number
          format: double
          description: '**Required if quantity is empty.**


            Number of product units added to the cart(supports decimals, e.g., 20.52)

            '
      required:
        - price
        - productId
      description: Details for the Products in an order.
      title: OrderProductsItems
    order:
      type: object
      properties:
        amount:
          type: number
          format: double
          description: Total amount of the order, including all shipping expenses, tax and the price of items.
        billing:
          $ref: '#/components/schemas/OrderBilling'
          description: Billing details of an order.
        coupons:
          type: array
          items:
            type: string
          description: Coupons applied to the order. Stored case insensitive.
        createdAt:
          type: string
          description: Event occurrence UTC date-time (YYYY-MM-DDTHH:mm:ssZ), when order is actually created.
        id:
          type: string
          description: Unique ID of the order.
        identifiers:
          $ref: '#/components/schemas/OrderIdentifiers'
          description: Identifies the contact associated with the order.
        metaInfo:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/OrderMetaInfo'
          description: Meta data of order to store additional detail such as custom message, customer type, source.
        products:
          type: array
          items:
            $ref: '#/components/schemas/OrderProductsItems'
        status:
          type: string
          description: State of the order.
        storeId:
          type: string
          description: ID of store where the order is placed
        updatedAt:
          type: string
          description: Event updated UTC date-time (YYYY-MM-DDTHH:mm:ssZ), when the status of the order is actually changed/updated.
      required:
        - amount
        - createdAt
        - id
        - products
        - status
        - updatedAt
      title: order
    OrdersStatusPostResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
        - invalid_parameter
        - missing_parameter
        - out_of_range
        - campaign_processing
        - campaign_sent
        - document_not_found
        - not_enough_credits
        - permission_denied
        - duplicate_parameter
        - duplicate_request
        - method_not_allowed
        - unauthorized
        - account_under_validation
        - not_acceptable
        - bad_request
        - unprocessable_entity
        - Domain does not exist
        - Contact email not found
        - Attribute not found
        - Category id not found
        - Invalid parameters passed
        - Record(s) for identifier not found
        - Returned when query params are invalid
        - Returned when invalid data posted
        - Feed not found
        - Campaign ID not found
        - api-key not found
        - DMARC policy requires domain authentication
        - DNS records not properly configured
        - Invalid OTP code provided
        - OTP code has expired
        - Domain already exists in your account
        - The sum of all IP weights must equal 100
        - Authentication failed
        - Insufficient credits
        - Request already processed
      description: Error code displayed in case of a failure
      title: OrdersStatusPostResponsesContentApplicationJsonSchemaCode
    CreateOrderRequestBadRequestError:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/OrdersStatusPostResponsesContentApplicationJsonSchemaCode'
          description: Error code displayed in case of a failure
        message:
          type: string
          description: Readable message associated to the failure
      required:
        - code
        - message
      title: CreateOrderRequestBadRequestError
    Ecommerce_createBatchOrder_Response_202:
      type: object
      properties:
        count:
          type: integer
          format: int64
          description: Number of orders
        batch_id:
          type:
            - number
            - 'null'
          format: double
          description: Batch ID of the request
      required:
        - batch_id
      title: Ecommerce_createBatchOrder_Response_202
    OrdersStatusBatchPostResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
        - invalid_parameter
        - missing_parameter
        - out_of_range
        - campaign_processing
        - campaign_sent
        - document_not_found
        - not_enough_credits
        - permission_denied
        - duplicate_parameter
        - duplicate_request
        - method_not_allowed
        - unauthorized
        - account_under_validation
        - not_acceptable
        - bad_request
        - unprocessable_entity
        - Domain does not exist
        - Contact email not found
        - Attribute not found
        - Category id not found
        - Invalid parameters passed
        - Record(s) for identifier not found
        - Returned when query params are invalid
        - Returned when invalid data posted
        - Feed not found
        - Campaign ID not found
        - api-key not found
        - DMARC policy requires domain authentication
        - DNS records not properly configured
        - Invalid OTP code provided
        - OTP code has expired
        - Domain already exists in your account
        - The sum of all IP weights must equal 100
        - Authentication failed
        - Insufficient credits
