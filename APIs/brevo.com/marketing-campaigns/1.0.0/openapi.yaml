tags:
  - name: emailCampaigns
  - name: smsCampaigns
  - name: whatsAppCampaigns
servers:
  - url: https://api.brevo.com/v3
    description: https://api.brevo.com/v3
components:
  schemas:
    EmailCampaignsGetParametersType:
      type: string
      enum:
        - classic
        - trigger
      title: EmailCampaignsGetParametersType
    EmailCampaignsGetParametersStatus:
      type: string
      enum:
        - suspended
        - archive
        - sent
        - queued
        - draft
        - inProcess
        - inReview
        - cancelling
        - cancelled
      title: EmailCampaignsGetParametersStatus
    EmailCampaignsGetParametersStatistics:
      type: string
      enum:
        - globalStats
        - linksStats
        - statsByDomain
      title: EmailCampaignsGetParametersStatistics
    EmailCampaignsGetParametersSort:
      type: string
      enum:
        - asc
        - desc
      default: desc
      title: EmailCampaignsGetParametersSort
    EmailCampaignsGetResponsesContentApplicationJsonSchemaCampaignsItemsStatus:
      type: string
      enum:
        - draft
        - sent
        - archive
        - queued
        - suspended
        - in_process
        - in_review
        - cancelling
        - cancelled
      description: Status of the campaign
      title: EmailCampaignsGetResponsesContentApplicationJsonSchemaCampaignsItemsStatus
    EmailCampaignsGetResponsesContentApplicationJsonSchemaCampaignsItemsType:
      type: string
      enum:
        - classic
        - trigger
      description: Type of campaign
      title: EmailCampaignsGetResponsesContentApplicationJsonSchemaCampaignsItemsType
    EmailCampaignsGetResponsesContentApplicationJsonSchemaCampaignsItemsEmailExpirationDateUnit:
      type: string
      enum:
        - days
        - weeks
        - months
      description: Unit of the duration
      title: EmailCampaignsGetResponsesContentApplicationJsonSchemaCampaignsItemsEmailExpirationDateUnit
    EmailCampaignsGetResponsesContentApplicationJsonSchemaCampaignsItemsEmailExpirationDate:
      type: object
      properties:
        duration:
          type: integer
          format: int64
          description: Duration of the email expiry
        unit:
          $ref: '#/components/schemas/EmailCampaignsGetResponsesContentApplicationJsonSchemaCampaignsItemsEmailExpirationDateUnit'
          description: Unit of the duration
      description: Expiration date configuration for the email campaign, if set. Contains the duration and unit of the email expiry.
      title: EmailCampaignsGetResponsesContentApplicationJsonSchemaCampaignsItemsEmailExpirationDate
    EmailCampaignsGetResponsesContentApplicationJsonSchemaCampaignsItemsSender:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Sender email of the campaign
        id:
          type: integer
          format: int64
          description: Sender id of the campaign
        name:
          type: string
          description: Sender name of the campaign
      title: EmailCampaignsGetResponsesContentApplicationJsonSchemaCampaignsItemsSender
    getCampaignRecipients:
      type: object
      properties:
        excludedSegments:
          type: array
          items:
            type: integer
            format: int64
          description: Segment IDs excluded from the campaign
        exclusionLists:
          type: array
          items:
            type: integer
            format: int64
        lists:
          type: array
          items:
            type: integer
            format: int64
        segments:
          type: array
          items:
            type: integer
            format: int64
          description: Segment IDs included in the campaign
      required:
        - exclusionLists
        - lists
      title: getCampaignRecipients
    getCampaignStats:
      type: object
      properties:
        appleMppOpens:
          type:
            - integer
            - 'null'
          format: int64
          description: Numbers of times your email has been opened automatically through Apple MPP.
        clickers:
          type:
            - integer
            - 'null'
          format: int64
          description: Number of total clicks for the campaign
        complaints:
          type:
            - integer
            - 'null'
          format: int64
          description: Number of complaints (Spam reports) for the campaign
        deferred:
          type: integer
          format: int64
          description: Number of deferred emails for the campaign
        delivered:
          type:
            - integer
            - 'null'
          format: int64
          description: Number of delivered emails for the campaign
        estimatedViews:
          type: integer
          format: int64
          description: Rate of recipients without any privacy protection option enabled in their email client, applied to all delivered emails
        hardBounces:
          type:
            - integer
            - 'null'
          format: int64
          description: Number of hard bounces for the campaign
        listId:
          type: integer
          format: int64
          description: List Id of email campaign (only in case of get email campaign(s)(not for global stats))
        opensRate:
          type:
            - string
            - 'null'
          title: float
          description: Percentage of recipients who open the email out of your total number of recipients. Depending on your Campaign settings, they may include Apple MPP opens.
        returnBounce:
          type: integer
          format: int64
          description: Total number of non-delivered campaigns for a particular campaign id.
        sent:
          type:
            - integer
            - 'null'
          format: int64
          description: Number of sent emails for the campaign
        softBounces:
          type:
            - integer
            - 'null'
          format: int64
          description: Number of softbounce for the campaign
        trackableViews:
          type:
            - integer
            - 'null'
          format: int64
          description: Recipients without any privacy protection option enabled in their email email client
        trackableViewsRate:
          type: string
          title: float
          description: Rate of recipients without any privacy protection option enabled in their email client
        uniqueClicks:
          type:
            - integer
            - 'null'
          format: int64
          description: Number of unique clicks for the campaign
        uniqueViews:
          type:
            - integer
            - 'null'
          format: int64
          description: Number of unique openings for the campaign
        unsubscriptions:
          type:
            - integer
            - 'null'
          format: int64
          description: Number of unsubscription for the campaign
        viewed:
          type:
            - integer
            - 'null'
          format: int64
          description: Number of openings for the campaign
      required:
        - appleMppOpens
        - clickers
        - complaints
        - delivered
        - hardBounces
        - opensRate
        - sent
        - softBounces
        - trackableViews
        - uniqueClicks
        - uniqueViews
        - unsubscriptions
        - viewed
      title: getCampaignStats
    getDeviceBrowserStats:
      type: object
      properties:
        clickers:
          type: integer
          format: int64
          description: Number of total clicks for the campaign using the particular browser
        uniqueClicks:
          type: integer
          format: int64
          description: Number of unique clicks for the campaign using the particular browser
        uniqueViews:
          type: integer
          format: int64
          description: Number of unique openings for the campaign using the particular browser
        viewed:
          type: integer
          format: int64
          description: Number of openings for the campaign using the particular browser
      required:
        - clickers
        - uniqueClicks
        - uniqueViews
        - viewed
      title: getDeviceBrowserStats
    GetExtendedCampaignStatsStatsByDevice:
      type: object
      properties:
        desktop:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/getDeviceBrowserStats'
          description: Statistics of the campaign on the basis of desktop devices
        mobile:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/getDeviceBrowserStats'
          description: Statistics of the campaign on the basis of mobile devices
        tablet:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/getDeviceBrowserStats'
          description: Statistics of the campaign on the basis of tablet devices
        unknown:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/getDeviceBrowserStats'
          description: Statistics of the campaign on the basis of unknown devices
      title: GetExtendedCampaignStatsStatsByDevice
    getExtendedCampaignStats:
      type: object
      properties:
        campaignStats:
          type: array
          items:
            $ref: '#/components/schemas/getCampaignStats'
          description: List-wise statistics of the campaign.
        globalStats:
          $ref: '#/components/schemas/getCampaignStats'
          description: Overall statistics of the campaign
        linksStats:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Statistics about the number of clicks for each link in the campaign. Keys are the link URLs, values are click counts. Only populated when the `statistics` query parameter is set to `linksStats`.
        mirrorClick:
          type: integer
          format: int64
          description: Number of clicks on mirror link
        remaining:
          type: integer
          format: int64
          description: Number of remaining emails to send
        statsByBrowser:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/getDeviceBrowserStats'
          description: Statistics of the campaign grouped by browser. Only available when retrieving a single campaign with the `statistics` query parameter set to `statsByBrowser`.
        statsByDevice:
          $ref: '#/components/schemas/GetExtendedCampaignStatsStatsByDevice'
        statsByDomain:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/getCampaignStats'
          description: Statistics of the campaign grouped by email domain. Only populated when the `statistics` query parameter is set to `statsByDomain`.
      required:
        - campaignStats
        - globalStats
        - linksStats
        - mirrorClick
        - remaining
      title: getExtendedCampaignStats
    EmailCampaignsGetResponsesContentApplicationJsonSchemaCampaignsItems:
      type: object
      properties:
        attachmentFile:
          type: string
          description: Url of the attachment file. Only available if the campaign has an attachment.
        abTesting:
          type: boolean
          description: Status of A/B Test for the campaign. abTesting = false means it is disabled, & abTesting = true means it is enabled.
        id:
          type: integer
          format: int64
          description: ID of the campaign
        name:
          type: string
          description: Name of the campaign
        previewText:
          type: string
          description: Preview text or preheader of the email campaign
        scheduledAt:
          type: string
          description: UTC date-time on which campaign is scheduled (YYYY-MM-DDTHH:mm:ss.SSSZ)
        sendAtBestTime:
          type: boolean
          description: It is true if you have chosen to send your campaign at best time, otherwise it is false
        splitRule:
          type: integer
          description: The size of your ab-test groups. Only available if `abTesting` flag of the campaign is `true`
        status:
          $ref: '#/components/schemas/EmailCampaignsGetResponsesContentApplicationJsonSchemaCampaignsItemsStatus'
          description: Status of the campaign
        subject:
          type: string
          description: Subject of the campaign. Only available if `abTesting` flag of the campaign is `false`
        subjectA:
          type: string
          description: Subject A of the ab-test campaign. Only available if `abTesting` flag of the campaign is `true`
        subjectB:
          type: string
          description: Subject B of the ab-test campaign. Only available if `abTesting` flag of the campaign is `true`
        type:
          $ref: '#/components/schemas/EmailCampaignsGetResponsesContentApplicationJsonSchemaCampaignsItemsType'
          description: Type of campaign
        winnerCriteria:
          type: string
          description: Criteria for the winning version. Only available if `abTesting` flag of the campaign is `true`
        winnerDelay:
          type: integer
          description: The duration of the test in hours at the end of which the winning version will be sent. Only available if `abTesting` flag of the campaign is `true`
        attachmentUrl:
          type: string
          description: URL of the attachment file associated with the campaign. Empty string if no attachment is present.
        createdAt:
          type: string
          description: Creation UTC date-time of the campaign (YYYY-MM-DDTHH:mm:ss.SSSZ)
        emailExpirationDate:
          $ref: '#/components/schemas/EmailCampaignsGetResponsesContentApplicationJsonSchemaCampaignsItemsEmailExpirationDate'
          description: Expiration date configuration for the email campaign, if set. Contains the duration and unit of the email expiry.
        footer:
          type: string
          description: Footer of the campaign
        header:
          type: string
          description: Header of the campaign
        htmlContent:
          type: string
          description: HTML content of the campaign
        inlineImageActivation:
          type: boolean
          description: Status of inline image. inlineImageActivation = false means image can’t be embedded, & inlineImageActivation = true means image can be embedded, in the email.
        mirrorActive:
          type: boolean
          description: Status of mirror links in campaign. mirrorActive = false means mirror links are deactivated, & mirrorActive = true means mirror links are activated, in the campaign
        modifiedAt:
          type: string
          description: UTC date-time of last modification of the campaign (YYYY-MM-DDTHH:mm:ss.SSSZ)
        recurring:
          type: boolean
          description: FOR TRIGGER ONLY ! Type of trigger campaign.recurring = false means contact can receive the same Trigger campaign only once, & recurring = true means contact can receive the same Trigger campaign several times
        replyTo:
          type: string
          format: email
          description: Email defined as the "Reply to" of the campaign
        returnBounce:
          type: integer
          format: int64
          description: Total number of non-delivered campaigns for a particular campaign id.
        sender:
          $ref: '#/components/schemas/EmailCampaignsGetResponsesContentApplicationJsonSchemaCampaignsItemsSender'
        sentDate:
          type: string
          description: Sent UTC date-time of the campaign (YYYY-MM-DDTHH:mm:ss.SSSZ). Only available if 'status' of the campaign is 'sent'
        shareLink:
          type: string
          format: url
          description: Link to share the campaign on social medias
        tag:
          type: string
          description: Tag of the campaign
        tags:
          type: array
          items:
            type: string
          description: List of tags of the campaign
        testSent:
          type: boolean
          description: Retrieved the status of test email sending. (true=Test email has been sent  false=Test email has not been sent)
        toField:
          type: string
          description: Customisation of the "to" field of the campaign
        utmCampaignValue:
          type: string
          description: The utm_campaign value applied to the campaign's tracking links. Falls back to your account's global UTM settings when no custom value was set on the campaign, or the campaign name if neither is configured. Only returned when UTM tracking is enabled on the campaign.
        utmContent:
          type: string
          description: The utm_content value applied to the campaign's tracking links. Falls back to your account's global UTM settings when no custom value was set on the campaign. Only returned when UTM tracking is enabled on the campaign and a value is set at one of these levels.
        utmID:
          type: integer
          format: int64
          description: Legacy numeric utm_id value applied to the campaign's tracking links. Present only when UTM tracking is enabled on the campaign and the resolved utm_id is numeric (typically the campaign's ID). For customer-supplied non-numeric values (for example `promo_042`), read `utmId` (string) instead. Kept for backward compatibility.
        utmId:
          type: string
          description: The utm_id value applied to the campaign's tracking links, returned verbatim as a string. Falls back to your account's global UTM settings when no custom value was set on the campaign. Only returned when UTM tracking is enabled on the campaign and a value is set at one of these levels. Preferred field for new consumers — covers both numeric IDs and customer-supplied non-numeric strings.
        utmMedium:
          type: string
          description: The utm_medium value applied to the campaign's tracking links. Falls back to your account's global UTM settings when no custom value was set on the campaign, or the default `email` if neither is configured. Case is preserved verbatim. Only returned when UTM tracking is enabled on the campaign.
        utmSource:
          type: string
          description: The utm_source value applied to the campaign's tracking links. Falls back to your account's global UTM settings when no custom value was set on the campaign, or the account default (`brevo` or `sendinblue`) if neither is configured. Case is preserved verbatim. Only returned when UTM tracking is enabled on the campaign.
        utmTerm:
          type: string
          description: The utm_term value applied to the campaign's tracking links. Falls back to your account's global UTM settings when no custom value was set on the campaign. Only returned when UTM tracking is enabled on the campaign and a value is set at one of these levels.
        recipients:
          $ref: '#/components/schemas/getCampaignRecipients'
        statistics:
          $ref: '#/components/schemas/getExtendedCampaignStats'
