          required: false
          schema:
            $ref: '#/components/schemas/ContactsFoldersFolderIdListsGetParametersSort'
            default: desc
      responses:
        '200':
          description: Folder's Lists details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contacts_getFolderLists_Response_200'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFolderListsRequestBadRequestError'
        '404':
          description: Folder ID not found
