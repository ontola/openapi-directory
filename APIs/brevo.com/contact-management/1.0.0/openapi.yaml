                  type: boolean
                  default: false
                  description: 'To facilitate the choice to erase any attribute of the existing contacts with empty value. emptyContactsAttributes = true means the empty fields in your import will erase any attribute that currently contain data in Brevo, & emptyContactsAttributes = false means the empty fields will not affect your existing data ( **only available if `updateExistingContacts` set to true **)

                    '
                fileBody:
                  type: string
                  description: '**Mandatory if fileUrl and jsonBody is not defined.** CSV content to be imported. Use semicolon to separate multiple attributes. **Maximum allowed file body size is 10MB** . However we recommend a safe limit of around 8 MB to avoid the issues caused due to increase of file body size while parsing. Please use fileUrl instead to import bigger files.

                    '
                fileUrl:
                  type: string
                  format: url
                  description: '**Mandatory if fileBody and jsonBody is not defined.** URL of the file to be imported (**no local file**). Possible file formats: #### .txt, .csv, .json

                    '
                jsonBody:
                  type: array
                  items:
                    $ref: '#/components/schemas/ContactsImportPostRequestBodyContentApplicationJsonSchemaJsonBodyItems'
                  description: '**Mandatory if fileUrl and fileBody is not defined.** JSON content to be imported. **Maximum allowed json body size is 10MB** . However we recommend a safe limit of around 8 MB to avoid the issues caused due to increase of json body size while parsing. Please use fileUrl instead to import bigger files.

                    '
                listIds:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: '**Mandatory if newList is not defined.** Ids of the lists in which the contacts shall be imported. For example, **[2, 4, 7]**.

                    '
                consentGroupIds:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: '**Optional.** Ids of the consent groups to which all imported contacts will be added. Requires consent groups to be enabled for the organisation. For example, **[1, 3]**.

                    '
                newList:
                  $ref: '#/components/schemas/ContactsImportPostRequestBodyContentApplicationJsonSchemaNewList'
                  description: To create a new list and import the contacts into it, pass the listName and an optional folderId.
                notifyUrl:
                  type: string
                  format: url
                  description: URL that will be called once the import process is finished. For reference, https://help.brevo.com/hc/en-us/articles/360007666479
                smsBlacklist:
                  type: boolean
                  default: false
                  description: To blacklist all the contacts for sms
                updateExistingContacts:
                  type: boolean
                  default: true
                  description: To facilitate the choice to update the existing contacts
      security:
        - api-key: []
  /contacts/consent-groups:
    get:
      operationId: consentGroups_getConsentGroups
      summary: List all consent groups
      description: 'Returns a paginated list of consent groups for the account.


        <Note>This endpoint is only available when the Consent Groups feature is enabled for your account. Returns `403` if the feature is not activated.</Note>'
      tags:
        - consentGroups
      parameters:
        - name: limit
          in: query
          description: Maximum number of results to return (default 10, max 50)
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 50
            default: 10
        - name: offset
          in: query
          description: Number of results to skip (default 0)
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: id
          in: query
          description: Filter by consent group ID
          required: false
          schema:
            type: integer
            format: int64
        - name: name
          in: query
          description: Filter by name (case-insensitive partial match)
          required: false
          schema:
            type: string
        - name: signupMode
          in: query
          description: Filter by signup mode
          required: false
          schema:
            $ref: '#/components/schemas/ContactsConsentGroupsGetParametersSignupMode'
      responses:
        '200':
          description: Paginated list of consent groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentGroupsListResponse'
        '400':
          description: 'Bad request. Possible error codes: `INVALID_ID` (invalid id filter value), `INVALID_SIGNUP_MODE` (invalid signupMode value).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
        '403':
          description: 'Consent Groups feature not enabled for this account. Error code: `CONSENT_GROUP_NOT_ENABLED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
      security:
        - api-key: []
    post:
      operationId: consentGroups_createConsentGroup
      summary: Create a consent group
      description: 'Creates a new consent group for the account.


        <Note>This endpoint is only available when the Consent Groups feature is enabled for your account.</Note>'
      tags:
        - consentGroups
      responses:
        '201':
          description: Consent group created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentGroup'
        '400':
          description: 'Bad request. Possible error codes: `MISSING_REQUIRED_FIELD` (name or signupMode missing), `INVALID_SIGNUP_MODE` (invalid signupMode value), `FIELD_TOO_LONG` (name exceeds 255 or description exceeds 500 characters), `INVALID_LIST_ID` (one or more listIds are invalid).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
        '403':
          description: 'Consent Groups feature not enabled for this account. Error code: `CONSENT_GROUP_NOT_ENABLED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
        '409':
          description: 'A consent group with this name already exists. Error code: `NAME_ALREADY_EXISTS`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsentGroupRequest'
      security:
        - api-key: []
  /contacts/consent-groups/{id}:
    get:
      operationId: consentGroups_getConsentGroup
      summary: Get a consent group
      description: 'Returns a single consent group by ID for the account.


        <Note>This endpoint is only available when the Consent Groups feature is enabled for your account.</Note>'
      tags:
        - consentGroups
      parameters:
        - name: id
          in: path
          description: ID of the consent group
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Consent group details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentGroup'
        '400':
          description: 'Bad request. Error code: `INVALID_ID` (id must be a positive integer).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
        '403':
          description: 'Consent Groups feature not enabled for this account. Error code: `CONSENT_GROUP_NOT_ENABLED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
        '404':
          description: 'Consent group not found. Error code: `CONSENT_GROUP_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
      security:
        - api-key: []
    put:
      operationId: consentGroups_updateConsentGroup
      summary: Update a consent group
      description: 'Updates name, description, or signupMode of a consent group. At least one field must be provided.


        <Note>This endpoint is only available when the Consent Groups feature is enabled for your account.</Note>'
      tags:
        - consentGroups
      parameters:
        - name: id
          in: path
          description: ID of the consent group to update
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Updated consent group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentGroup'
        '400':
          description: 'Bad request. Possible error codes: `INVALID_ID` (id must be a positive integer), `NO_FIELDS_TO_UPDATE` (no fields provided in request body), `INVALID_SIGNUP_MODE` (invalid signupMode value), `FIELD_TOO_LONG` (name exceeds 255 or description exceeds 500 characters).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
        '403':
          description: 'Consent Groups feature not enabled for this account. Error code: `CONSENT_GROUP_NOT_ENABLED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
        '404':
          description: 'Consent group not found. Error code: `CONSENT_GROUP_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
        '409':
          description: 'A consent group with this name already exists. Error code: `NAME_ALREADY_EXISTS`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConsentGroupRequest'
      security:
        - api-key: []
    delete:
      operationId: consentGroups_deleteConsentGroup
      summary: Delete a consent group
      description: 'Deletes a consent group by ID and removes it from all associated contacts.


        <Note>This endpoint is only available when the Consent Groups feature is enabled for your account.</Note>'
      tags:
        - consentGroups
      parameters:
        - name: id
          in: path
          description: ID of the consent group to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Consent group deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: 'Bad request. Error code: `INVALID_ID` (id must be a positive integer).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
        '403':
          description: 'Consent Groups feature not enabled for this account. Error code: `CONSENT_GROUP_NOT_ENABLED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
        '404':
          description: 'Consent group not found. Error code: `CONSENT_GROUP_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
      security:
        - api-key: []
