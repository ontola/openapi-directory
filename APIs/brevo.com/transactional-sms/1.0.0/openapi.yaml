paths:
  /transactionalSMS/send:
    post:
      operationId: transactionalSms_sendAsyncTransactionalSms
      summary: Send SMS message asynchronously to a mobile number
      description: '<Note>If the user includes stop code in the Transactional SMS, then it will be switched to Marketing SMS automatically and it will be interpreted as a Marketing SMS. To send Transactional SMS as Transactional, it is important not to use stop code.

        Note: For adding a stop code, client has to add reply STOP to [STOP_CODE] and the [STOP_CODE] will be replaced with the number.</Note>

        <Note title="For end users in France">Transactional SMS can be sent at any time without time restrictions. However, if a message is categorized as Marketing, it must adhere to specific time restrictions. Messages sent outside of these restricted hours will experience delays and will be processed during allowable times. Specifically, Marketing SMS cannot be processed between 10pm and 8am, on Sundays, and on French public holidays.</Note>'
      tags:
        - transactionalSms
      responses:
        '201':
          description: SMS has been sent successfully to the recipient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transactional_SMS_sendAsyncTransactionalSms_Response_201'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendAsyncTransactionalSmsRequestBadRequestError'
      requestBody:
        description: Values to send a transactional SMS
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/sendTransacSms'
      security:
        - api-key: []
  /transactionalSMS/statistics/aggregatedReport:
    get:
      operationId: transactionalSms_getTransacAggregatedSmsReport
      summary: Get your SMS activity aggregated over a period of time
      description: Retrieve an aggregated report of your transactional SMS activity over a specified time period, including counts for requests, delivered, hard bounces, soft bounces, blocked, unsubscribed, replied, accepted, rejected, and skipped messages. Filter by date range using `startDate` and `endDate` (both required together, YYYY-MM-DD format) or by a number of past `days` (not compatible with date range). You can further narrow results by `tag`. If no date filter is provided, the report covers all available data and returns the auto-detected date range.
      tags:
        - transactionalSms
      parameters:
        - name: startDate
          in: query
          description: '**Mandatory if endDate is used.** Starting date (YYYY-MM-DD) of the report

            '
          required: false
          schema:
            type: string
        - name: endDate
          in: query
          description: '**Mandatory if startDate is used.** Ending date (YYYY-MM-DD) of the report

            '
          required: false
          schema:
            type: string
        - name: days
          in: query
          description: 'Number of days in the past including today (positive integer). **Not compatible with startDate and endDate**

            '
          required: false
          schema:
            type: integer
            format: int64
        - name: tag
          in: query
          description: Filter on a tag
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Aggregated SMS report informations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transactional_SMS_getTransacAggregatedSmsReport_Response_200'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTransacAggregatedSmsReportRequestBadRequestError'
      security:
        - api-key: []
  /transactionalSMS/statistics/reports:
    get:
      operationId: transactionalSms_getTransacSmsReport
      summary: Get your SMS activity aggregated per day
      description: Retrieve a day-by-day breakdown of your transactional SMS activity, with each entry containing the date and counts for requests, delivered, hard bounces, soft bounces, blocked, unsubscribed, replied, accepted, rejected, and skipped messages. Filter by date range using `startDate` and `endDate` (both required together, YYYY-MM-DD format), by a number of past `days` (not compatible with date range), or by `tag`. Results are sorted in descending order by default unless overridden with the `sort` parameter.
      tags:
        - transactionalSms
      parameters:
        - name: startDate
          in: query
          description: '**Mandatory if endDate is used.** Starting date (YYYY-MM-DD) of the report

            '
          required: false
          schema:
            type: string
        - name: endDate
          in: query
          description: '**Mandatory if startDate is used.** Ending date (YYYY-MM-DD) of the report

            '
          required: false
          schema:
            type: string
        - name: days
          in: query
          description: 'Number of days in the past including today (positive integer). **Not compatible with ''startDate'' and ''endDate''**

            '
          required: false
          schema:
            type: integer
            format: int64
        - name: tag
          in: query
          description: Filter on a tag
          required: false
          schema:
            type: string
        - name: sort
          in: query
          description: Sort the results in the ascending/descending order of record creation. Default order is **descending** if `sort` is not passed
          required: false
          schema:
            $ref: '#/components/schemas/TransactionalSmsStatisticsReportsGetParametersSort'
            default: desc
      responses:
        '200':
          description: Aggregated SMS report informations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transactional_SMS_getTransacSmsReport_Response_200'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTransacSmsReportRequestBadRequestError'
      security:
        - api-key: []
  /transactionalSMS/statistics/events:
    get:
      operationId: transactionalSms_getSmsEvents
      summary: Get all your SMS activity (unaggregated events)
      description: Retrieve a paginated list of individual SMS event records (unaggregated), including event type, phone number, message ID, timestamp, tag, and reason or reply content where applicable. Results default to 50 per page (max 100) and are sorted in descending order unless overridden. Filter by date range (`startDate`/`endDate`), past `days` (not compatible with date range), specific `event` type (e.g. delivered, bounces, replies), `phoneNumber`, or `tags`. Bounce events include the failure reason, and reply events include the reply content.
      tags:
        - transactionalSms
      parameters:
        - name: limit
          in: query
          description: Number of documents per page
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 100
            default: 50
        - name: startDate
          in: query
          description: '**Mandatory if endDate is used.** Starting date (YYYY-MM-DD) of the report

            '
          required: false
          schema:
            type: string
        - name: endDate
          in: query
          description: '**Mandatory if startDate is used.** Ending date (YYYY-MM-DD) of the report

            '
          required: false
          schema:
            type: string
        - name: offset
          in: query
          description: Index of the first document of the page
          required: false
          schema:
            type: integer
            format: int64
            default: 0
        - name: days
          in: query
          description: 'Number of days in the past including today (positive integer). **Not compatible with ''startDate'' and ''endDate''**

            '
          required: false
          schema:
            type: integer
            format: int64
        - name: phoneNumber
          in: query
          description: Filter the report for a specific phone number
          required: false
          schema:
            type: string
        - name: event
          in: query
          description: Filter the report for specific events
          required: false
          schema:
            $ref: '#/components/schemas/TransactionalSmsStatisticsEventsGetParametersEvent'
        - name: tags
          in: query
          description: Filter the report for specific tags passed as a serialized urlencoded array
          required: false
          schema:
            type: string
        - name: sort
          in: query
          description: Sort the results in the ascending/descending order of record creation. Default order is **descending** if `sort` is not passed
          required: false
          schema:
            $ref: '#/components/schemas/TransactionalSmsStatisticsEventsGetParametersSort'
            default: desc
      responses:
        '200':
          description: Sms events report informations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transactional_SMS_getSmsEvents_Response_200'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSmsEventsRequestBadRequestError'
      security:
        - api-key: []
