                    '
                linkedCompaniesIds:
                  type: array
                  items:
                    type: string
                    format: objectID
                  description: Warning - Using PATCH on linkedCompaniesIds replaces the list of linked companies. Omitted IDs will be removed.
                linkedContactsIds:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: Warning - Using PATCH on linkedContactIds replaces the list of linked contacts. Omitted IDs will be removed.
                name:
                  type: string
                  description: Name of deal
      security:
        - api-key: []
  /crm/deals/link-unlink/{id}:
    patch:
      operationId: deals_linkAndUnlinkADealWithContactsAndCompanies
      summary: Link and Unlink a deal with contacts and companies
      description: Link or unlink contacts and companies with a specific deal in a single request. You can simultaneously link new contacts/companies and unlink existing ones by providing the respective ID arrays in the request body.
      tags:
        - deals
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Successfully linked/unlinked contacts/companies with the deal.
          content:
