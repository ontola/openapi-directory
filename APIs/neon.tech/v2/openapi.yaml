            '
        status_reason:
          type: string
          description: 'A short, stable machine-readable reason for a non-active `status`

            (e.g. `cname-not-pointing-at-edge`, `caa-blocks-lets-encrypt`,

            `binding-missing`), suitable for keying an actionable hint. Empty when

            active or pending.

            '
    CustomDomainRegisterRequest:
      type: object
      required:
        - domain
        - entity_type
        - entity_id
      properties:
        domain:
          type: string
          minLength: 3
          maxLength: 254
          description: 'The custom domain to register (for example `dashboard.acme.com`).

            Case-insensitive; normalized to lowercase (a trailing root dot is

            stripped, so the 254-char bound admits a fully-qualified name whose

            normalized form is 253 chars). Neon-managed and internal hostnames are

            rejected.

            '
        entity_type:
          type: string
          minLength: 1
          maxLength: 32
          example: function
          description: 'The kind of branch entity to point the domain at. v1 supports only

