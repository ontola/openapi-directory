        - name
        - storage_object_created
      properties:
        type:
          type: string
          enum:
            - storage_object_created
          description: Trigger type discriminator.
        function_slug:
          type: string
          pattern: ^[a-z0-9]{1,20}$
          description: The branch-local Function slug to invoke.
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: Human-readable name, unique among triggers visible on the branch.
        function_path:
          type: string
          minLength: 1
          maxLength: 2048
          default: /
          description: Path passed to the target Function. Defaults to `/`.
        storage_object_created:
          $ref: '#/components/schemas/FunctionTriggerStorageObjectCreated'
        enabled:
          type: boolean
