          type: string
          minLength: 3
          maxLength: 63
          description: The exact object-storage bucket name to watch.
        prefix:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: ^[^\x00-\x1f\x7f-\x9f]+$
          description: 'Optional object-key prefix of at most 1024 UTF-8 bytes. When omitted,

            every key in the bucket matches. When present, the full object key

