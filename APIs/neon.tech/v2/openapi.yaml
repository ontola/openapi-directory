openapi: 3.0.3
servers:
  - url: https://console.neon.tech/api/v2
info:
  title: Neon API
  description: 'The Neon API is the management API for Neon. Use it to provision, configure, and manage resources such as projects, branches, databases, roles, functions, and object storage.


    See the [Neon API reference](https://neon.com/docs/reference/api) for details, and [Manage API keys](https://neon.com/docs/manage/api-keys/) to create and use API keys.'
  version: v2
  contact:
    email: help@databricks.com
  license:
    name: Proprietary
  x-origin:
    - format: openapi
      url: https://neon.com/api_spec/release/v2.json
      version: '3.0'
  x-conversion:
    - Fetched from https://neon.com/api_spec/release/v2.json on 2026-10-13T00:20:45.745255+00:00; entry source SHA-256 fe60686dc715144125597e78a0ea9bd18ee47eafc2922b1f01cd1278a5099a6f.
    - Validated with openapi-spec-validator 0.9.0 with openapi-schema-validator 0.9.0, the Python jsonschema backend, regress 2026.9.1 ECMAScript regex syntax/matching with no flags, and cycle-safe property collection, plus security requirement name resolution across operations, callbacks and webhooks; no schema constraints removed.
    - Parsed the vendor document and serialized it as YAML with PyYAML 6.0.3; no API content patches or OpenAPI version conversion.
x-readme:
  samples-languages:
    - shell
security:
  - BearerAuth: []
  - CookieAuth: []
  - TokenCookieAuth: []
tags:
  - name: API Key
    description: These methods allow you to create and manage API keys for your Neon account. For related information, see [Manage API keys](https://neon.com/docs/manage/api-keys).
  - name: Operation
    description: These methods allow you to view operation details for your Neon project. For related information, see [Operations](https://neon.com/docs/manage/operations).
  - name: Project
    description: These methods allow you to create and manage Neon projects. For related information, see [Manage projects](https://neon.com/docs/manage/projects).
  - name: Branch
    description: These methods allow you to create and manage branches in your Neon project. For related information, see [Manage branches](https://neon.com/docs/manage/branches).
  - name: Endpoint
    description: These methods allow you to create and manage compute endpoints in your Neon project. For related information, see [Manage compute endpoints](https://neon.com/docs/manage/endpoints).
  - name: Snapshot
    description: These methods allow you to create and manage snapshots.
  - name: Preview
    description: New API methods that are in a Preview state and may be subject to changes.
  - name: Region
    description: These methods allow you to inspect Neon regions.
  - name: Users
    description: These methods allow you to manage your Neon user account.
  - name: Consumption
    description: These methods allow you to view consumption details for your Neon account.
  - name: Organizations
    description: These methods allow you to manage your Neon organizations.
  - name: Auth
    description: These methods allow you to create and manage Neon Auth projects.
  - name: Auth (legacy)
    description: These methods allow you to create and manage Neon Auth projects. Deprecated. See routes with the `Auth` tag instead.
  - name: Storage
    description: These methods allow you to inspect branchable object storage state for Neon branches.
  - name: Buckets
    description: These methods allow you to create and manage branchable object storage buckets and their objects.
  - name: Functions
    description: These methods allow you to create and manage functions on your Neon branches.
  - name: Realtime
    description: These methods allow you to enable and manage Realtime on your branches.
  - name: AI Gateway
    description: These methods allow you to inspect the AI Gateway endpoint for your Neon branches.
  - name: Logs
    description: These methods allow you to query logs emitted by services running on your Neon branches.
  - name: Credentials
    description: These methods allow you to issue and manage scoped credentials on your Neon branches.
paths:
  /projects/{project_id}/advisors:
    parameters:
      - name: project_id
        description: Neon project ID
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9-]{1,60}$
    get:
      summary: Get advisor issues
      description: 'Analyzes the database for security and performance issues.

        Returns a list of issues categorized by severity (ERROR, WARN, INFO).


        Requires read access to the project and Data API enabled.

        '
      operationId: getProjectAdvisorSecurityIssues
      tags:
        - Project
      x-stability-level: alpha
      parameters:
        - name: branch_id
          in: query
          required: false
          description: Branch ID to analyze. If not specified, the project's default branch is used.
          schema:
            type: string
            pattern: ^[a-z0-9-]{1,60}$
        - name: database_name
          in: query
          required: false
          description: Database name to analyze. Required if branch has multiple databases.
          schema:
            type: string
        - name: category
          in: query
          required: false
          description: Filter issues by category
          schema:
            $ref: '#/components/schemas/AdvisorCategory'
        - name: min_severity
          in: query
          required: false
          description: Minimum severity level to include. For example, WARN returns WARN and ERROR issues, excluding INFO.
          schema:
            type: string
            enum:
              - INFO
              - WARN
              - ERROR
      responses:
        '200':
          description: Successfully retrieved security advisor issues
          content:
            application/json:
              schema:
                type: object
                required:
                  - issues
                properties:
                  issues:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdvisorIssue'
        default:
          $ref: '#/components/responses/GeneralError'
  /api_keys:
    get:
      summary: List API keys
      description: 'Retrieves the API keys for your Neon account.

        The response does not include API key tokens. A token is only provided when creating an API key.

        API keys can also be managed in the Neon Console.

        For more information, see [Manage API keys](https://neon.com/docs/manage/api-keys/).

        '
      tags:
        - API Key
      operationId: listApiKeys
      responses:
        '200':
          description: Returned the API keys for the Neon account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKeysListResponseItem'
                example:
                  - id: 165432
                    name: mykey_1
                    created_at: '2022-11-15T20:13:35Z'
                    created_by:
                      id: 629982cc-de05-43db-ae16-28f2399c4910
                      name: John Smith
                      image: http://link.to.image
                    last_used_at: '2022-11-15T20:22:51Z'
                    last_used_from_addr: 192.0.2.255
                  - id: 165433
                    name: mykey_2
                    created_at: '2022-11-15T20:12:36Z'
                    created_by:
                      id: 629982cc-de05-43db-ae16-28f2399c4910
                      name: John Smith
                      image: http://link.to.image
                    last_used_at: '2022-11-15T20:15:04Z'
                    last_used_from_addr: 192.0.2.255
        default:
          $ref: '#/components/responses/GeneralError'
    post:
      summary: Create API key
      description: 'Creates an API key.

        The `key_name` is a user-specified name for the key.

        Returns an `id` and `key`; the `key` is a randomly generated, 64-bit token required to access the Neon API.

        Store the key securely — it is only returned once.

        API keys can also be managed in the Neon Console.

        See [Manage API keys](https://neon.com/docs/manage/api-keys/).

        '
      tags:
        - API Key
      operationId: createApiKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreateRequest'
            example:
              key_name: mykey
        required: true
      responses:
        '200':
          description: Created an API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreateResponse'
              example:
                id: 165434
                key: 9v1faketcjbl4sn1013keyd43n2a8qlfakeog8yvp40hx16keyjo1bpds4y2dfms3
                name: mykey
                created_at: '2022-11-15T20:13:35Z'
                created_by: 629982cc-de05-43db-ae16-28f2399c4910
        default:
          $ref: '#/components/responses/GeneralError'
  /api_keys/{key_id}:
    delete:
      summary: Revoke API key
      description: 'Revokes the specified API key.

        An API key that is no longer needed can be revoked.

        This action cannot be reversed.

        API keys can also be managed in the Neon Console.

        See [Manage API keys](https://neon.com/docs/manage/api-keys/).

        '
      tags:
        - API Key
      operationId: revokeApiKey
      parameters:
        - name: key_id
          in: path
          description: The API key ID
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Revoked the specified API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyRevokeResponse'
              example:
                id: 165435
                name: mykey
                created_at: '2022-11-15T20:13:35Z'
                created_by: 629982cc-de05-43db-ae16-28f2399c4910
                last_used_at: '2022-11-15T20:15:04Z'
                last_used_from_addr: 192.0.2.255
                revoked: true
        default:
          $ref: '#/components/responses/GeneralError'
  /projects/{project_id}/operations/{operation_id}:
    parameters:
      - name: project_id
        in: path
        description: The Neon project ID
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9-]{1,60}$
      - name: operation_id
        in: path
        description: The operation ID
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Retrieve operation details
      description: 'Retrieves details for the specified operation.

        An operation is an action performed on a Neon project resource.

        '
      tags:
        - Operation
      operationId: getProjectOperation
      responses:
        '200':
          description: Returned details for the specified operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
              example:
                operation:
                  id: a07f8772-1877-4da9-a939-3a3ae62d1d8d
                  project_id: floral-king-961888
                  branch_id: br-bitter-sound-247814
                  endpoint_id: ep-dark-snowflake-942567
                  action: create_timeline
                  status: finished
                  failures_count: 0
                  created_at: '2022-10-04T18:20:17Z'
                  updated_at: '2022-10-04T18:20:18Z'
                  total_duration_ms: 100
        default:
          $ref: '#/components/responses/GeneralError'
  /projects:
    get:
      summary: List projects
      description: 'Retrieves a list of projects for the specified organization.

        If using a personal API key, include the `org_id` parameter to specify which organization to work with.

        If using an org API key, `org_id` is automatically inferred from the key.

        For more information, see [Manage organizations using the Neon API](https://neon.com/docs/manage/orgs-api)

        and [Manage projects](https://neon.com/docs/manage/projects/).

        '
      tags:
        - Project
      operationId: listProjects
      parameters:
        - name: cursor
          description: Specify the cursor value from the previous response to retrieve the next batch of projects.
          in: query
          schema:
            type: string
        - name: limit
          description: Specify a value from 1 to 400 to limit number of projects in the response.
          in: query
          schema:
            type: integer
            minimum: 1
            default: 10
            maximum: 400
        - name: search
          description: Search by project `name` or `id`. You can specify partial `name` or `id` values to filter results.
          in: query
          schema:
            type: string
        - name: org_id
          description: Search for projects by `org_id`.
          in: query
          schema:
            type: string
            pattern: ^[a-z0-9-]{1,60}$
        - $ref: '#/components/parameters/TimeoutParam'
        - name: recoverable
          description: 'Show only deleted projects within the recovery window.

            '
          in: query
          x-stability-level: beta
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Returned a list of projects for the Neon account
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ProjectsResponse'
                  - $ref: '#/components/schemas/PaginationResponse'
                  - $ref: '#/components/schemas/ProjectsApplicationsMapResponse'
                  - $ref: '#/components/schemas/ProjectsIntegrationsMapResponse'
              example:
                projects:
                  - id: shiny-wind-028834
                    platform_id: aws
                    region_id: aws-us-east-2
                    name: shiny-wind-028834
                    provisioner: k8s-pod
                    pg_version: 15
                    created_at: '2022-11-23T17:42:25Z'
                    updated_at: '2022-11-23T17:42:25Z'
                    proxy_host: us-east-2.aws.neon.tech
                    cpu_used_sec: 0
                    branch_logical_size_limit: 0
                    owner_id: '1232111'
                    creation_source: console
                    store_passwords: true
                    branch_logical_size_limit_bytes: 10800
                    active_time: 100
                  - id: winter-boat-259881
                    platform_id: aws
                    region_id: aws-us-east-2
                    name: winter-boat-259881
                    provisioner: k8s-pod
                    pg_version: 15
                    created_at: '2022-11-23T17:52:25Z'
                    updated_at: '2022-11-23T17:52:25Z'
                    proxy_host: us-east-2.aws.neon.tech
                    cpu_used_sec: 0
                    branch_logical_size_limit: 0
                    owner_id: '1232111'
                    creation_source: console
                    store_passwords: true
                    branch_logical_size_limit_bytes: 10800
                    active_time: 100
                    org_id: org-morning-bread-81040908
                applications:
                  winter-boat-259881:
                    - vercel
                    - github
                integrations:
                  winter-boat-259881:
                    - vercel
                    - github
        default:
          $ref: '#/components/responses/GeneralError'
    post:
      summary: Create project
      description: 'Creates a Neon project within an organization.

        If using a personal API key, include the `org_id` parameter to specify which organization to create the project in.

        If using an org API key, `org_id` is automatically inferred from the key.

        Plan limits define how many projects you can create.

        For more information, see [Manage projects](https://neon.com/docs/manage/projects/).


        You can specify a region and Postgres version in the request body.

        Neon supports Postgres 14 through 18, with 19 rolling out to enabled regions.

        For supported regions and `region_id` values, see [Regions](https://neon.com/docs/introduction/regions/).

        '
      tags:
        - Project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
            examples:
              required_attributes_only:
                summary: Required attributes only
                value:
                  project:
                    name: myproject
              commonly_specified_attributes:
                summary: Commonly-specified attributes
                value:
                  project:
                    name: myproject
                    region_id: aws-us-east-2
                    pg_version: 15
              with_autoscaling:
                summary: With autoscaling attributes
                value:
                  project:
                    name: myproject
                    region_id: aws-us-east-2
                    pg_version: 15
                    autoscaling_limit_min_cu: 0.25
                    autoscaling_limit_max_cu: 1
                    provisioner: k8s-neonvm
              with_branch_attributes:
                summary: With branch attributes
                value:
                  project:
                    name: myproject
                    region_id: aws-us-east-2
                    pg_version: 15
                    branch:
                      name: mybranch
                      role_name: sally
                      database_name: mydb
      responses:
        '201':
          $ref: '#/components/responses/CreatedProject'
        default:
          $ref: '#/components/responses/GeneralError'
  /projects/shared:
    get:
      summary: List shared projects
      description: 'Retrieves a list of projects shared with your Neon account.

        For more information, see [Manage projects](https://neon.com/docs/manage/projects/).

        '
      tags:
        - Project
      operationId: listSharedProjects
      parameters:
        - name: cursor
          description: Specify the cursor value from the previous response to get the next batch of projects.
          in: query
          schema:
            type: string
        - name: limit
          description: Specify a value from 1 to 400 to limit number of projects in the response.
          in: query
          schema:
            type: integer
            minimum: 1
            default: 10
            maximum: 400
        - name: search
          description: Search query by name or id.
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/TimeoutParam'
      responses:
        '200':
          description: Returned a list of shared projects for the Neon account
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ProjectsResponse'
                  - $ref: '#/components/schemas/PaginationResponse'
              example:
                projects:
                  - id: shiny-wind-028834
                    platform_id: aws
                    region_id: aws-us-east-2
                    name: shiny-wind-028834
                    provisioner: k8s-pod
                    pg_version: 15
                    created_at: '2022-11-23T17:42:25Z'
                    updated_at: '2022-11-23T17:42:25Z'
                    proxy_host: us-east-2.aws.neon.tech
                    cpu_used_sec: 0
                    branch_logical_size_limit: 0
                    owner_id: '1232111'
                    creation_source: console
                    store_passwords: true
                    branch_logical_size_limit_bytes: 10800
                    active_time: 100
                  - id: winter-boat-259881
                    platform_id: aws
                    region_id: aws-us-east-2
                    name: winter-boat-259881
                    provisioner: k8s-pod
                    pg_version: 15
                    created_at: '2022-11-23T17:52:25Z'
                    updated_at: '2022-11-23T17:52:25Z'
                    proxy_host: us-east-2.aws.neon.tech
                    cpu_used_sec: 0
                    branch_logical_size_limit: 0
                    owner_id: '1232111'
                    creation_source: console
                    store_passwords: true
                    branch_logical_size_limit_bytes: 10800
                    active_time: 100
        default:
          $ref: '#/components/responses/GeneralError'
  /projects/{project_id}:
    parameters:
      - name: project_id
        in: path
        description: The Neon project ID
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9-]{1,60}$
    get:
      summary: Retrieve project details
      description: 'Retrieves information about the specified project.

        Returned details include the project settings, compute configuration, history retention, owner information, and current usage metrics.

        '
      tags:
        - Project
      operationId: getProject
      responses:
        '200':
          description: Returned information about the specified project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
              example:
                project:
                  id: shiny-wind-028834
                  platform_id: aws
                  region_id: aws-us-east-2
                  name: shiny-wind-028834
                  provisioner: k8s-pod
                  pg_version: 15
                  history_retention_seconds: 604800
                  created_at: '2022-11-23T17:42:25Z'
