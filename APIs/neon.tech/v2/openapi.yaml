            '
        entity_id:
          type: string
          minLength: 1
          maxLength: 255
          description: 'The target entity''s identifier within the branch. For `function` this

            is the function slug (which must already exist on the branch).

            '
    CustomDomainsListResponse:
      type: object
      required:
        - custom_domains
      properties:
        custom_domains:
          type: array
          items:
            $ref: '#/components/schemas/CustomDomain'
    NeonFunctionUpdateRequest:
      type: object
      required:
        - name
