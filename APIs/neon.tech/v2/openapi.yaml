        - $ref: '#/components/schemas/EndpointsOptionalResponse'
    EndpointOperations:
      allOf:
        - $ref: '#/components/schemas/EndpointResponse'
        - $ref: '#/components/schemas/OperationsResponse'
    DatabaseOperations:
      allOf:
        - $ref: '#/components/schemas/DatabaseResponse'
        - $ref: '#/components/schemas/OperationsResponse'
    RoleOperations:
      allOf:
        - $ref: '#/components/schemas/RoleResponse'
        - $ref: '#/components/schemas/OperationsResponse'
    JWKSCreationOperation:
      allOf:
        - $ref: '#/components/schemas/JWKSResponse'
        - $ref: '#/components/schemas/OperationsResponse'
    AnnotationData:
      type: object
      x-tags:
        - Branch
      required:
        - object
        - value
      properties:
        object:
          $ref: '#/components/schemas/AnnotationObjectData'
          description: Resource that this annotation is attached to.
        value:
          $ref: '#/components/schemas/AnnotationValueData'
        created_at:
          type: string
          format: date-time
          description: Timestamp when the annotation was created, in RFC 3339 format (UTC).
          example: '2025-01-15T10:30:00Z'
        updated_at:
          type: string
          format: date-time
          description: Timestamp of the most recent update to the annotation, in RFC 3339 format (UTC).
          example: '2025-01-15T10:30:00Z'
    AnnotationValueData:
      type: object
      description: A free-form map of string key-value pairs for attaching metadata to a resource (for example, a git commit reference). Maximum 50 entries.
      x-tags:
        - Branch
      maxProperties: 50
      additionalProperties:
        type: string
      example:
        github-commit-ref: github-branch-name
    AnnotationObjectData:
      type: object
      x-tags:
        - Branch
      required:
        - type
        - id
      properties:
        type:
          type: string
          description: Kind of resource the annotation is attached to, for example "branch" or "endpoint".
        id:
          type: string
          description: The annotated object's ID.
    AnnotationCreateValueRequest:
      type: object
      x-tags:
        - Branch
      properties:
        annotation_value:
          $ref: '#/components/schemas/AnnotationValueData'
    AnnotationResponse:
      type: object
      x-tags:
        - Branch
      required:
        - annotation
      properties:
        annotation:
          $ref: '#/components/schemas/AnnotationData'
          description: Annotation data associated with the annotated object.
    AnnotationsMapResponse:
      type: object
      x-tags:
        - Branch
      required:
        - annotations
      properties:
        annotations:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AnnotationData'
          description: Map of annotations keyed by resource identifier, where each value contains the annotation data for that resource.
    ApplicationType:
      type: string
      enum:
        - vercel
        - github
        - datadog
        - opentelemetry
      description: Type of application integration
    ProjectsApplicationsMapResponse:
      type: object
      x-tags:
        - Project
      description: 'A map where key is a project ID and a value is a list of installed applications.

        '
      required:
        - applications
      properties:
        applications:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              $ref: '#/components/schemas/ApplicationType'
          description: Map of project IDs to their installed applications. Each key is a project ID; each value is an array of application types (for example, `vercel`, `github`).
      example:
        applications:
          winter-boat-259881:
            - vercel
            - github
            - datadog
            - opentelemetry
    ProjectsIntegrationsMapResponse:
      type: object
      x-tags:
        - Project
      description: 'A map where key is a project ID and a value is a list of installed integrations.

        '
      required:
        - integrations
      properties:
        integrations:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/ApplicationType'
          description: Map of project IDs to their associated integration details.
      example:
        integrations:
          winter-boat-259881:
            - vercel
            - github
            - datadog
            - opentelemetry
    CursorPaginationResponse:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/CursorPagination'
    CursorPagination:
      type: object
      description: To paginate the response, issue an initial request with `limit` value. Then, add the value returned in the response `.pagination.next` attribute into the request under the `cursor` query parameter to the subsequent request to retrieve next page in pagination. The contents on cursor `next` are opaque, clients are not expected to make any assumptions on the format of the data inside the cursor.
      properties:
        next:
          type: string
          description: Cursor for the next page of results. Pass it as the `cursor` query parameter on the next request. Absent on the last page.
        sort_by:
          type: string
          description: Field by which the results were sorted, echoing the request's sort_by parameter.
        sort_order:
          type: string
          description: Sort order active for this page. Pass back as `sort_order` in the next request to maintain consistent ordering. Valid values are `asc` and `desc`.
    Snapshot:
      type: object
      required:
        - id
        - name
        - created_at
      properties:
        id:
          description: The snapshot ID.
          type: string
          pattern: ^[a-z0-9-]{1,60}$
        name:
          type: string
          description: Human-readable label for the snapshot.
        lsn:
          type: string
          description: WAL position (Log Sequence Number) at which the snapshot was captured, in Postgres LSN format (for example, `0/3000000`).
        timestamp:
          type: string
          description: Point in time captured by the snapshot, in RFC 3339 format (UTC).
        source_branch_id:
          description: Branch from which this snapshot was created.
          type: string
          pattern: ^[a-z0-9-]{1,60}$
        created_at:
          type: string
          description: Timestamp when the snapshot was created, in RFC 3339 format (UTC).
          example: '2025-01-15T10:30:00Z'
        expires_at:
          type: string
          description: RFC 3339 timestamp when the snapshot expires and is eligible for deletion. Null if the snapshot does not have an expiry.
        manual:
          type: boolean
          description: True if the snapshot was created manually rather than by a schedule.
        full_size:
          description: 'Full logical size of the snapshot in bytes at the time it was taken.


            When absent, the logical size has not been calculated yet and the snapshot is not being charged.


            When present, a value of 0 means the snapshot is not being charged.

            '
          type: integer
          format: int64
        diff_size:
          description: 'Incremental Postgres storage size in bytes since the previous scheduled snapshot, when the snapshot is billed on incremental (diff) usage.


            When absent, either the incremental size has not been calculated yet and the snapshot is not being charged, or the snapshot is charged at full logical size (in that case `full_size` is set).

            '
          type: integer
          format: int64
    SnapshotUpdateRequest:
      type: object
      required:
        - snapshot
      properties:
        snapshot:
          type: object
          description: Fields to update on the snapshot. Updatable fields include `name` and `expires_at`.
          properties:
            name:
              type: string
              description: Human-readable label for the snapshot.
            expires_at:
              description: 'The date and time when the snapshot will expire.


                Omit to leave the current expiration unchanged. Send `null` to

                clear the expiration so the snapshot never expires. A future

                timestamp sets the absolute expiration.

                '
              type: string
              format: date-time
              nullable: true
              example: '2030-06-09T18:02:16Z'
    BackupScheduleItem:
      type: object
      required:
        - frequency
      properties:
        frequency:
          type: string
          description: 'How often to take snapshots. Known values: `daily`, `weekly`, `monthly`.

            '
          example: daily
        hour:
          type: integer
          minimum: 0
          maximum: 23
          description: 'The hour of the day to take the snapshot (if applicable).

            '
        day:
          type: integer
          minimum: 1
          maximum: 31
          description: 'The day of the week or month to take the snapshot (if applicable).

            '
        month:
          type: integer
          minimum: 1
          maximum: 12
          description: 'The month of the year to take the snapshot (if applicable).

            '
        retention_seconds:
          type: integer
          minimum: 3600
          maximum: 3024000
          default: 3024000
          description: 'How long to keep a scheduled snapshot (in seconds) before it''s automatically deleted.

            The default is 3024000 seconds (35 days), which is also the maximum.

            Manually created snapshots have no maximum retention: set their `expires_at` instead.

            '
    BackupSchedule:
      type: object
      required:
        - schedule
      properties:
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/BackupScheduleItem'
          description: List of schedule entries defining the backup frequency. At least one entry is required.
    BranchSchemaJSON:
      type: object
      required:
        - tables
      properties:
        tables:
          type: array
          items:
            type: object
            required:
              - schema
              - name
              - columns
            properties:
              schema:
                type: string
                description: Postgres schema (namespace) that contains the table, for example `public`.
              name:
                type: string
                description: Name of the table within the schema.
              columns:
                type: array
                items:
                  type: object
                  required:
                    - name
                    - type
                  properties:
                    name:
                      type: string
                      description: Name of the column.
                    type:
                      type: string
                      description: Postgres data type of the column, for example "integer" or "text".
                    nullable:
                      type: boolean
                      description: Whether the column allows NULL values
                    generated:
                      type: boolean
                      description: Whether the column is a generated (computed) column
                description: Columns belonging to this table, each describing a column's name and attributes.
              constraints:
                type: array
                items:
                  type: object
                  required:
                    - type
                    - columns
                  properties:
                    type:
                      type: string
                      description: 'Type of constraint. Possible values: `primary_key`, `unique`, `foreign_key`

                        '
                    columns:
                      type: array
                      items:
                        type: string
                      minItems: 1
                      description: Column names participating in this constraint
                    name:
                      type: string
                      description: Optional name of the constraint
                    referenced_table:
                      type: object
                      required:
                        - schema
                        - table
                        - columns
                      properties:
                        schema:
                          type: string
                          description: Schema of the referenced table
                        table:
                          type: string
                          description: Name of the referenced table
                        columns:
                          type: array
                          items:
                            type: string
                          description: Names of the referenced columns
                      description: For foreign keys - the referenced table information
                description: Table constraints defined in the branch schema, such as primary key, foreign key, unique, and check constraints.
          description: Tables present in the branch schema.
    BucketAccessLevel:
      type: string
      enum:
        - private
        - public_read
      description: "Controls anonymous access to objects in the bucket.\n- `private`: all reads and writes require authenticated requests (default).\n- `public_read`: anonymous `GetObject`/`HeadObject` requests succeed; listing,\n  writes, and deletes still require authenticated requests.\n"
    Bucket:
      type: object
      required:
        - name
        - access_level
        - created_at
      properties:
        name:
          type: string
          description: The bucket name (unique within a branch).
        access_level:
          $ref: '#/components/schemas/BucketAccessLevel'
        created_at:
          type: string
          format: date-time
          description: 'When the bucket was created. For a bucket inherited from an

            ancestor branch this is the ancestor''s creation time (the branch

            fork never re-creates the bucket).

            '
    BucketCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: The bucket name.
        access_level:
          type: string
          enum:
            - private
            - public_read
          default: private
          description: 'Access level for the bucket. Defaults to `private`. Set to `public_read`

            to allow anonymous `GetObject`/`HeadObject` on objects in this bucket.

            '
    BucketResponse:
      type: object
      required:
        - bucket
      properties:
        bucket:
          $ref: '#/components/schemas/Bucket'
    BucketsListResponse:
      type: object
      required:
        - buckets
      properties:
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/Bucket'
    BranchStorage:
      type: object
      required:
        - enabled
        - s3_endpoint
        - region
        - force_path_style
      properties:
        enabled:
          type: boolean
          description: 'Always `true` in 200 responses. Present for forward compatibility: a

            future version may add intermediate states; callers should treat `true`

            as "object storage is usable for this branch right now."

            '
        s3_endpoint:
          type: string
          format: uri
          description: The S3-compatible endpoint URL for this branch.
          example: https://br-cool-moon-42.storage.c-2.local.neon.build
        region:
          type: string
          description: 'The AWS region for this branch''s object storage. The platform normalizes

            the us-east-1 convention server-side: a non-empty region string is

            always returned in 200 responses (e.g. `"us-east-1"` for the S3

            default region).

            '
          example: us-east-2
        force_path_style:
          type: boolean
          description: 'Whether the S3 client must use path-style addressing

            (bucket-in-path rather than virtual-hosted subdomain).

            Always true: the wildcard TLS cert covers one level of subdomain

            (*.storage.<suffix>), so the branch ID occupies that label and the

            bucket name must travel in the request path, not as a further

            subdomain. Callers must set the S3 SDK''s ForcePathStyle (or

            equivalent) to true.

            '
          example: true
    BranchStorageNotEnabled:
      type: object
      required:
        - code
        - message
        - reason
      properties:
        code:
          type: string
          example: STORAGE_NOT_ENABLED
        message:
          type: string
        reason:
          type: string
          enum:
            - org_not_entitled
            - region_unavailable
            - branch_directory_missing
            - branch_not_found
          description: "Machine-readable reason why object storage is unavailable:\n- `org_not_entitled`: the org's `PlatformBranchableStorage` feature flag is off.\n- `region_unavailable`: the project's region has no object storage admin service wired.\n- `branch_directory_missing`: the branch is not registered in the object storage service.\n- `branch_not_found`: the project or branch does not exist, or the caller does not\n  have access to it.\n"
    ProjectBranchLogSource:
      type: string
      description: The Neon service that emitted the log record.
      enum:
        - function
        - storage
        - pg_endpoint
    ProjectBranchLogSeverity:
      type: string
      description: 'An OpenTelemetry severity level. A minimum severity includes every

        higher level in this order: `trace`, `debug`, `info`, `warn`, `error`,

        `fatal`.

        '
      enum:
        - trace
        - debug
        - info
        - warn
        - error
        - fatal
    ProjectBranchLogDuration:
      type: string
      pattern: ^[0-9]{1,6}(ms|s|m|h|d)$
      description: 'A length of time as a count and a unit, for example `30m`, `6h`, or

        `7d`. Valid units are `ms`, `s`, `m`, `h`, and `d`.

        '
      example: 1h
    ProjectBranchLogsNotAvailable:
      type: object
      required:
        - code
        - message
        - reason
      properties:
        code:
          type: string
          example: LOGS_NOT_AVAILABLE
        message:
          type: string
        reason:
          type: string
          enum:
            - branch_not_found
            - telemetry_not_enabled
          description: "Machine-readable reason why logs cannot be read:\n- `branch_not_found`: the project or branch does not exist, or the caller does not\n  have access to it.\n- `telemetry_not_enabled`: the branch exists but is not collecting telemetry, so it\n  has no logs to serve.\n"
    ProjectBranchLogsInvalidQuery:
      type: object
      required:
        - code
        - message
        - reason
      properties:
        code:
          type: string
          example: LOGS_INVALID_QUERY
        message:
          type: string
        reason:
          type: string
          enum:
            - time_range_too_large
            - invalid_time_range
            - conflicting_time_range
            - invalid_cursor
            - unknown_field
            - invalid_logql
            - conflicting_filters
          description: "Machine-readable reason why the request was rejected:\n- `time_range_too_large`: the requested window spans more than seven days.\n- `invalid_time_range`: `end_time` is not after `start_time`.\n- `conflicting_time_range`: both `since` and `start_time` were supplied.\n- `invalid_cursor`: the supplied `cursor` is malformed, expired, or was issued for a\n  different query.\n- `unknown_field`: the requested `field_name` is not one of the fields the log fields\n  endpoint reports for this branch.\n- `invalid_logql`: the supplied `logql` expression does not parse, or uses a\n  construct this endpoint does not accept.\n- `conflicting_filters`: `logql` was supplied alongside one or more structured\n  filters. Use one or the other.\n"
    ProjectBranchLogsQueryRequest:
      type: object
      x-sensitive:
        - body_contains
        - logql
        - cursor
      properties:
        since:
          allOf:
            - $ref: '#/components/schemas/ProjectBranchLogDuration'
          description: 'Length of the query window, ending at `end_time` or at the current

            time when `end_time` is omitted. Mutually exclusive with

            `start_time`. Prefer this over computing absolute bounds when the

            caller only means "the last hour".

            '
        start_time:
          type: string
          format: date-time
          description: 'Inclusive beginning of the query window. Mutually exclusive with

            `since`. Defaults to one hour before `end_time`, or one hour before

            the current time when both bounds are omitted.

            '
        end_time:
          type: string
          format: date-time
          description: Exclusive end of the query window. Defaults to the current time.
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
          description: Maximum number of log records to return per page.
        cursor:
          type: string
          description: 'Opaque pagination cursor returned as `next_cursor` by a previous

            call. Resume the query after the last record of the previous page,

            repeating the time range and every filter unchanged.

            '
        sort_order:
          type: string
          default: desc
          enum:
            - asc
            - desc
          description: 'Order matching records by timestamp. `desc`, the default, returns

            the newest records first.

            '
        source:
          $ref: '#/components/schemas/ProjectBranchLogSource'
        service_name:
          type: string
          minLength: 1
          description: Match the OpenTelemetry `service.name` resource attribute exactly.
        scope_name:
          type: string
          minLength: 1
          description: Match the OpenTelemetry instrumentation scope name exactly.
        minimum_severity:
          $ref: '#/components/schemas/ProjectBranchLogSeverity'
        severity_text:
          type: string
          minLength: 1
          description: Match the OpenTelemetry severity text exactly.
        body_contains:
          type: string
          minLength: 1
          description: 'Match records whose rendered `message` contains this case-sensitive

            substring.


            Records with a structured body are matched against their JSON

            rendering, so the substring meets JSON syntax rather than prose: a

            bare key name such as `operation` matches every record carrying that

            key, and `http_status: 200` matches none, because the rendering

            contains `"http_status":200` with no space.

            '
        trace_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: 'Match records associated with this OpenTelemetry trace ID. W3C Trace

            Context defines a trace ID as 32 lowercase hex digits, and that is

            what is stored, so an uppercase value is rejected rather than

            silently matching nothing.

            '
        logql:
          type: string
          minLength: 1
          description: 'Escape hatch for selections the structured filters cannot express: a

            raw LogQL expression, evaluated against this branch''s log stream.


            Only stream selectors and line filters are accepted — no

            aggregations and no parser stages. Supplying this alongside any

            structured filter is rejected with `conflicting_filters` rather than

            silently ignoring one of them. `limit`, `sort_order`, and the time

            window still apply.


            This field passes the underlying query language through to the

            caller, so unlike the rest of this contract it may change as that

            backend changes. Prefer the structured filters where they suffice.

            '
          example: '{entity_type="function"} |~ "(?i)timeout"'
    ProjectBranchLogRecord:
      type: object
      required:
        - timestamp
        - message
        - attributes
      properties:
        timestamp:
          type: string
          format: date-time
          description: The OpenTelemetry record timestamp in UTC.
        message:
          type: string
          description: 'The OpenTelemetry log body rendered as text. A body that is already a

            string is returned verbatim. Any other OpenTelemetry `AnyValue` body

            — notably the structured key/value body that `storage` records always

            carry — is rendered as compact JSON with its keys sorted

            alphabetically, for example

            `{"bytes":1024,"operation":"GET","object_key":"a/b.png"}`.

            '
        source:
          $ref: '#/components/schemas/ProjectBranchLogSource'
        entity_id:
          type: string
          description: The Neon identifier of the service instance that emitted the record.
        service_name:
          type: string
          description: The OpenTelemetry `service.name` resource attribute.
        scope_name:
          type: string
          description: The OpenTelemetry instrumentation scope name.
        severity_number:
          type: integer
          minimum: 0
          maximum: 24
          description: The numeric OpenTelemetry severity.
        severity_text:
          type: string
          description: The original OpenTelemetry severity text.
        trace_id:
          type: string
          description: The OpenTelemetry trace ID, when the record belongs to a trace.
        span_id:
          type: string
          description: The OpenTelemetry span ID, when the record belongs to a span.
        attributes:
          type: object
          additionalProperties: true
          description: Customer-defined OpenTelemetry log and resource attributes.
    ProjectBranchLogsQueryResponse:
      type: object
      x-sensitive:
        - logs
        - next_cursor
      required:
        - logs
        - is_truncated
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/ProjectBranchLogRecord'
        next_cursor:
          type: string
          description: 'Pagination cursor to pass as `cursor` on the next request. Empty

            when the response is not truncated.

            '
        is_truncated:
          type: boolean
          description: True when more records matched than were returned.
    ProjectBranchLogFieldsResponse:
      type: object
      required:
        - fields
      properties:
        fields:
          type: array
          description: 'Log field names observed on this branch, each usable as `field_name`

            on the log field-values endpoint. Computed per branch rather than

            fixed by this specification, so clients should not assume a

            particular set.

            '
          items:
            type: string
    ProjectBranchLogFieldValuesResponse:
      type: object
      required:
        - values
        - is_truncated
      properties:
        values:
          type: array
          items:
            type: string
        is_truncated:
          type: boolean
          description: 'True when more distinct values exist than were returned, because

            either the requested `limit` or the server''s own scan cap was

            reached. A caller that filters on a partial list is choosing from an

            arbitrary subset, so narrow `since` or `source` and ask again when

            this is `true`.

            '
    BranchAiGateway:
      type: object
      required:
        - enabled
        - base_url
      properties:
        enabled:
          type: boolean
          description: 'Always `true` in 200 responses. Present for forward compatibility,

            mirroring BranchStorage.enabled.

            '
        base_url:
          type: string
          format: uri
          description: 'The AI-gateway endpoint root for this branch — an OpenAI-compatible

            base URL. No dialect path is included; clients append the route

            (e.g. `/ai-gateway/openai/v1/responses`) themselves.

            '
          example: https://br-cool-moon-42-api.ai.c-2.local.neon.build
    BranchAiGatewayNotEnabled:
      type: object
      required:
        - code
        - message
        - reason
      properties:
        code:
          type: string
          example: AI_GATEWAY_NOT_ENABLED
        message:
          type: string
        reason:
          type: string
          enum:
            - ai_gateway_unavailable
            - branch_not_found
          description: "Machine-readable reason why the AI gateway is unavailable:\n- `ai_gateway_unavailable`: the project's region/cell has no AI gateway configured.\n- `branch_not_found`: the project or branch does not exist, or the caller does not\n  have access to it.\n"
    BucketObject:
      type: object
      required:
        - key
        - size
        - last_modified
        - etag
      properties:
        key:
          type: string
          description: The full object key.
        size:
          type: integer
          format: int64
          description: The object size in bytes.
        last_modified:
          type: string
          format: date-time
          description: The time the object was last modified.
        etag:
          type: string
          description: The object's entity tag (content hash).
    BucketObjectsListResponse:
      type: object
      required:
        - folders
        - objects
        - prefix
        - is_truncated
      properties:
        folders:
          type: array
          description: 'Common prefixes (folder names) collapsed under the requested

            `delimiter`. Empty when no `delimiter` was supplied.

            '
          items:
            type: string
        objects:
          type: array
          description: Objects whose keys did not collapse into a folder.
          items:
            $ref: '#/components/schemas/BucketObject'
        prefix:
          type: string
          description: The prefix that was applied to this listing (echoed back).
        next_cursor:
          type: string
          description: 'Pagination cursor to pass as `cursor` on the next request. Empty

            when the listing is not truncated.

            '
        is_truncated:
          type: boolean
          description: True when more results exist beyond this page.
    BucketObjectsDeletePrefixResponse:
      type: object
      required:
        - deleted
      properties:
        deleted:
          type: integer
          format: int64
          description: 'The number of objects soft-deleted under the prefix. 0 when no live

            object matched the prefix on this branch.

            '
    PresignRequest:
      type: object
      required:
        - operation
      description: 'Options for the presigned URL. The `operation` selects upload (`PUT`)

        or download (`GET`); the remaining fields are optional.

        '
      properties:
        operation:
          type: string
          enum:
            - upload
            - download
          description: 'The transfer direction. `upload` returns a presigned `PUT` URL;

            `download` returns a presigned `GET` URL.

            '
        content_type:
          type: string
          description: 'The `Content-Type` to bind into the signed request. Only meaningful

            for `upload`: when set, the caller MUST send the same `Content-Type`

            header on the `PUT`, and the value is echoed back in the response

            `headers`. Ignored for `download`.

            '
        expires_in_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 604800
          default: 900
          description: 'How long the presigned URL stays valid, in seconds. Defaults to 900

            (15 minutes); capped at 604800 (7 days).

            '
    PresignResponse:
      type: object
      required:
        - url
        - method
        - headers
        - expires_at
      properties:
        url:
          type: string
          description: 'The presigned URL. Transfer the object bytes by issuing

            `method url` with the returned `headers`.

            '
        method:
          type: string
          description: 'The HTTP method to use against `url`: `PUT` for an upload,

            `GET` for a download.

            '
        headers:
          type: object
          additionalProperties:
            type: string
          description: 'Headers the caller MUST send verbatim on the request (e.g.

            `Content-Type` when it was signed on an upload). May be empty.

            '
        expires_at:
          type: string
          format: date-time
          description: When the presigned URL stops being valid.
    CredentialScope:
      type: string
      description: 'A single capability you may request when issuing a credential. A

        credential is granted a set of these; it may only perform actions

        explicitly listed in its scopes.


        This is the *requestable* set. Responses describing an existing

        credential use `GrantedCredentialScope`, which is deliberately wider:

        a credential may have been granted a scope that this endpoint does not

        offer, and a response must be able to report it.

        '
      enum:
        - storage:read
        - storage:write
        - ai_gateway:invoke
        - functions:invoke
    GrantedCredentialScope:
      type: string
      description: 'A single capability a credential actually carries, as reported by

        responses that describe an existing credential.


        This set is a superset of `CredentialScope` (the requestable set)

        because a credential''s scopes are not limited to what this API offers:

        the platform accepts additional scopes for customer-managed (`user`)

        credentials, so one may exist on your branch that was not issued

        through this endpoint. Responses must be able to report such a

        credential rather than fail to describe it — a client that rejected

        the value would, on rotate, discard the replacement secret after the

        rotation had already committed. Treat unknown values as opaque.

        '
      enum:
        - storage:read
        - storage:write
        - ai_gateway:invoke
        - telemetry:write
        - functions:invoke
    CreateCredentialRequest:
      type: object
      required:
        - scopes
        - principal_type
      properties:
        name:
          type: string
          maxLength: 256
          description: Free-form customer label for the credential.
        scopes:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/CredentialScope'
        principal_type:
          type: string
          enum:
            - user
          description: 'Principal type for the credential. Only `user` is customer-managed

            and accepted here. `function` and `system` credentials are

            platform-internal (e.g. function-serve auto-mint, presign signer)

            and are never issued through the customer-facing API.

            '
    CreateCredentialResponse:
      type: object
      required:
        - token_id
        - token_id_short
        - api_token
        - s3_secret_access_key
        - scopes
        - branch_id
        - created_at
      x-sensitive:
        - api_token
        - s3_secret_access_key
      properties:
        token_id:
          type: string
          description: Opaque credential id (e.g. nak_live_<32hex>).
        token_id_short:
          type: string
          description: First 12 hex chars of token_id; safe to log.
        name:
          type: string
          description: Customer-supplied label, echoed back from the request. Absent when not provided.
        api_token:
          type: string
          description: Bearer token; returned exactly once.
        s3_secret_access_key:
          type: string
          description: nsk_live_<64 hex>; the AWS_SECRET_ACCESS_KEY, returned exactly once.
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/GrantedCredentialScope'
        branch_id:
          type: string
          pattern: ^[a-z0-9-]{1,60}$
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: 'When the credential expires; absent means never expires.

            '
    CredentialSecret:
      type: object
      required:
        - token_id
        - api_token
        - s3_secret_access_key
      description: 'The live secrets of an existing credential, recovered on demand by the

        reveal endpoint. `api_token` and `s3_secret_access_key` are the same

        values handed back once at issuance.


        The field set is deliberately narrower than `CreateCredentialResponse`:

        it carries only what reveal can actually recover. `token_id_short`,

        `scopes`, `principal_type`, `created_at` and `expires_at` are metadata,

        not secrets — read them from the list endpoint instead.


        No `branch_id` is returned. Reveal is scoped by `(project_id,

        token_id)`, so the branch in the request path authorizes the call but

        is not proven to be the branch the credential was issued on. Echoing it

        back would assert an anchor this endpoint never verified. For a

        credential''s true anchor branch, read `branch_id` from the list

        endpoint, which is branch-exact.

        '
      x-sensitive:
        - api_token
        - s3_secret_access_key
      properties:
        token_id:
          type: string
          description: Opaque credential id (e.g. nak_live_<32hex>).
        api_token:
          type: string
          description: Bearer token.
        s3_secret_access_key:
          type: string
          description: nsk_live_<64 hex>; the AWS_SECRET_ACCESS_KEY.
    RotateCredentialResponse:
      type: object
      required:
        - token_id
        - token_id_short
        - api_token
        - s3_secret_access_key
        - scopes
        - branch_id
        - principal_type
        - created_at
      x-sensitive:
        - api_token
        - s3_secret_access_key
      description: 'The replacement secret material for an existing credential, returned

        exactly once. `token_id`, `scopes`, `branch_id` and `created_at` are

        unchanged by the rotation — only `api_token` and

        `s3_secret_access_key` are new.

        '
      properties:
        token_id:
          type: string
          description: 'Opaque credential id (e.g. nak_live_<32hex>), unchanged by the

            rotation. Doubles as the `AWS_ACCESS_KEY_ID` for SigV4.

            '
        token_id_short:
          type: string
          description: First 12 hex chars of token_id; safe to log.
        name:
          type: string
          description: Customer-supplied label carried on the credential. Absent when none was set at issuance.
        api_token:
          type: string
          description: The new Bearer token; returned exactly once.
        s3_secret_access_key:
          type: string
          description: The new nsk_live_<64 hex> AWS_SECRET_ACCESS_KEY; returned exactly once.
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/GrantedCredentialScope'
        branch_id:
          type: string
          pattern: ^[a-z0-9-]{1,60}$
        principal_type:
          type: string
          enum:
            - user
          description: 'Always `user`: only customer-managed credentials are rotatable

            through this endpoint.

            '
        created_at:
          type: string
          format: date-time
          description: 'When the credential was originally issued. Rotation replaces the

            secrets in place and does not reset this.

            '
        expires_at:
          type: string
          format: date-time
          description: 'When the credential expires; absent means never expires. Rotation

            does not extend it.

            '
    CredentialMeta:
      type: object
      required:
        - token_id
        - token_id_short
        - scopes
        - principal_type
        - created_at
      properties:
        token_id:
          type: string
          description: Opaque credential id (e.g. nak_live_<32hex>).
        token_id_short:
          type: string
        name:
          type: string
          description: Customer-supplied label; absent when not provided at issuance.
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/GrantedCredentialScope'
        branch_id:
          type: string
          pattern: ^[a-z0-9-]{1,60}$
        principal_type:
          type: string
        function_id:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: 'When the credential expires; absent means never expires. The

            verifier refuses to authenticate after `expires_at <= now()`.

            '
    ListCredentialsResponse:
      type: object
      required:
        - credentials
      properties:
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/CredentialMeta'
    NeonFunction:
      type: object
      required:
        - id
        - slug
        - name
        - invocation_url
        - created_at
      properties:
        id:
          type: string
          description: Opaque, stable function identifier.
        slug:
          type: string
          description: Branch-unique, lowercase DNS-label. Forms the invocation URL's host together with the branch id. Immutable.
        name:
          type: string
          description: Free-form display name.
        invocation_url:
          type: string
          description: URL at which the function is invoked. The host carries `<branch_id>-<slug>` as its first DNS label under a Neon-managed functions domain, and the URL ends with a trailing slash so paths concatenate onto it. Empty string when the function has no servable invoke host (e.g. a deployment without an invocation front-door).
        current_deployment:
          description: 'The most recent deployment, regardless of build status. It may

            still be building or it may have failed. Omitted until the first

            deployment is created.

            '
          allOf:
            - $ref: '#/components/schemas/NeonFunctionDeployment'
        active_deployment:
          description: 'The most recent deployment whose build completed successfully.

            This is the deployment that serves invocations. Omitted until a

            deployment succeeds.

            '
          allOf:
            - $ref: '#/components/schemas/NeonFunctionDeployment'
        created_at:
          type: string
    NeonFunctionDeployment:
      type: object
      required:
        - id
        - status
        - memory_mib
        - runtime
        - created_at
      properties:
        id:
          type: integer
          format: int32
          description: The deployment id, which is the platform version number (monotonic per function).
        status:
          type: string
          enum:
            - pending
            - building
            - completed
            - failed
          description: Build lifecycle status of the deployment.
        memory_mib:
          type: integer
          format: int32
        runtime:
          type: string
        created_at:
          type: string
        environment:
          type: array
          items:
            type: string
          description: 'The NAMES of the deployment''s environment variables, sorted.

            Values are encrypted at rest and are never returned — they are

            write-only. To change a value, deploy the variable with the new

            value; to remove a variable, deploy it with an empty value.

            '
        error:
          type: string
          description: 'Human-readable reason the deployment build failed. Present only

            when `status` is `failed`.

            '
    NeonFunctionResponse:
      type: object
      required:
        - function
      properties:
        function:
          $ref: '#/components/schemas/NeonFunction'
    NeonFunctionsListResponse:
      type: object
      required:
        - functions
      properties:
        functions:
          type: array
          items:
            $ref: '#/components/schemas/NeonFunction'
    TriggerID:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9_.\-]{0,127}$
      minLength: 1
      maxLength: 128
      description: Opaque, server-minted project-wide trigger identifier.
    FunctionTriggerSchedule:
      type: object
      description: A numeric five-field cron schedule interpreted in UTC.
      required:
        - cron
      properties:
        cron:
          type: string
