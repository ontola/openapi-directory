          format: date-time
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/ConsumptionMetricValue'
          description: Consumption metric values recorded for the timeframe.
    ConsumptionMetricValue:
      type: object
      properties:
        metric_name:
          type: string
          description: Name of the consumption metric, such as compute_time or data_storage_bytes_hour.
        value:
          type: integer
          description: Measured quantity for the metric named by `metric_name`.
      required:
        - metric_name
        - value
    ConsumptionHistoryGranularity:
      type: string
      enum:
        - hourly
        - daily
        - monthly
    ConsumptionHistoryQueryMetrics:
      type: array
      items:
        type: string
    ProjectAuditLogLevel:
      type: string
      enum:
        - base
        - extended
        - full
    AvailablePreloadLibrary:
      type: object
      required:
        - library_name
        - description
        - is_default
        - is_experimental
        - version
      properties:
        library_name:
          type: string
          description: Name of the Postgres shared preload library as it appears in the `shared_preload_libraries` parameter (for example, `pg_stat_statements`).
        description:
          type: string
          description: Human-readable explanation of the library's purpose and behavior.
        is_default:
          type: boolean
          description: Whether this library is loaded by default in the `shared_preload_libraries` configuration for new compute endpoints.
        is_experimental:
          type: boolean
          description: Marks the library as experimental. Experimental libraries may be unstable, subject to breaking changes, or not recommended for production use.
        version:
          type: string
          description: Version of the preload library.
    AvailablePreloadLibraries:
      type: object
      properties:
        libraries:
          type: array
          items:
            $ref: '#/components/schemas/AvailablePreloadLibrary'
          description: Preload libraries available for the project's Postgres version. Each entry includes `library_name`, `description`, `is_default`, `is_experimental`, and `version`.
    Branch:
      type: object
      required:
        - id
        - project_id
        - name
        - current_state
        - state_changed_at
        - creation_source
        - created_at
        - updated_at
        - default
        - protected
        - cpu_used_sec
        - active_time_seconds
        - compute_time_seconds
        - written_data_bytes
        - data_transfer_bytes
      properties:
        id:
          description: 'The branch ID. This value is generated when a branch is created. A `branch_id` value has a `br` prefix. For example: `br-small-term-683261`.

            '
          type: string
          pattern: ^[a-z0-9-]{1,60}$
        project_id:
          description: The ID of the project this branch belongs to.
          type: string
          pattern: ^[a-z0-9-]{1,60}$
        parent_id:
          description: 'The `branch_id` of the parent branch

            '
          type: string
          pattern: ^[a-z0-9-]{1,60}$
        parent_lsn:
          description: 'The Log Sequence Number (LSN) on the parent branch from which this branch was created.

            When restoring a branch using the `POST /projects/{project_id}/branches/{branch_id}/restore` endpoint,

            this value isn’t finalized until all operations related to the restore have completed successfully.

            '
          type: string
        parent_timestamp:
          description: 'The point in time on the parent branch from which this branch was created.

            When restoring a branch using the `POST /projects/{project_id}/branches/{branch_id}/restore` endpoint,

            this value isn’t finalized until all operations related to the restore have completed successfully.

            After all the operations completed, this value might stay empty.

            '
          type: string
          format: date-time
        name:
          description: 'The branch name

            '
          type: string
        current_state:
          $ref: '#/components/schemas/BranchState'
        pending_state:
          $ref: '#/components/schemas/BranchState'
        state_changed_at:
          description: 'A UTC timestamp indicating when the `current_state` began

            '
          type: string
          format: date-time
        logical_size:
          description: 'The logical size of the branch, in bytes

            '
          type: integer
          format: int64
        creation_source:
          description: 'The branch creation source

            '
          type: string
        primary:
          deprecated: true
          description: 'Deprecated. Use the `default` field. Whether the branch is the project''s primary branch.

            '
          type: boolean
        default:
          description: 'Whether the branch is the project''s default branch

            '
          type: boolean
        protected:
          description: 'Whether the branch is protected. Protected branches (and their computes) cannot be deleted, archived, or reset, and block deletion of the project.

            '
          type: boolean
        cpu_used_sec:
          deprecated: true
          description: 'Deprecated. Use `compute_time_seconds` instead. CPU seconds used by all of the branch''s compute endpoints, including deleted ones. This value is reset at the beginning of each billing period.

            '
          type: integer
          format: int64
        compute_time_seconds:
          type: integer
          format: int64
          description: Total Postgres compute time consumed by this branch during the current billing period, in CU-seconds (weighted by compute size). Divide by 3600 for CU-hours.
        active_time_seconds:
          type: integer
          format: int64
          description: Total time this branch's compute has been active during the current billing period, in seconds (not weighted by compute size). Distinct from `compute_time_seconds`, which is CU-weighted.
        written_data_bytes:
          type: integer
          format: int64
          description: Data written by this branch during the current billing period, in bytes.
        data_transfer_bytes:
          type: integer
          format: int64
          description: Total data transferred out of the branch, in bytes. Used as a consumption metric.
        created_at:
          description: 'A timestamp indicating when the branch was created

            '
          type: string
          format: date-time
        updated_at:
          description: 'A timestamp indicating when the branch was last updated

            '
          type: string
          format: date-time
        ttl_interval_seconds:
          description: 'The time-to-live (TTL) duration originally configured for the branch, in seconds. This read-only value represents the interval between the time `expires_at` was set and the expiration timestamp itself. It is preserved to ensure the same TTL duration is reapplied when resetting the branch from its parent, and only updates when a new `expires_at` value is set.


            Access to this feature is currently limited to participants in the Early Access Program.

            '
          type: integer
          example: 3600
        expires_at:
          description: 'The timestamp when the branch is scheduled to expire and be automatically deleted. Must be set by the client following the [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6) format with precision up to seconds (such as 2025-06-09T18:02:16Z). Deletion is performed by a background job and may not occur exactly at the specified time.


            Access to this feature is currently limited to participants in the Early Access Program.

            '
          type: string
          format: date-time
          example: '2025-06-09T18:02:16Z'
        last_reset_at:
          description: 'A timestamp indicating when the branch was last reset

            '
          type: string
          format: date-time
        created_by:
          description: 'The resolved user model that contains details of the user/org/integration/api_key used for branch creation. This field is filled only in listing/get/create/get/update/delete methods, if it is empty when calling other handlers, it does not mean that it is empty in the system.

            '
          type: object
          properties:
            name:
              type: string
              description: Display name of the user who created the branch.
            image:
              type: string
              description: The URL to the user's avatar image.
        init_source:
          description: 'Source of initialization for the branch. `parent-data` (default) copies schema and data from the parent. `parent-schema` copies schema only from the parent. `schema-only` creates a root branch with schema only. `import` initializes from an external import.

            '
          type: string
          example: parent-data
        restore_status:
          $ref: '#/components/schemas/BranchRestoreStatus'
        restored_from:
          description: 'ID of the snapshot that was the restore source for this branch

            '
          type: string
        restored_as:
          description: 'ID of the target branch which was replaced when this branch was restored

            '
          type: string
        restricted_actions:
          description: 'A list of actions that are currently restricted for this branch and the reason why.

            '
          type: array
          items:
            $ref: '#/components/schemas/BranchRestrictedAction'
        recovery:
          $ref: '#/components/schemas/BranchRecoveryInfo'
      example:
        id: br-wispy-meadow-118737
        project_id: spring-example-302709
        parent_id: br-aged-salad-637688
        parent_lsn: 0/1DE2850
        name: dev2
        protected: false
        current_state: ready
        state_changed_at: '2022-11-30T20:09:48Z'
        creation_source: console
        created_at: '2022-11-30T19:09:48Z'
        updated_at: '2022-12-01T19:53:05Z'
        default: true
        init_source: parent-data
        data_transfer_bytes: 72911987
        written_data_bytes: 542998300
        compute_time_seconds: 823880990
        active_time_seconds: 922200
        cpu_used_sec: 461100
    BranchState:
      description: "The branch’s state, indicating if it is initializing, ready for use, or archived.\n  * 'init' - the branch is being created but is not available for querying.\n  * 'resetting' - the branch is being reset to a specific point in time or LSN and is not yet available for querying.\n  * 'ready' - the branch is fully operational and ready for querying. Expect normal query response times.\n  * 'archived' - the branch is stored in cost-effective archival Postgres storage. Expect slow query response times.\n"
      type: string
    BranchRestoreStatus:
      description: 'Could be `restored`, `finalized` or `detaching`.

        A `restored` branch becomes permanently `finalized` when you call `finalizeRestoreBranch`

        A `restored` or `finalized` branch may begin `detaching` as a one-time performance optimisation, after which it will continue in its original state

        '
      type: string
    BranchRestrictedAction:
      description: 'An action that is currently restricted for the branch and the reason why.

        '
      type: object
      required:
        - name
        - reason
      properties:
        name:
          description: 'The name of a restricted action on a branch. `restore`: the branch cannot be used as a restore target. `delete-rw-endpoint`: the read-write endpoint for the branch cannot be deleted.

            '
          type: string
          example: restore
        reason:
          description: 'A human-readable explanation of why the action is restricted.

            '
          type: string
    BranchRecoveryInfo:
      description: 'Recovery information for a deleted branch. Only present when listing deleted branches

        with `include_deleted=true`.


        This is part of the Branch Recovery feature, which is in preview and not available to all users.

        '
      type: object
      required:
        - deleted_at
        - recoverable_until
        - deletion_method
      properties:
        deleted_at:
          description: 'Timestamp when the branch was deleted

            '
          type: string
          format: date-time
        recoverable_until:
          description: 'Timestamp when the recovery window expires and the branch will be permanently deleted

            '
          type: string
          format: date-time
        deletion_method:
          description: 'How the branch was deleted: ''user'' for manual deletion, ''ttl'' for TTL expiration

            '
          type: string
          enum:
            - user
            - ttl
    BranchCreateRequestEndpointOptions:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/EndpointType'
        settings:
          $ref: '#/components/schemas/EndpointSettingsData'
          description: 'Compute endpoint settings: `pg_settings` (Postgres parameter overrides such as `work_mem`, `max_connections`) and `preload_libraries`.'
        autoscaling_limit_min_cu:
          description: 'Minimum number of Compute Units the endpoint can scale down to. Minimum 0.25.

            '
          $ref: '#/components/schemas/ComputeUnit'
        autoscaling_limit_max_cu:
          description: 'Maximum number of Compute Units the endpoint can scale up to. Minimum 0.25.

            '
          $ref: '#/components/schemas/ComputeUnit'
        provisioner:
          $ref: '#/components/schemas/Provisioner'
          description: Compute provisioner. `k8s-neonvm` (default) supports Autoscaling; `k8s-pod` is fixed-size compute. Also `docker` and `serverless-platform`.
        suspend_timeout_seconds:
          $ref: '#/components/schemas/SuspendTimeoutSeconds'
          description: 'Scale-to-zero idle timeout, in seconds, before the compute suspends. `0` uses the plan default; `-1` disables scale-to-zero (never suspends). Minimum is plan-dependent (Scale: 60); maximum 604800 (one week). Free cannot change it; Launch can only enable or disable; Scale can set any value.'
    BranchAnonymizedCreateRequest:
      allOf:
        - $ref: '#/components/schemas/AnnotationCreateValueRequest'
        - type: object
          properties:
            branch_create:
              $ref: '#/components/schemas/BranchCreateRequest'
            masking_rules:
              type: array
              items:
                $ref: '#/components/schemas/MaskingRule'
              description: 'List of masking rules to apply to the branch.

                '
            start_anonymization:
              description: 'If true, automatically start anonymization after the branch is created.

                Defaults to false.

                '
              type: boolean
              default: false
    BranchCreateRequest:
      type: object
      properties:
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/BranchCreateRequestEndpointOptions'
          description: Compute endpoints to create together with the branch. If omitted, the branch is created without any compute endpoint. Endpoints can be added to the branch separately after creation.
        branch:
          type: object
          description: Optional configuration for the new branch, for example `name`, `parent_id` (fork from a branch), `parent_lsn` or `parent_timestamp` (point-in-time branching), and `protected`.
          properties:
            parent_id:
              description: 'The `branch_id` of the parent branch. If omitted or empty, the branch will be created from the project''s default branch.

                '
              type: string
              pattern: ^[a-z0-9-]{1,60}$
            name:
              description: 'The branch name

                '
              type: string
              minLength: 1
              maxLength: 256
            parent_lsn:
              description: 'A Log Sequence Number (LSN) on the parent branch. The branch will be created with data from this LSN.

                '
              type: string
            parent_timestamp:
              description: 'A timestamp identifying a point in time on the parent branch. The branch will be created with data starting from this point in time. RFC 3339 format.

                '
              type: string
              format: date-time
              example: '2024-02-26T12:00:00Z'
            protected:
              description: 'Whether the branch is protected. Protected branches (and their computes) cannot be deleted, archived, or reset, and block deletion of the project. Can be gated by `protected_branches_only` in the IP allowlist. Paid plans only.

                '
              type: boolean
              default: false
            realtime:
              description: 'Enable Realtime for the branch with these options. A child of a Realtime branch is enabled

                even when this is omitted.

                '
              $ref: '#/components/schemas/RealtimeOptions'
            archived:
              description: 'Whether to create the branch in the archived state. When omitted, the branch is created as a normal (non-archived) branch.

                '
              type: boolean
            init_source:
              example: parent-data
              description: Source of initialization for the branch. `parent-data` copies schema and data from the parent branch. `parent-schema` copies schema only from the parent branch. `schema-only` creates a new root branch containing schema only, using `parent_id` as the source; optionally, `parent_lsn` or `parent_timestamp` can narrow the source point. `import` initializes the branch from an external import.
              type: string
            expires_at:
              description: 'The timestamp when the branch is scheduled to expire and be automatically deleted. Must be set by the client following the [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6) format with precision up to seconds (such as 2025-06-09T18:02:16Z). Deletion is performed by a background job and may not occur exactly at the specified time.


                Access to this feature is currently limited to participants in the Early Access Program.

                '
              type: string
              format: date-time
              example: '2025-06-09T18:02:16Z'
    BranchUpdateRequest:
      type: object
      required:
        - branch
      properties:
        branch:
          type: object
          description: Branch attributes to update. Supply only the fields you want to change, for example `name` or `protected`.
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 256
              description: New display name for the branch.
            protected:
              type: boolean
              description: 'Whether the branch is protected. Protected branches (and their computes) cannot be deleted, archived, or reset, and block deletion of the project. Can be gated by `protected_branches_only` in the IP allowlist. Paid plans only.

                '
            expires_at:
              description: 'The timestamp when the branch is scheduled to expire and be automatically deleted. Must be set by the client following the [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6) format with precision up to seconds (such as 2025-06-09T18:02:16Z). Deletion is performed by a background job and may not occur exactly at the specified time. If this field is set to null, the expiration timestamp is removed.


                Access to this feature is currently limited to participants in the Early Access Program.

                '
              type: string
              format: date-time
              nullable: true
              example: '2025-06-09T18:02:16Z'
    BranchRestoreRequest:
      type: object
      required:
        - source_branch_id
      properties:
        source_branch_id:
          description: 'The `branch_id` of the restore source branch.

            If `source_timestamp` and `source_lsn` are omitted, the branch will be restored to head.

            If `source_branch_id` is equal to the branch''s id, `source_timestamp` or `source_lsn` is required.

            '
          type: string
          pattern: ^[a-z0-9-]{1,60}$
        source_lsn:
          description: 'A Postgres LSN (for example, `0/1A2B3C4`) on the source branch to restore from.

            Mutually exclusive with `source_timestamp`. Omit both to restore to head.

            '
          type: string
        source_timestamp:
          description: 'A point in time on the source branch to restore from, in RFC 3339 format. When omitted alongside `source_lsn`, the branch is restored to the latest available state of the source branch.

            '
          type: string
          format: date-time
          example: '2024-02-26T12:00:00Z'
        preserve_under_name:
          description: 'Name under which to save the current branch state before restoring. Required when the branch has children or when `source_branch_id` equals the branch being restored; in those cases all existing child branches are moved to the newly created branch. If omitted and not required, the previous state is not preserved.

            '
          type: string
    BranchResponse:
      type: object
      required:
        - branch
      properties:
        branch:
          $ref: '#/components/schemas/Branch'
          description: Branch returned by the request.
    BranchSchemaResponse:
      type: object
      properties:
        sql:
          type: string
          description: Branch schema expressed as SQL DDL statements.
        json:
          $ref: '#/components/schemas/BranchSchemaJSON'
          description: Branch schema represented as a structured JSON object, parallel to the SQL DDL in `sql`.
    BranchSchemaCompareResponse:
      type: object
      properties:
        diff:
          type: string
          description: Unified diff of the SQL schema changes between the compared branches.
    BranchesResponse:
      type: object
      required:
        - branches
      properties:
        branches:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
          description: Branches in the project. Each includes `id`, `name`, `current_state`, and `created_at`.
    BranchesCountResponse:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          format: int
          description: Total number of branches in the project.
    MaskingRule:
      type: object
      required:
        - database_name
        - schema_name
        - table_name
        - column_name
      x-sensitive:
        - database_name
        - schema_name
        - table_name
        - column_name
        - masking_function
        - masking_value
      properties:
        database_name:
          description: 'The name of the database containing the table to be masked

            '
          type: string
        schema_name:
          description: 'The name of the schema containing the table to be masked

            '
          type: string
        table_name:
          description: 'The name of the table containing the column to be masked

            '
          type: string
        column_name:
          description: 'The name of the column to be masked

            '
          type: string
        masking_function:
          description: 'The PostgreSQL Anonymizer masking function to apply.

            Can be a predefined function (e.g., ''anon.random_string(10)'', ''anon.fake_email()'')

            or a custom function definition (e.g., ''anon.hash(column_name)'')

            '
          type: string
        masking_value:
          description: 'A literal value to set on the column when masking.

            '
          type: string
      example:
        database_name: neondb
        schema_name: public
        table_name: users
        column_name: email
        masking_function: anon.fake_email()
    MaskingRulesResponse:
      type: object
      required:
        - masking_rules
      properties:
        masking_rules:
          type: array
          items:
            $ref: '#/components/schemas/MaskingRule'
          description: 'List of masking rules for the branch

            '
    MaskingRulesUpdateRequest:
      type: object
      required:
        - masking_rules
      properties:
        masking_rules:
          type: array
          items:
            $ref: '#/components/schemas/MaskingRule'
          description: 'List of masking rules to apply to the branch.

            This will replace all existing masking rules for the branch.

            '
    AnonymizedBranchStatusResponse:
      type: object
      required:
        - project_id
        - branch_id
        - state
        - created_at
        - updated_at
      x-sensitive:
        - state
      properties:
        project_id:
          description: The ID of the project this branch belongs to.
          type: string
          pattern: ^[a-z0-9-]{1,60}$
        branch_id:
          description: The ID of the anonymized branch.
          type: string
          pattern: ^[a-z0-9-]{1,60}$
        state:
          description: 'The current state of the anonymized branch. `created`: branch record exists but setup has not started. `initialized`: setup is complete and the branch is ready for anonymization. `initialization_error`: an error occurred during setup. `anonymizing`: the anonymization process is currently running. `anonymized`: anonymization completed successfully. `error`: an error occurred during anonymization.

            '
          type: string
          example: created
        status_message:
          description: 'A descriptive message about the current status or any errors

            '
          type: string
        created_at:
          description: 'A timestamp indicating when the anonymized branch was created

            '
          type: string
          format: date-time
        updated_at:
          description: 'A timestamp indicating when the anonymized branch status was last updated

            '
          type: string
          format: date-time
        failed_at:
          description: 'A timestamp indicating when the anonymized branch operation failed (if applicable)

            '
          type: string
          format: date-time
        last_run:
          $ref: '#/components/schemas/AnonymizationRunMetadata'
      example:
        branch_id: br-aged-salad-637688
        project_id: simple-truth-637688
        state: anonymizing
        status_message: Anonymizing table mydb.public.users (3/5)
        created_at: '2022-11-30T18:25:15Z'
        updated_at: '2022-11-30T18:30:22Z'
        last_run:
          started_at: '2022-11-30T18:25:15Z'
          completed_at: '2022-11-30T18:30:22Z'
          triggered_by: df6c5f70-6cbf-4c8c-9e7a-74c3ddbd8f9f
          masked_columns: 12
    AnonymizationRunMetadata:
      type: object
      description: Metadata about the most recent anonymization attempt for the branch.
      properties:
        started_at:
          description: 'Timestamp indicating when the latest anonymization attempt started.

            '
          type: string
          format: date-time
        completed_at:
          description: 'Timestamp indicating when the latest anonymization attempt completed.

            Populated even if the attempt failed.

            '
          type: string
          format: date-time
        triggered_by:
          description: 'UUID of the user who triggered the latest anonymization attempt.

            '
          type: string
          format: uuid
        triggered_by_username:
          description: 'Username of the user who triggered the latest anonymization attempt.

            '
          type: string
        masked_columns:
          description: 'Number of columns that had masking rules applied during the attempt.

            '
          type: integer
    ConnectionParameters:
      type: object
      required:
        - database
        - password
        - role
        - host
        - pooler_host
      x-sensitive:
        - database
        - host
        - pooler_host
        - password
      properties:
        database:
          description: 'Name of the Postgres database used in the connection URI.

            '
          type: string
        password:
          description: 'Authentication password for the role, used in the connection URI.

            '
          type: string
        role:
          description: 'Postgres role used to authenticate the database connection.

            '
          type: string
        host:
          description: 'Hostname of the compute endpoint. Use `pooler_host` for the pooled connection hostname.

            '
          type: string
        pooler_host:
          description: 'PgBouncer (transaction mode) pooled host, the `-pooler` variant of `host`. Connect through it to work around the Postgres `max_connections` limit for serverless or connection-per-request workloads.

            '
          type: string
    ConnectionDetails:
      type: object
      required:
        - connection_uri
        - connection_parameters
      x-sensitive:
        - connection_uri
      properties:
        connection_uri:
          description: 'The connection URI is defined as specified here: [Connection URIs](https://www.postgresql.org/docs/current/libpq-connect.html#LIBPQ-CONNSTRING-URIS)

            The connection URI can be used to connect to a Postgres database with psql or defined in a DATABASE_URL environment variable.

            When creating a branch from a parent with more than one role or database, the response body does not include a connection URI.

            '
          type: string
        connection_parameters:
          $ref: '#/components/schemas/ConnectionParameters'
          description: Individual components of the connection URI (host, port, database, role, and password) as discrete fields, for programmatic use rather than parsing the sibling `connection_uri` string.
    ConnectionURIResponse:
      type: object
      required:
        - uri
      properties:
        uri:
          description: 'The connection URI.

            '
          type: string
    Endpoint:
      type: object
      required:
        - host
        - id
