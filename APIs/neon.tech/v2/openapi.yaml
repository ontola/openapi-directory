        default:
          $ref: '#/components/responses/GeneralError'
    patch:
      summary: Update project
      description: 'Updates the specified project.

        Configurable properties include the project name, default compute settings, history retention period, and IP allowlist.

        '
      tags:
        - Project
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
            example:
              project:
                name: myproject
      responses:
        '200':
          description: Updated the specified project
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ProjectResponse'
                  - $ref: '#/components/schemas/OperationsResponse'
              example:
                operations: []
                project:
                  id: shiny-wind-028834
                  platform_id: aws
                  region_id: aws-us-east-2
                  name: myproject
                  provisioner: k8s-pod
                  pg_version: 15
                  created_at: '2022-11-23T17:42:25Z'
                  updated_at: '2022-12-04T02:39:25Z'
                  proxy_host: us-east-2.aws.neon.tech
                  branch_logical_size_limit: 0
                  cpu_used_sec: 213230
                  owner_id: '1232111'
                  creation_source: console
                  store_passwords: true
                  branch_logical_size_limit_bytes: 10500
                  data_storage_bytes_hour: 1040
                  data_transfer_bytes: 1000000
                  written_data_bytes: 100800
                  compute_time_seconds: 100
                  active_time_seconds: 100
                  history_retention_seconds: 604800
                  consumption_period_start: '2023-02-01T00:00:00Z'
                  consumption_period_end: '2023-03-01T00:00:00Z'
        default:
          $ref: '#/components/responses/GeneralError'
    delete:
      summary: Delete project
      description: 'Deletes the specified project and all its endpoints, branches, databases, and users.

        Deleted projects can be recovered within 7 days using `POST /projects/{project_id}/recover`.

        To list recoverable projects, use `GET /projects?recoverable=true`.

        '
      tags:
        - Project
      operationId: deleteProject
      responses:
        '200':
          description: Deleted the specified project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
              example:
                project:
                  id: bold-cloud-468218
                  platform_id: aws
                  region_id: aws-us-east-2
                  name: bold-cloud-468218
                  provisioner: k8s-pod
                  pg_version: 15
                  created_at: '2022-11-30T18:41:29Z'
                  updated_at: '2022-11-30T18:41:29Z'
                  proxy_host: us-east-2.aws.neon.tech
                  cpu_used_sec: 23004200
                  branch_logical_size_limit: 0
                  owner_id: '1232111'
                  creation_source: console
                  store_passwords: true
                  branch_logical_size_limit_bytes: 10500
                  data_storage_bytes_hour: 1040
                  data_transfer_bytes: 1000000
                  written_data_bytes: 100800
                  compute_time_seconds: 100
                  active_time_seconds: 100
                  history_retention_seconds: 604800
                  consumption_period_start: '2023-02-01T00:00:00Z'
                  consumption_period_end: '2023-03-01T00:00:00Z'
        default:
          $ref: '#/components/responses/GeneralError'
  /projects/{project_id}/recover:
    parameters:
      - name: project_id
        in: path
        description: The Neon project ID
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9-]{1,60}$
    post:
      summary: Recover a deleted project
      description: 'Recovers a deleted project within the 7-day deletion recovery period.

        Restores branches, endpoints, settings, and connection strings.

        Some integrations require manual reconfiguration after recovery.

        To list recoverable projects, use `GET /projects?recoverable=true`.

        '
      tags:
        - Project
      operationId: recoverProject
      x-stability-level: beta
      responses:
        '200':
          description: Returned the recovered project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRecoverResponse'
        default:
          $ref: '#/components/responses/GeneralError'
  /projects/{project_id}/operations:
    get:
      summary: List operations
      description: 'Retrieves a list of operations for the specified Neon project.

        The number of operations returned can be large.

        To paginate the response, issue an initial request with a `limit` value.

        Then, add the `cursor` value that was returned in the response to the next request.

        Operations older than 6 months may be deleted from our systems.

        If you need more history than that, you should store your own history.

        '
      tags:
        - Operation
      operationId: listProjectOperations
      parameters:
        - name: cursor
          description: Specify the cursor value from the previous response to get the next batch of operations
          in: query
          schema:
            type: string
        - name: limit
          description: Specify a value from 1 to 1000 to limit number of operations in the response
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: project_id
          in: path
          description: The Neon project ID
          required: true
