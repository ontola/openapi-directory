    ProjectQuota:
      type: object
      description: 'Per-project consumption quotas. If a quota is exceeded, all active computes

        are automatically suspended and cannot be started via API calls or incoming connections.


        The exception is `logical_size_bytes`, which is enforced per branch.

        If a branch exceeds its `logical_size_bytes` quota, computes can still be started,

        but write operations will fail—allowing data to be deleted to free up space.

        Computes on other branches are not affected.


        Setting `logical_size_bytes` overrides any lower value set by the `neon.max_cluster_size` Postgres setting.


        Quotas are enforced using per-project consumption metrics with the same names.

        These metrics reset at the start of each billing period. `logical_size_bytes`

        is also an exception—it reflects the total data stored in a branch and does not reset.


        A zero or empty quota value means “unlimited.”

        '
      properties:
        active_time_seconds:
          description: 'The total amount of wall-clock time allowed to be spent by the project''s compute endpoints.

            '
          type: integer
          format: int64
          minimum: 0
        compute_time_seconds:
          description: 'The total amount of CPU seconds allowed to be spent by the project''s compute endpoints.

            '
          type: integer
          format: int64
          minimum: 0
        written_data_bytes:
          description: 'Total amount of data written to all of a project''s branches.

            '
          type: integer
          format: int64
          minimum: 0
        data_transfer_bytes:
          description: 'Total amount of data transferred from all of a project''s branches using the proxy.

            '
          type: integer
          format: int64
          minimum: 0
        logical_size_bytes:
          description: 'Limit on the logical size of every project''s branch.


            If a branch exceeds its `logical_size_bytes` quota, computes can still be started,

            but write operations will fail—allowing data to be deleted to free up space.

            Computes on other branches are not affected.


            Setting `logical_size_bytes` overrides any lower value set by the `neon.max_cluster_size` Postgres setting.

            '
          type: integer
          format: int64
          minimum: 0
