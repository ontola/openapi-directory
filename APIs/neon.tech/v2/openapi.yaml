        - Branch
      operationId: finalizeRestoreBranch
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name for the replaced branch. If omitted, a unique name is generated.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsResponse'
        default:
          $ref: '#/components/responses/GeneralError'
