    post:
      summary: Create branch
      description: 'Creates a branch in the specified project.

        No request body is required, but you can specify one to create a compute endpoint or select a non-default parent branch.

        By default, the branch is created from the project''s default branch with no compute endpoint, and the branch name is auto-generated.

        To access the branch, add a `read_write` endpoint.

        Each branch supports one read-write endpoint and multiple read-only endpoints.

        For related information, see [Manage branches](https://neon.com/docs/manage/branches/).

        '
      tags:
        - Branch
      operationId: createProjectBranch
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/BranchCreateRequest'
                - $ref: '#/components/schemas/AnnotationCreateValueRequest'
            examples:
              branch_only:
                summary: Branch only
                value:
                  branch:
                    parent_id: br-aged-salad-637688
                    name: mybranch
              branch_with_endpoint:
                summary: Branch with endpoint
                value:
                  endpoints:
                    - type: read_write
                  branch:
                    parent_id: br-aged-salad-637688
                    name: mybranch
        required: false
      responses:
        '201':
          $ref: '#/components/responses/CreatedBranch'
        default:
          $ref: '#/components/responses/GeneralError'
    get:
      summary: List branches
      description: 'Retrieves a list of branches for the specified project.


        Each Neon project has a root branch named `main`.

        A `branch_id` value has a `br-` prefix.

        A project may contain child branches that were branched from `main` or from another branch.

        A parent branch is identified by the `parent_id` value, which is the `id` of the parent branch.

        For related information, see [Manage branches](https://neon.com/docs/manage/branches/).

        '
      tags:
        - Branch
      operationId: listProjectBranches
      parameters:
        - name: search
          description: Search by branch `name` or `id`. You can specify partial `name` or `id` values to filter results.
          in: query
          schema:
            type: string
        - name: sort_by
          description: Sort the branches by sort_field. If not provided, branches will be sorted by updated_at descending order
          in: query
          schema:
            type: string
            default: updated_at
            enum:
              - name
              - created_at
              - updated_at
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/SortOrderParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: include_deleted
          description: 'If true, return recoverable deleted branches too (soft-deleted within the recovery window).

            If false or not provided, return only active (non-deleted) branches.


            This parameter is part of the Branch Recovery feature, which is in preview and not available to all users.

