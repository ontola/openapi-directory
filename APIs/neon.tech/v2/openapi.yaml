        function_slug:
          type: string
          pattern: ^[a-z0-9]{1,20}$
          description: Replacement branch-local Function slug.
        name:
          type: string
          minLength: 1
          maxLength: 256
        function_path:
          type: string
          minLength: 1
          maxLength: 2048
        storage_object_created:
