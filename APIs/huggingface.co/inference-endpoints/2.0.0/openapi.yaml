        - name: namespace
          in: path
          description: User or organization name
          required: true
          schema:
            type: string
          example: johnDoe
        - name: endpoint
          in: query
          description: Filter by endpoint name
          required: false
          schema:
            type: string
          example: my-endpoint
        - name: username
          in: query
          description: Filter by username
          required: false
          schema:
            type: string
          example: johnDoe
        - name: cursor
          in: query
          description: Pagination cursor
          required: false
          schema:
            type: string
          example: 682c7bb7aa505b11ba0657b6
        - name: limit
          in: query
          description: 'Max results (default: 20)'
