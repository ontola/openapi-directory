  /v3/endpoint/{namespace}/{name}/logs:
    get:
      tags:
        - Endpoints
      summary: Get endpoint logs (structured, paginated) [READ]
      description: "Cursor-based pagination split into two concerns:\n- **Time window** (`since` / `until`, RFC 3339, inclusive): immutable filter carried across all paginated requests\n  for a given view.\n- **Cursor** (`after` / `before`): opaque pagination cursor produced by the API in the `Link` header. Clients MUST\n  treat it as opaque.\n\n`order` controls which side of the window `limit` cuts from (`desc` keeps the\nnewest, `asc` keeps the oldest). Response entries are always returned in\nchronological (ascending) order regardless of `order`.\n\nAll log entries sharing a boundary millisecond are always included, even if\nthat exceeds `limit`.\n\nAlways returns `application/json`. For a kubectl-style line-per-log rendering,\nuse `/v3/endpoint/{namespace}/{name}/logs/download`."
      operationId: get_endpoint_logs_v3
      parameters:
        - name: namespace
          in: path
          description: User or organization name
          required: true
          schema:
            type: string
          example: johnDoe
        - name: name
          in: path
          description: Endpoint name
          required: true
          schema:
            type: string
          example: my-endpoint
        - name: replica
          in: query
          description: Replica ID
          required: false
          schema:
            type: string
        - name: level
          in: query
          description: Filter by log level
          required: false
          schema:
            type: string
        - name: search
          in: query
          description: Case-insensitive substring search on log line
          required: false
          schema:
            type: string
        - name: since
          in: query
          description: Time window lower bound, inclusive (RFC 3339)
          required: false
          schema:
            type: string
        - name: until
          in: query
          description: Time window upper bound, inclusive (RFC 3339)
          required: false
          schema:
            type: string
        - name: after
          in: query
          description: Opaque pagination cursor (from Link header). Do not construct.
          required: false
          schema:
            type: string
        - name: before
          in: query
          description: Opaque pagination cursor (from Link header). Do not construct.
          required: false
          schema:
            type: string
        - name: order
          in: query
          description: 'Sort direction: asc or desc (default desc — keep newest of the window)'
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Max lines to return (default 1000, max 5000)
          required: false
          schema:
            type: integer
            format: int64
        - name: line_max_length
          in: query
          description: Max line length
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Log entries returned successfully
          headers:
            Link:
              schema:
                type: string
              description: 'Pagination cursors: rel="next", rel="prev" and rel="next_sse"'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogEntry'
        '501':
          description: Log search not available on this deployment
      security:
        - token: []
  /v3/endpoint/{namespace}/{name}/logs/download:
    get:
      tags:
        - Endpoints
      summary: Download endpoint logs as plain text (kubectl-style) [READ]
      description: 'Streams every log line matching the filters as `text/plain; charset=utf-8`,

        chronologically ascending, with no pagination. Format per line:

        `<timestamp> <replica> <level> <line>` — `level` defaults to `INFO`.


        Sets `Content-Disposition: attachment` so a browser downloads the response

        as a file. Capped at `MAX_DOWNLOAD_LINES` for safety; narrow `since`/`until`

        if you need more.'
      operationId: download_endpoint_logs_v3
      parameters:
        - name: namespace
          in: path
          description: User or organization name
          required: true
          schema:
            type: string
          example: johnDoe
        - name: name
          in: path
          description: Endpoint name
          required: true
          schema:
            type: string
          example: my-endpoint
        - name: replica
          in: query
          description: Replica ID
          required: false
          schema:
            type: string
        - name: level
          in: query
          description: Filter by log level
          required: false
          schema:
            type: string
        - name: search
          in: query
          description: Case-insensitive substring search on log line
          required: false
          schema:
            type: string
        - name: since
          in: query
          description: Time window lower bound, inclusive (RFC 3339)
          required: false
          schema:
            type: string
        - name: until
          in: query
          description: Time window upper bound, inclusive (RFC 3339)
          required: false
          schema:
            type: string
        - name: line_max_length
          in: query
          description: Max line length
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Log lines streamed as text/plain
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="<namespace>-<name>-logs.txt"
          content:
            text/plain:
              schema:
                type: string
        '501':
          description: Log search not available on this deployment
      security:
        - token: []
  /v3/endpoint/{namespace}/{name}/logs/sse:
    get:
      tags:
        - Endpoints
      summary: Stream endpoint logs via SSE (structured) [READ]
      operationId: get_endpoint_logs_sse_v3
      parameters:
        - name: namespace
          in: path
          description: User or organization name
          required: true
          schema:
            type: string
          example: johnDoe
        - name: name
          in: path
          description: Endpoint name
          required: true
          schema:
            type: string
          example: my-endpoint
        - name: replica
          in: query
          description: Replica ID
          required: false
          schema:
            type: string
        - name: level
          in: query
          description: Filter by log level
          required: false
          schema:
            type: string
        - name: search
          in: query
          description: Case-insensitive substring search on log line
          required: false
          schema:
            type: string
        - name: since
          in: query
          description: Stream entries logged at/after this timestamp (RFC 3339)
          required: false
          schema:
            type: string
        - name: after
          in: query
          description: Opaque pagination cursor (from Link header rel=next_sse)
          required: false
          schema:
            type: string
        - name: tail
          in: query
          description: Number of recent lines for initial backfill
          required: false
          schema:
            type: integer
            format: int64
        - name: line_max_length
          in: query
          description: Max line length
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: SSE stream of log entries, one per `data:` frame
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/LogEntry'
        '501':
          description: Log search not available on this deployment
      security:
        - token: []
components:
  schemas:
    Accelerator:
      type: string
      enum:
        - cpu
        - gpu
        - neuron
        - zero_gpu
    Account:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
    AllGraphs:
      allOf:
        - $ref: '#/components/schemas/TimeWindow'
        - type: object
          required:
            - replicaIds
            - responseStatusCode
            - responseStatusCodeGrouped
            - responseElapsed
            - pendingRequest
            - replicasStatus
            - replicasRunning
            - hardwareCpu
            - hardwareMem
            - hardwareGpu
            - hardwareGpuMem
          properties:
            hardwareCpu:
              $ref: '#/components/schemas/GraphHardware'
            hardwareGpu:
              $ref: '#/components/schemas/GraphHardware'
            hardwareGpuMem:
              $ref: '#/components/schemas/GraphHardware'
            hardwareMem:
              $ref: '#/components/schemas/GraphHardware'
            inference:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/GraphsInference'
            pendingRequest:
              $ref: '#/components/schemas/GraphPendingRequest'
            replicaIds:
              type: array
              items:
                type: string
            replicasRunning:
              $ref: '#/components/schemas/GraphReplicasRunning'
            replicasStatus:
              $ref: '#/components/schemas/GraphReplicasStatus'
            responseElapsed:
              $ref: '#/components/schemas/GraphElapsed'
            responseStatusCode:
              $ref: '#/components/schemas/GraphStatusCode'
            responseStatusCodeGrouped:
              $ref: '#/components/schemas/GraphStatusCode'
    AuditData:
      type: object
      required:
        - user
        - requestId
        - reason
      properties:
        ip:
          type:
            - string
            - 'null'
        reason:
          $ref: '#/components/schemas/AuditReason'
        requestId:
          type: string
        user:
          $ref: '#/components/schemas/Account'
    AuditLog:
      allOf:
        - $ref: '#/components/schemas/AuditData'
        - type: object
          required:
            - id
            - createdAt
            - level
            - endpoint
          properties:
            createdAt:
              type: string
              format: date-time
            endpoint:
              type: string
            id:
              type: string
            level:
              $ref: '#/components/schemas/Level'
    AuditLogs:
      type: object
      required:
        - list
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
          description: Audit logs
        next_cursor:
          type:
            - string
            - 'null'
          description: Use as query param `cursor` to fetch previous cursor results
        prev_cursor:
          type:
            - string
            - 'null'
          description: Use as query param `cursor` to fetch next cursor results
    AuditReason:
      oneOf:
        - type: object
          required:
            - endpointCreated
          properties:
            endpointCreated:
              $ref: '#/components/schemas/Endpoint'
        - type: object
          required:
            - endpointPaused
          properties:
            endpointPaused:
              type: object
        - type: object
          required:
            - endpointScaledToZero
          properties:
            endpointScaledToZero:
              type: object
        - type: object
          required:
            - endpointResumed
          properties:
            endpointResumed:
              type: object
        - type: object
          required:
            - endpointUpdated
          properties:
            endpointUpdated:
              $ref: '#/components/schemas/UpdatedReason'
        - type: object
          required:
            - endpointDeleted
          properties:
            endpointDeleted:
              type: object
    BaseContainer:
      type: object
      required:
        - url
      properties:
        healthRoute:
          type:
            - string
            - 'null'
          description: Container health route
          example: /health
        port:
          type:
            - integer
            - 'null'
          format: int32
          description: Endpoint API port. If not specified, uses the container's default port.
          example: 80
          minimum: 0
        url:
          type: string
          description: URL for the container
          example: https://host/image:tag
    BaseTgiContainer:
      type: object
      properties:
        maxBatchPrefillTokens:
          type:
            - integer
            - 'null'
          format: int32
          description: Maximum number of prefill tokens used during continuous batching
          example: 2048
          minimum: 0
        maxBatchTotalTokens:
          type:
            - integer
            - 'null'
          format: int32
          description: Maximum number of tokens before moving requests to the next batch
          example: 2048
          minimum: 0
        maxInputLength:
          type:
            - integer
            - 'null'
          format: int32
          description: Maximum input length by query
          example: 1024
          minimum: 0
        maxTotalTokens:
          type:
            - integer
            - 'null'
          format: int32
          description: Maximum number of tokens by query
          example: 1512
          minimum: 0
    CidrListList:
      type: object
      description: Collection of CIDR lists
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CidrListSpec'
    CidrListSpec:
      type: object
      description: CIDR list for IP-based access control
      required:
        - cidrList
        - name
      properties:
        cidrList:
          type: array
          items:
            type: string
          description: IP ranges in CIDR notation
          example:
            - 10.0.0.0/8
            - 192.168.1.0/24
        id:
          type:
            - string
            - 'null'
          description: Unique identifier (generated on creation)
        name:
          type: string
          description: Human-readable name for this CIDR list
          example: office-network
    CommandDiff:
      type: object
      properties:
        args:
          type:
            - array
            - 'null'
          items:
            type: string
        command:
          type:
            - array
            - 'null'
          items:
            type: string
    Compute:
      type: object
      description: Hardware configuration for endpoint replicas
      required:
        - id
        - accelerator
        - numAccelerators
        - memoryGb
        - instanceType
        - instanceSize
        - architecture
        - status
        - pricePerHour
        - quota
      properties:
        accelerator:
          $ref: '#/components/schemas/Accelerator'
          description: Hardware accelerator type (cpu, gpu, neuron)
        architecture:
          type: string
          description: Hardware architecture description
          example: NVIDIA T4
        gpuMemoryGb:
          type:
            - integer
            - 'null'
          format: int32
          description: GPU memory per accelerator in GB
          example: 16
          minimum: 0
        id:
          type: string
          description: Unique compute identifier (vendor-region-type-size)
          example: aws-us-east-1-nvidia-t4-x1
        instanceSize:
          type: string
          description: Instance size multiplier
          example: x1
        instanceType:
          type: string
          description: Instance type identifier
          example: nvidia-t4
        memoryGb:
          type: number
          format: float
          description: RAM per replica in GB
          example: 16.0
        numAccelerators:
          type: integer
          format: int32
          description: Number of accelerator units per replica
          example: 1
          minimum: 0
        numCpus:
          type:
            - integer
            - 'null'
          format: int32
