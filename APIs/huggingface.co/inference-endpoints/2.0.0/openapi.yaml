          required: true
          schema:
            type: string
          example: johnDoe
        - name: tags
          in: query
          description: Filter by tags (comma-separated)
          required: false
          schema:
            type: string
          example: tag1,tag2
        - name: search
          in: query
          description: Filter by name substring
          required: false
          schema:
            type: string
          example: qwen
        - name: cursor
          in: query
          description: Pagination cursor
          required: false
          schema:
            type: string
          example: '3'
        - name: limit
          in: query
          description: 'Max results (default: 20)'
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
          example: '100'
        - name: type
          in: query
          description: 'Filter by endpoint type(s) (comma-separated): public, authenticated, private'
          required: false
          schema:
            type: string
          example: public,private
        - name: task
          in: query
          description: Filter by model task(s) (comma-separated)
          required: false
          schema:
            type: string
          example: text-generation
        - name: state
          in: query
          description: 'Filter by endpoint state(s) (comma-separated): updating, running, paused, failed, scaledToZero'
          required: false
          schema:
            type: string
          example: running,paused
        - name: sortBy
          in: query
          description: 'Field to sort on: createdAt (default), updatedAt, name'
          required: false
          schema:
            type: string
          example: updatedAt
        - name: direction
          in: query
          description: 'Sort direction: asc or desc (default)'
          required: false
          schema:
            type: string
          example: asc
      responses:
        '200':
          description: Endpoints listed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointWithStatusList'
      security:
        - token: []
    post:
      tags:
        - Endpoints
      summary: Create endpoint [WRITE]
      operationId: create_endpoint
      parameters:
