        `Paused`, or `Runtime` error stages. Fails with

        `400 "Endpoint is already running"` if the endpoint is already in

        `Updating` or `Running` stage, and with `400` from a configuration error

        (update the endpoint instead). Quota is re-checked at resume time.'
      operationId: resume_endpoint
      parameters:
        - name: namespace
          in: path
          description: User or organization name
          required: true
          schema:
            type: string
          example: johnDoe
        - name: name
          in: path
          description: Endpoint name
          required: true
          schema:
            type: string
          example: my-endpoint
      responses:
        '200':
          description: Endpoint resumed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointWithStatus'
      security:
        - token: []
  /v2/endpoint/{namespace}/{name}/scale-to-zero:
    post:
      tags:
        - Endpoints
      summary: Scale endpoint to zero [WRITE]
      description: 'Scale the endpoint down to zero replicas and mark it as `Stopped`.

        The endpoint''s spec must have scale-to-zero enabled

        (`scaling.scaleToZeroTimeout` set); otherwise the call returns

        `400 "workload cannot be scaled to zero"`. Not valid when the

        workload is in the `Deleting` stage. Use `POST /resume` to wake

        the endpoint back up.'
      operationId: scale_to_zero_endpoint
      parameters:
        - name: namespace
