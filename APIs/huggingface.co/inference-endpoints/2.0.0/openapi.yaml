                - before
                - after
              properties:
                after:
                  $ref: '#/components/schemas/RouteDiff'
                before:
                  $ref: '#/components/schemas/RouteDiff'
    VLLMContainer:
      allOf:
        - $ref: '#/components/schemas/BaseContainer'
        - type: object
          properties:
            dataParallelSize:
              type:
                - integer
                - 'null'
              format: int32
              description: Number of data parallel groups
              example: 2
              minimum: 0
            kvCacheDtype:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/VllmKvCacheDtype'
                  description: Data type for kv cache
            maxNumBatchedTokens:
              type:
                - integer
                - 'null'
              format: int32
              description: Maximum number of tokens to be processed in a single iteration
              example: 256
              minimum: 0
            maxNumSeqs:
              type:
                - integer
                - 'null'
              format: int32
              description: Maximum number of sequences to be processed in a single iteration.
              example: 8096
              minimum: 0
            tensorParallelSize:
              type:
                - integer
                - 'null'
              format: int32
              description: Number of tensor parallel groups
              example: 8
              minimum: 0
      description: Model served by vLLM
    VLLMNeuronContainer:
      allOf:
        - $ref: '#/components/schemas/BaseContainer'
      description: Model served by vLLM on Neuronx accelerators
    VLLMOmniContainer:
      allOf:
        - $ref: '#/components/schemas/BaseContainer'
        - type: object
          properties:
            deployConfig:
              type:
                - string
                - 'null'
              description: Path to a vLLM-Omni deployment configuration inside the container
              example: /repository/deploy.yaml
            maxNumSeqs:
              type:
                - integer
                - 'null'
              format: int32
              description: Maximum number of requests processed concurrently by each stage
              example: 16
              minimum: 0
      description: Model served by vLLM-Omni
    Vendor:
      type: object
      description: Cloud provider (e.g., AWS, GCP, Azure)
      required:
        - name
        - status
        - regions
      properties:
        name:
          type: string
          description: Provider identifier
          example: aws
        regions:
          type: array
          items:
            $ref: '#/components/schemas/VendorRegion'
          description: Available regions for this provider
        status:
          $ref: '#/components/schemas/Status'
          description: Provider availability status
    VendorQuota:
      type: object
      description: Quota summary for a single provider
      required:
        - name
        - quotas
      properties:
        name:
          type: string
          description: Provider identifier
          example: aws
        quotas:
          type: array
          items:
            $ref: '#/components/schemas/RegionComputeQuota'
          description: Quota details per compute type
    VendorQuotas:
      type: object
      description: Quota summary across all providers
      required:
        - vendors
      properties:
        vendors:
          type: array
          items:
            $ref: '#/components/schemas/VendorQuota'
    VendorRegion:
      type: object
      description: Geographic region within a cloud provider
      required:
        - name
        - label
        - status
        - computes
      properties:
        computes:
          type: array
          items:
            $ref: '#/components/schemas/Compute'
          description: Available compute configurations in this region
        label:
          type: string
          description: Human-readable region name
          example: N. Virginia
        name:
          type: string
          description: Region identifier
          example: us-east-1
        status:
          $ref: '#/components/schemas/Status'
          description: Region availability status
    Vendors:
      type: object
      description: List of provider vendors
      required:
        - vendors
      properties:
        vendors:
          type: array
          items:
            $ref: '#/components/schemas/Vendor'
          description: Vendors list
    VllmKvCacheDtype:
      type: string
      description: From https://docs.vllm.ai/en/stable/api/vllm/config.html#vllm.config.CacheDType
      enum:
        - fp8
        - fp8-e4-m3
        - fp8-e5-m2
  securitySchemes:
    token:
      type: http
      scheme: bearer
tags:
  - name: Endpoints
    description: Create, update, and manage inference endpoints
  - name: Metrics
    description: Endpoint performance and usage metrics
  - name: Audit Logs
    description: Endpoint audit logs (PRO feature)
  - name: Custom Domains
    description: Manage custom domains for endpoints
  - name: CIDR Lists
    description: Manage IP allowlists for endpoint access control
  - name: Providers
    description: List available cloud providers, regions, and compute options
  - name: Private Services
    description: Manage AWS PrivateLink services for private endpoint access
